openapi: 3.2.0
info:
  title: Box Platform Trashed files API
  description: Box Platform provides functionality to provide access to content stored within Box. It provides endpoints for basic manipulation of files and folders, management of users within an enterprise, as well as more complex topics such as legal holds and retention policies.
  termsOfService: https://cloud.app.box.com/s/rmwxu64h1ipr41u49w3bbuvbsa29wku9
  contact:
    name: Box, Inc
    url: https://developer.box.com
    email: devrel@box.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '2024.0'
  x-box-commit-hash: 53bdced3cd
servers:
- url: https://api.box.com/2.0
  description: Box Platform API server.
security:
- OAuth2Security: []
tags:
- name: Trashed files
  description: Files that were deleted and are in trash.
  x-box-tag: trashed_files
paths:
  /files/{file_id}:
    post:
      operationId: post_files_id
      summary: Restore file
      description: 'Restores a file that has been moved to the trash.


        An optional new parent ID can be provided to restore the file to in case the original folder has been deleted.'
      parameters:
      - name: file_id
        in: path
        description: 'The unique identifier that represents a file.


          The ID for any file can be determined by visiting a file in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/files/123` the `file_id` is `123`.'
        required: true
        schema:
          type: string
        example: '12345'
      - name: fields
        in: query
        description: 'A comma-separated list of attributes to include in the response. This can be used to request fields that are not normally returned in a standard response.


          Be aware that specifying this parameter will have the effect that none of the standard fields are returned in the response unless explicitly specified, instead only fields for the mini representation are returned, additional to the fields requested.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - id
        - type
        - name
        explode: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: An optional new name for the file.
                  type: string
                  example: Restored.docx
                parent:
                  allOf:
                  - type: object
                    description: The parent for this item.
                    properties:
                      id:
                        description: The ID of parent item.
                        type: string
                        example: '123'
                  - description: 'Specifies an optional ID of a folder to restore the file to when the original folder no longer exists.


                      Please be aware that this ID will only be used if the original folder no longer exists. Use this ID to provide a fallback location to restore the file to if the original location has been deleted.'
      responses:
        '201':
          description: Returns a file object when the file has been restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashFileRestored'
        '403':
          description: Returns an error if the user does not have access to the folder the file is being restored to, or the user does not have permission to restore files from the trash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '404':
          description: Returns an error if the file is not in the trash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '409':
          description: Returns an error if there is an file with the same name in the folder the file is being restored to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: trashed_files
      tags:
      - Trashed files
      x-codeSamples:
      - lang: curl
        label: Restore file
        source: "curl -i -X POST \"https://api.box.com/2.0/files/12345\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\""
      - lang: dotnet
        label: Restore file
        source: 'await client.TrashedFiles.RestoreFileFromTrashAsync(fileId: file.Id);'
      - lang: swift
        label: Restore file
        source: 'try await client.trashedFiles.restoreFileFromTrash(fileId: file.id)'
      - lang: java
        label: Restore file
        source: client.getTrashedFiles().restoreFileFromTrash(file.getId())
      - lang: node
        label: Restore file
        source: await client.trashedFiles.restoreFileFromTrash(file.id);
      - lang: python
        label: Restore file
        source: client.trashed_files.restore_file_from_trash(file.id)
  /files/{file_id}/trash:
    get:
      operationId: get_files_id_trash
      summary: Get trashed file
      description: 'Retrieves a file that has been moved to the trash.


        Please note that only if the file itself has been moved to the trash can it be retrieved with this API call. If instead one of its parent folders was moved to the trash, only that folder can be inspected using the `GET /folders/:id/trash` API.


        To list all items that have been moved to the trash, please use the `GET /folders/trash/items` API.'
      parameters:
      - name: file_id
        in: path
        description: 'The unique identifier that represents a file.


          The ID for any file can be determined by visiting a file in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/files/123` the `file_id` is `123`.'
        required: true
        schema:
          type: string
        example: '12345'
      - name: fields
        in: query
        description: 'A comma-separated list of attributes to include in the response. This can be used to request fields that are not normally returned in a standard response.


          Be aware that specifying this parameter will have the effect that none of the standard fields are returned in the response unless explicitly specified, instead only fields for the mini representation are returned, additional to the fields requested.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - id
        - type
        - name
        explode: false
      responses:
        '200':
          description: Returns the file that was trashed, including information about when the it was moved to the trash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashFile'
        '404':
          description: 'Returns an error if the file can not be found directly in the trash.


            Please note that a `HTTP 404` is also returned if any of the file''s parent folders have been moved to the trash.


            In that case, only that parent folder can be inspected using the [`GET /folders/:id/trash`](/reference/get-folders-id-trash) API.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: trashed_files
      tags:
      - Trashed files
      x-codeSamples:
      - lang: curl
        label: Get trashed file
        source: "curl -i -X GET \"https://api.box.com/2.0/files/12345/trash\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\""
      - lang: dotnet
        label: Get trashed file
        source: 'await client.TrashedFiles.GetTrashedFileByIdAsync(fileId: file.Id);'
      - lang: swift
        label: Get trashed file
        source: 'try await client.trashedFiles.getTrashedFileById(fileId: file.id)'
      - lang: java
        label: Get trashed file
        source: client.getTrashedFiles().getTrashedFileById(file.getId())
      - lang: node
        label: Get trashed file
        source: await client.trashedFiles.getTrashedFileById(file.id);
      - lang: python
        label: Get trashed file
        source: client.trashed_files.get_trashed_file_by_id(file.id)
    delete:
      operationId: delete_files_id_trash
      summary: Permanently remove file
      description: Permanently deletes a file that is in the trash. This action cannot be undone.
      parameters:
      - name: file_id
        in: path
        description: 'The unique identifier that represents a file.


          The ID for any file can be determined by visiting a file in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/files/123` the `file_id` is `123`.'
        required: true
        schema:
          type: string
        example: '12345'
      responses:
        '204':
          description: Returns an empty response when the file was permanently deleted.
        '404':
          description: Returns an error if the file is not in the trash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: trashed_files
      tags:
      - Trashed files
      x-codeSamples:
      - lang: curl
        label: Permanently remove file
        source: "curl -i -X DELETE \"https://api.box.com/2.0/files/12345/trash\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\""
      - lang: dotnet
        label: Permanently remove file
        source: 'await client.TrashedFiles.DeleteTrashedFileByIdAsync(fileId: file.Id);'
      - lang: swift
        label: Permanently remove file
        source: 'try await client.trashedFiles.deleteTrashedFileById(fileId: file.id)'
      - lang: java
        label: Permanently remove file
        source: client.getTrashedFiles().deleteTrashedFileById(file.getId())
      - lang: node
        label: Permanently remove file
        source: await client.trashedFiles.deleteTrashedFileById(file.id);
      - lang: python
        label: Permanently remove file
        source: client.trashed_files.delete_trashed_file_by_id(file.id)
components:
  schemas:
    Folder--Mini:
      description: A mini representation of a file version, used when nested under another resource.
      type: object
      allOf:
      - $ref: '#/components/schemas/Folder--Base'
      - properties:
          sequence_id:
            allOf:
            - type:
              - string
              - 'null'
              example: '3'
              description: 'A numeric identifier that represents the most recent user event that has been applied to this item.


                This can be used in combination with the `GET /events`-endpoint to filter out user events that would have occurred before this identifier was read.


                An example would be where a Box Drive-like application would fetch an item via the API, and then listen to incoming user events for changes to the item. The application would ignore any user events where the `sequence_id` in the event is smaller than or equal to the `sequence_id` in the originally fetched resource.'
            - {}
          name:
            description: The name of the folder.
            type: string
            example: Contracts
      title: Folder (Mini)
      x-box-resource-id: folder--mini
      x-box-tag: folders
      x-box-variant: mini
    FileVersion--Base:
      description: The bare basic representation of a file version, the minimal amount of fields returned when using the `fields` query parameter.
      type: object
      properties:
        id:
          description: The unique identifier that represent a file version.
          type: string
          example: '12345'
        type:
          description: The value will always be `file_version`.
          type: string
          example: file_version
          enum:
          - file_version
      required:
      - id
      - type
      title: File version (Base)
      x-box-resource-id: file_version--base
      x-box-variant: base
      x-box-variants:
      - base
      - mini
      - standard
      - full
    ClientError:
      description: A generic error.
      type: object
      properties:
        type:
          description: The value will always be `error`.
          type: string
          example: error
          enum:
          - error
        status:
          description: The HTTP status of the response.
          type: integer
          format: int32
          example: 400
        code:
          description: A Box-specific error code.
          type: string
          example: item_name_invalid
          enum:
          - created
          - accepted
          - no_content
          - redirect
          - not_modified
          - bad_request
          - unauthorized
          - forbidden
          - not_found
          - method_not_allowed
          - conflict
          - precondition_failed
          - unprocessable_entity
          - too_many_requests
          - internal_server_error
          - unavailable
          - item_name_invalid
          - insufficient_scope
        message:
          description: A short message describing the error.
          type: string
          example: Method Not Allowed
        context_info:
          description: A free-form object that contains additional context about the error. The possible fields are defined on a per-endpoint basis. `message` is only one example.
          type:
          - object
          - 'null'
          example:
            message: Something went wrong
          additionalProperties: {}
        help_url:
          description: A URL that links to more information about why this error occurred.
          type: string
          example: https://developer.box.com/guides/api-calls/permissions-and-errors/common-errors/
        request_id:
          description: A unique identifier for this response, which can be used when contacting Box support.
          type: string
          example: abcdef123456
      title: Client error
      x-box-resource-id: client_error
    User--Mini:
      description: A mini representation of a user, as can be returned when nested within other resources.
      type: object
      allOf:
      - $ref: '#/components/schemas/User--Base'
      - properties:
          name:
            description: The display name of this user.
            type: string
            example: Aaron Levie
            maxLength: 50
          login:
            description: The primary email address of this user.
            type: string
            format: email
            example: ceo@example.com
      title: User (Mini)
      x-box-resource-id: user--mini
      x-box-tag: users
      x-box-variant: mini
    Folder--Base:
      description: The bare basic representation of a folder, the minimal amount of fields returned when using the `fields` query parameter.
      type: object
      properties:
        id:
          description: 'The unique identifier that represent a folder.


            The ID for any folder can be determined by visiting a folder in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/folders/123` the `folder_id` is `123`.'
          type: string
          example: '12345'
        etag:
          description: The HTTP `etag` of this folder. This can be used within some API endpoints in the `If-Match` and `If-None-Match` headers to only perform changes on the folder if (no) changes have happened.
          type:
          - string
          - 'null'
          example: '1'
        type:
          description: The value will always be `folder`.
          type: string
          example: folder
          enum:
          - folder
      required:
      - id
      - type
      title: Folder (Base)
      x-box-resource-id: folder--base
      x-box-tag: folders
      x-box-variant: base
      x-box-variants:
      - base
      - mini
      - standard
      - full
    FileVersion--Mini:
      description: A mini representation of a file version, used when nested within another resource.
      type: object
      allOf:
      - $ref: '#/components/schemas/FileVersion--Base'
      - properties:
          sha1:
            description: The SHA1 hash of this version of the file.
            type: string
            example: 134b65991ed521fcfe4724b7d814ab8ded5185dc
      title: File version (Mini)
      x-box-resource-id: file_version--mini
      x-box-variant: mini
    TrashFile:
      description: Represents a trashed file.
      type: object
      properties:
        id:
          description: 'The unique identifier that represent a file.


            The ID for any file can be determined by visiting a file in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/files/123` the `file_id` is `123`.'
          type: string
          example: '123456789'
        etag:
          description: The HTTP `etag` of this file. This can be used within some API endpoints in the `If-Match` and `If-None-Match` headers to only perform changes on the file if (no) changes have happened.
          type:
          - string
          - 'null'
          example: '1'
        type:
          description: The value will always be `file`.
          type: string
          example: file
          enum:
          - file
        sequence_id:
          allOf:
          - type:
            - string
            - 'null'
            example: '3'
            description: 'A numeric identifier that represents the most recent user event that has been applied to this item.


              This can be used in combination with the `GET /events`-endpoint to filter out user events that would have occurred before this identifier was read.


              An example would be where a Box Drive-like application would fetch an item via the API, and then listen to incoming user events for changes to the item. The application would ignore any user events where the `sequence_id` in the event is smaller than or equal to the `sequence_id` in the originally fetched resource.'
          - {}
        name:
          description: The name of the file.
          type: string
          example: Contract.pdf
        sha1:
          description: The SHA1 hash of the file. This can be used to compare the contents of a file on Box with a local file.
          type: string
          format: digest
          example: 85136C79CBF9FE36BB9D05D0639C70C265C18D37
        file_version:
          allOf:
          - $ref: '#/components/schemas/FileVersion--Mini'
          - description: The information about the current version of the file.
        description:
          description: The optional description of this file.
          type: string
          example: Contract for Q1 renewal
          maxLength: 256
        size:
          description: The file size in bytes. Be careful parsing this integer as it can get very large and cause an integer overflow.
          type: integer
          example: 629644
        path_collection:
          allOf:
          - title: Path collection (Trash)
            description: A list of parent folders for an item in the trash.
            type: object
            required:
            - total_count
            - entries
            properties:
              total_count:
                description: The number of folders in this list.
                type: integer
                format: int64
                example: 1
              entries:
                description: Array of folders for this item's path collection.
                type: array
                items:
                  type: object
                  description: The parent folder for this item.
                  properties:
                    type:
                      description: The value will always be `folder`.
                      type: string
                      example: folder
                      enum:
                      - folder
                    id:
                      description: The unique identifier that represent a folder.
                      type: string
                      example: '123456789'
                    sequence_id:
                      description: This field is null for the Trash folder.
                      type:
                      - string
                      - 'null'
                      example: null
                    etag:
                      description: This field is null for the Trash folder.
                      type:
                      - string
                      - 'null'
                      example: null
                    name:
                      description: The name of the Trash folder.
                      type: string
                      example: Trash
          - description: The tree of folders that this file is contained in, starting at the root.
          - {}
        created_at:
          description: The date and time when the file was created on Box.
          type: string
          format: date-time
          example: '2012-12-12T10:53:43-08:00'
        modified_at:
          description: The date and time when the file was last updated on Box.
          type: string
          format: date-time
          example: '2012-12-12T10:53:43-08:00'
        trashed_at:
          description: The time at which this file was put in the trash.
          type:
          - string
          - 'null'
          format: date-time
          example: '2012-12-12T10:53:43-08:00'
        purged_at:
          description: The time at which this file is expected to be purged from the trash.
          type:
          - string
          - 'null'
          format: date-time
          example: '2012-12-12T10:53:43-08:00'
        content_created_at:
          description: The date and time at which this file was originally created, which might be before it was uploaded to Box.
          type:
          - string
          - 'null'
          format: date-time
          example: '2012-12-12T10:53:43-08:00'
        content_modified_at:
          description: The date and time at which this file was last updated, which might be before it was uploaded to Box.
          type:
          - string
          - 'null'
          format: date-time
          example: '2012-12-12T10:53:43-08:00'
        created_by:
          allOf:
          - $ref: '#/components/schemas/User--Mini'
          - description: The user who created this file.
        modified_by:
          allOf:
          - $ref: '#/components/schemas/User--Mini'
          - description: The user who last modified this file.
          - {}
        owned_by:
          allOf:
          - $ref: '#/components/schemas/User--Mini'
          - description: The user who owns this file.
          - {}
        shared_link:
          description: The shared link for this file. This will be `null` if a file has been trashed, since the link will no longer be active.
          type:
          - string
          - 'null'
          example: null
        parent:
          allOf:
          - $ref: '#/components/schemas/Folder--Mini'
          - description: The folder that this file is located within.
          - {}
        item_status:
          description: 'Defines if this item has been deleted or not.


            - `active` when the item has is not in the trash

            - `trashed` when the item has been moved to the trash but not deleted

            - `deleted` when the item has been permanently deleted.'
          type: string
          example: trashed
          enum:
          - active
          - trashed
          - deleted
      required:
      - id
      - type
      - sequence_id
      - sha1
      - description
      - size
      - path_collection
      - created_at
      - modified_at
      - modified_by
      - owned_by
      - item_status
      title: Trashed File
      x-box-resource-id: trash_file
      x-box-tag: trashed_files
    TrashFileRestored:
      description: Represents a file restored from the trash.
      type: object
      properties:
        id:
          description: 'The unique identifier that represent a file.


            The ID for any file can be determined by visiting a file in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/files/123` the `file_id` is `123`.'
          type: string
          example: '123456789'
        etag:
          description: The HTTP `etag` of this file. This can be used within some API endpoints in the `If-Match` and `If-None-Match` headers to only perform changes on the file if (no) changes have happened.
          type:
          - string
          - 'null'
          example: '1'
        type:
          description: The value will always be `file`.
          type: string
          example: file
          enum:
          - file
        sequence_id:
          allOf:
          - type:
            - string
            - 'null'
            example: '3'
            description: 'A numeric identifier that represents the most recent user event that has been applied to this item.


              This can be used in combination with the `GET /events`-endpoint to filter out user events that would have occurred before this identifier was read.


              An example would be where a Box Drive-like application would fetch an item via the API, and then listen to incoming user events for changes to the item. The application would ignore any user events where the `sequence_id` in the event is smaller than or equal to the `sequence_id` in the originally fetched resource.'
          - {}
        name:
          description: The name of the file.
          type: string
          example: Contract.pdf
        sha1:
          description: The SHA1 hash of the file. This can be used to compare the contents of a file on Box with a local file.
          type: string
          format: digest
          example: 85136C79CBF9FE36BB9D05D0639C70C265C18D37
        file_version:
          allOf:
          - $ref: '#/components/schemas/FileVersion--Mini'
          - description: The information about the current version of the file.
        description:
          description: The optional description of this file.
          type: string
          example: Contract for Q1 renewal
          maxLength: 256
        size:
          description: The file size in bytes. Be careful parsing this integer as it can get very large and cause an integer overflow.
          type: integer
          example: 629644
        path_collection:
          allOf:
          - title: Path collection
            description: A list of parent folders for an item.
            type: object
            required:
            - total_count
            - entries
            properties:
              total_count:
                description: The number of folders in this list.
                type: integer
                format: int64
                example: 1
              entries:
                description: The parent folders for this item.
                type: array
                items:
                  $ref: '#/components/schemas/Folder--Mini'
          - description: The tree of folders that this file is contained in, starting at the root.
          - {}
        created_at:
          description: The date and time when the file was created on Box.
          type: string
          format: date-time
          example: '2012-12-12T10:53:43-08:00'
        modified_at:
          description: The date and time when the file was last updated on Box.
          type: string
          format: date-time
          example: '2012-12-12T10:53:43-08:00'
        trashed_at:
          description: The time at which this file was put in the trash - becomes `null` after restore.
          type:
          - string
          - 'null'
          example: null
        purged_at:
          description: The time at which this file is expected to be purged from the trash - becomes `null` after restore.
          type:
          - string
          - 'null'
          example: null
        content_created_at:
          description: The date and time at which this file was originally created, which might be before it was uploaded to Box.
          type:
          - string
          - 'null'
          format: date-time
          example: '2012-12-12T10:53:43-08:00'
        content_modified_at:
          description: The date and time at which this file was last updated, which might be before it was uploaded to Box.
          type:
          - string
          - 'null'
          format: date-time
          example: '2012-12-12T10:53:43-08:00'
        created_by:
          allOf:
          - $ref: '#/components/schemas/User--Mini'
          - description: The user who created this file.
        modified_by:
          allOf:
          - $ref: '#/components/schemas/User--Mini'
          - description: The user who last modified this file.
          - {}
        owned_by:
          allOf:
          - $ref: '#/components/schemas/User--Mini'
          - description: The user who owns this file.
          - {}
        shared_link:
          description: The shared link for this file. This will be `null` if a file had been trashed, even though the original shared link does become active again.
          type:
          - string
          - 'null'
          example: null
        parent:
