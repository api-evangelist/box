    MetadataFilter:
      description: A metadata template used to filter the search results.
      type: object
      properties:
        scope:
          description: 'Specifies the scope of the template to filter search results by.


            This will be `enterprise_{enterprise_id}` for templates defined for use in this enterprise, and `global` for general templates that are available to all enterprises using Box.'
          type: string
          example: enterprise
          enum:
          - global
          - enterprise
          - enterprise_{enterprise_id}
        templateKey:
          description: 'The key of the template used to filter search results.


            In many cases the template key is automatically derived of its display name, for example `Contract Template` would become `contractTemplate`. In some cases the creator of the template will have provided its own template key.


            Please [list the templates for an enterprise][list], or get all instances on a [file][file] or [folder][folder] to inspect a template''s key.


            [list]: /reference/get-metadata-templates-enterprise

            [file]: /reference/get-files-id-metadata

            [folder]: /reference/get-folders-id-metadata'
          type: string
          example: contract
        filters:
          description: Specifies which fields on the template to filter the search results by. When more than one field is specified, the query performs a logical `AND` to ensure that the instance of the template matches each of the fields specified.
          type: object
          example:
            category: online
          additionalProperties:
            allOf:
            - $ref: '#/components/schemas/MetadataFilterValue'
            - example: online
            - x-box-example-key: category
      title: Metadata filter
      x-box-resource-id: metadata_filter
      x-box-tag: search
