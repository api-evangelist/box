openapi: 3.2.0
info:
  title: Box Platform Search API
  description: Box Platform provides functionality to provide access to content stored within Box. It provides endpoints for basic manipulation of files and folders, management of users within an enterprise, as well as more complex topics such as legal holds and retention policies.
  termsOfService: https://cloud.app.box.com/s/rmwxu64h1ipr41u49w3bbuvbsa29wku9
  contact:
    name: Box, Inc
    url: https://developer.box.com
    email: devrel@box.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '2024.0'
  x-box-commit-hash: 53bdced3cd
servers:
- url: https://api.box.com/2.0
  description: Box Platform API server.
security:
- OAuth2Security: []
tags:
- name: Search
  description: The Box API provides a way to find content in Box using full-text search queries.
  x-box-tag: search
paths:
  /metadata_queries/execute_read:
    post:
      operationId: post_metadata_queries_execute_read
      summary: Query files/folders by metadata
      description: 'For new integrations, use the v2026.0 Query API. This is the latest version of the Query API, with advanced capabilities including multi-template queries and Query Insights, and is the API we will continue to enhance with new Query capabilities.


        Create a search using SQL-like syntax to return items that match specific metadata.


        By default, this endpoint returns only the most basic info about the items for which the query matches. To get additional fields for each item, including any of the metadata, use the `fields` attribute in the query.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataQuery'
      responses:
        '200':
          description: Returns a list of files and folders that match this metadata query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataQueryResults'
        '400':
          description: 'Returns an error when the request body is not valid.


            - `invalid_query` - Any of the provided body parameters might be incorrect. This can mean the `query` is incorrect, as well as some cases where the `from` value does not represent a valid template.

            - `unexpected_json_type` - An argument from the `query` string is not present in `query_param`. For example, `query` of `name = :name` requires the `query_param` to include a value for the `name` argument, for example `{ "name": "Box, Inc" }`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '404':
          description: 'Returns an error when a metadata template with the given `scope` and `templateKey` can not be found. The error response will include extra details.


            - `instance_not_found` - The template was not found. Please make sure to use the full template scope including the enterprise ID, like `enterprise_12345`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: search
      tags:
      - Search
      x-codeSamples:
      - lang: curl
        label: Query files/folders by metadata
        source: "curl -i -X POST \"https://api.box.com/2.0/metadata_queries/execute_read\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\" \\\n     -H \"content-type: application/json\" \\\n     -d '{\n       \"from\": \"enterprise_123456.contractTemplate\",\n       \"query\": \"amount >= :value\",\n       \"query_params\": {\n         \"value\": 100\n       },\n       \"fields\": [\n         \"created_at\",\n         \"metadata.enterprise_123456.contractTemplate.amount\",\n         \"metadata.enterprise_123456.contractTemplate.customerName\"\n       ],\n       \"ancestor_folder_id\": \"5555\",\n       \"order_by\": [\n         {\n           \"field_key\": \"amount\",\n           \"direction\": \"asc\"\n         }\n       ],\n       \"limit\": 100\n     }'"
      - lang: dotnet
        label: Query files/folders by metadata
        source: 'await client.Search.SearchByMetadataQueryAsync(requestBody: new MetadataQuery(ancestorFolderId: "0", from: searchFrom) { Query = "name = :name AND age < :age AND birthDate >= :birthDate AND countryCode = :countryCode AND sports = :sports", QueryParams = new Dictionary<string, object>() { { "name", "John" }, { "age", 50 }, { "birthDate", "2001-01-01T02:20:10.120Z" }, { "countryCode", "US" }, { "sports", Array.AsReadOnly(new [] {"basketball","tennis"}) } } });'
      - lang: swift
        label: Query files/folders by metadata
        source: 'try await client.search.searchByMetadataQuery(requestBody: MetadataQuery(ancestorFolderId: "0", from: searchFrom, query: "name = :name AND age < :age AND birthDate >= :birthDate AND countryCode = :countryCode AND sports = :sports", queryParams: ["name": "John", "age": 50, "birthDate": "2001-01-01T02:20:10.120Z", "countryCode": "US", "sports": ["basketball", "tennis"]]))'
      - lang: java
        label: Query files/folders by metadata
        source: client.getSearch().searchByMetadataQuery(new MetadataQuery.Builder(searchFrom, "0").query("name = :name AND age < :age AND birthDate >= :birthDate AND countryCode = :countryCode AND sports = :sports").queryParams(mapOf(entryOf("name", "John"), entryOf("age", 50), entryOf("birthDate", "2001-01-01T02:20:10.120Z"), entryOf("countryCode", "US"), entryOf("sports", Arrays.asList("basketball", "tennis")))).build())
      - lang: node
        label: Query files/folders by metadata
        source: "await client.search.searchByMetadataQuery({\n  ancestorFolderId: '0',\n  from: searchFrom,\n  query:\n    'name = :name AND age < :age AND birthDate >= :birthDate AND countryCode = :countryCode AND sports = :sports',\n  queryParams: {\n    ['name']: 'John',\n    ['age']: 50,\n    ['birthDate']: '2001-01-01T02:20:10.120Z',\n    ['countryCode']: 'US',\n    ['sports']: ['basketball', 'tennis'],\n  },\n} satisfies MetadataQuery);"
      - lang: python
        label: Query files/folders by metadata
        source: "client.search.search_by_metadata_query(\n    search_from,\n    \"0\",\n    query=\"name = :name AND age < :age AND birthDate >= :birthDate AND countryCode = :countryCode AND sports = :sports\",\n    query_params={\n        \"name\": \"John\",\n        \"age\": 50,\n        \"birthDate\": \"2001-01-01T02:20:10.120Z\",\n        \"countryCode\": \"US\",\n        \"sports\": [\"basketball\", \"tennis\"],\n    },\n)"
  /search:
    get:
      operationId: get_search
      summary: Search for content
      description: Searches for files, folders, web links, and shared files across the users content or across the entire enterprise.
      parameters:
      - name: query
        in: query
        description: 'The string to search for. This query is matched against item names, descriptions, text content of files, and various other fields of the different item types.


          This parameter supports a variety of operators to further refine the results returns.


          - `""` - by wrapping a query in double quotes only exact matches are returned by the API. Exact searches do not return search matches based on specific character sequences. Instead, they return matches based on phrases, that is, word sequences. For example: A search for `"Blue-Box"` may return search results including the sequence `"blue.box"`, `"Blue Box"`, and `"Blue-Box"`; any item containing the words `Blue` and `Box` consecutively, in the order specified.

          - `AND` - returns items that contain both the search terms. For example, a search for `marketing AND BoxWorks` returns items that have both `marketing` and `BoxWorks` within its text in any order. It does not return a result that only has `BoxWorks` in its text.

          - `OR` - returns items that contain either of the search terms. For example, a search for `marketing OR BoxWorks` returns a result that has either `marketing` or `BoxWorks` within its text. Using this operator is not necessary as we implicitly interpret multi-word queries as `OR` unless another supported boolean term is used.

          - `NOT` - returns items that do not contain the search term provided. For example, a search for `marketing AND NOT BoxWorks` returns a result that has only `marketing` within its text. Results containing `BoxWorks` are omitted.


          We do not support lower case (that is, `and`, `or`, and `not`) or mixed case (that is, `And`, `Or`, and `Not`) operators.


          This field is required unless the `mdfilters` parameter is defined.'
        required: false
        schema:
          type: string
        example: sales
      - name: scope
        in: query
        description: 'Limits the search results to either the files that the user has access to, or to files available to the entire enterprise.


          The scope defaults to `user_content`, which limits the search results to content that is available to the currently authenticated user.


          The `enterprise_content` can be requested by an admin through our support channels. Once this scope has been enabled for a user, it will allow that use to query for content across the entire enterprise and not only the content that they have access to.'
        required: false
        schema:
          type: string
          default: user_content
          enum:
          - user_content
          - enterprise_content
        example: user_content
      - name: file_extensions
        in: query
        description: Limits the search results to any files that match any of the provided file extensions. This list is a comma-separated list of file extensions without the dots.
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - pdf
        - png
        - gif
        explode: false
      - name: created_at_range
        in: query
        description: 'Limits the search results to any items created within a given date range.


          Date ranges are defined as comma separated RFC3339 timestamps.


          If the start date is omitted (`,2014-05-17T13:35:01-07:00`) anything created before the end date will be returned.


          If the end date is omitted (`2014-05-15T13:35:01-07:00,`) the current date will be used as the end date instead.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - '2014-05-15T13:35:01-07:00'
        - '2014-05-17T13:35:01-07:00'
        explode: false
      - name: updated_at_range
        in: query
        description: 'Limits the search results to any items updated within a given date range.


          Date ranges are defined as comma separated RFC3339 timestamps.


          If the start date is omitted (`,2014-05-17T13:35:01-07:00`) anything updated before the end date will be returned.


          If the end date is omitted (`2014-05-15T13:35:01-07:00,`) the current date will be used as the end date instead.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - '2014-05-15T13:35:01-07:00'
        - '2014-05-17T13:35:01-07:00'
        explode: false
      - name: size_range
        in: query
        description: 'Limits the search results to any items with a size within a given file size range. This applied to files and folders.


          Size ranges are defined as comma separated list of a lower and upper byte size limit (inclusive).


          The upper and lower bound can be omitted to create open ranges.'
        required: false
        schema:
          type: array
          items:
            type: integer
        example:
        - 1000000
        - 5000000
        explode: false
      - name: owner_user_ids
        in: query
        description: 'Limits the search results to any items that are owned by the given list of owners, defined as a list of comma separated user IDs.


          The items still need to be owned or shared with the currently authenticated user for them to show up in the search results. If the user does not have access to any files owned by any of the users an empty result set will be returned.


          To search across an entire enterprise, we recommend using the `enterprise_content` scope parameter which can be requested with our support team.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - '123422'
        - '23532'
        - '3241212'
        explode: false
      - name: recent_updater_user_ids
        in: query
        description: 'Limits the search results to any items that have been updated by the given list of users, defined as a list of comma separated user IDs.


          The items still need to be owned or shared with the currently authenticated user for them to show up in the search results. If the user does not have access to any files owned by any of the users an empty result set will be returned.


          This feature only searches back to the last 10 versions of an item.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - '123422'
        - '23532'
        - '3241212'
        explode: false
      - name: ancestor_folder_ids
        in: query
        description: 'Limits the search results to items within the given list of folders, defined as a comma separated lists of folder IDs.


          Search results will also include items within any subfolders of those ancestor folders.


          The folders still need to be owned or shared with the currently authenticated user. If the folder is not accessible by this user, or it does not exist, a `HTTP 404` error code will be returned instead.


          To search across an entire enterprise, we recommend using the `enterprise_content` scope parameter which can be requested with our support team.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - '4535234'
        - '234123235'
        - '2654345'
        explode: false
      - name: content_types
        in: query
        description: 'Limits the search results to any items that match the search query for a specific part of the file, for example the file description.


          Content types are defined as a comma separated lists of Box recognized content types. The allowed content types are as follows.


          - `name` - The name of the item, as defined by its `name` field.

          - `description` - The description of the item, as defined by its `description` field.

          - `file_content` - The actual content of the file.

          - `comments` - The content of any of the comments on a file or folder.

          - `tags` - Any tags that are applied to an item, as defined by its `tags` field.'
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - name
            - description
            - file_content
            - comments
            - tags
        example:
        - name
        - description
        explode: false
      - name: type
        in: query
        description: 'Limits the search results to any items of this type. This parameter only takes one value. By default the API returns items that match any of these types.


          - `file` - Limits the search results to files,

          - `folder` - Limits the search results to folders,

          - `web_link` - Limits the search results to web links, also known as bookmarks.'
        required: false
        schema:
          type: string
          enum:
          - file
          - folder
          - web_link
        example: file
      - name: trash_content
        in: query
        description: 'Determines if the search should look in the trash for items.


          By default, this API only returns search results for items not currently in the trash (`non_trashed_only`).


          - `trashed_only` - Only searches for items currently in the trash

          - `non_trashed_only` - Only searches for items currently not in the trash

          - `all_items` - Searches for both trashed and non-trashed items.'
        required: false
        schema:
          type: string
          default: non_trashed_only
          enum:
          - non_trashed_only
          - trashed_only
          - all_items
        example: non_trashed_only
      - name: mdfilters
        in: query
        description: Limits the search results to any items for which the metadata matches the provided filter. This parameter is a list that specifies exactly **one** metadata template used to filter the search results. The parameter is required unless the `query` parameter is provided.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/MetadataFilter'
          maxItems: 1
          minItems: 1
        example:
        - scope: enterprise
          templateKey: contract
          filters:
          - category: online
          - contractValue: 100000
      - name: sort
        in: query
        description: 'Defines the order in which search results are returned. This API defaults to returning items by relevance unless this parameter is explicitly specified.


          - `relevance` (default) returns the results sorted by relevance to the query search term. The relevance is based on the occurrence of the search term in the items name, description, content, and additional properties.

          - `modified_at` returns the results ordered in descending order by date at which the item was last modified.'
        required: false
        schema:
          type: string
          default: relevance
          enum:
          - modified_at
          - relevance
        example: modified_at
      - name: direction
        in: query
        description: 'Defines the direction in which search results are ordered. This API defaults to returning items in descending (`DESC`) order unless this parameter is explicitly specified.


          When results are sorted by `relevance` the ordering is locked to returning items in descending order of relevance, and this parameter is ignored.'
        required: false
        schema:
          type: string
          default: DESC
          enum:
          - DESC
          - ASC
        example: ASC
      - name: limit
        in: query
        description: Defines the maximum number of items to return as part of a page of results.
        required: false
        schema:
          type: integer
          format: int64
          default: 30
          maximum: 200
        example: 100
      - name: include_recent_shared_links
        in: query
        description: 'Defines whether the search results should include any items that the user recently accessed through a shared link.


          When this parameter has been set to true, the format of the response of this API changes to return a list of [Search Results with Shared Links](/reference/resources/search-results-with-shared-links).'
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - name: fields
        in: query
        description: 'A comma-separated list of attributes to include in the response. This can be used to request fields that are not normally returned in a standard response.


          Be aware that specifying this parameter will have the effect that none of the standard fields are returned in the response unless explicitly specified, instead only fields for the mini representation are returned, additional to the fields requested.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - id
        - type
        - name
        explode: false
      - name: offset
        in: query
        description: 'The offset of the item at which to begin the response.


          Queries with offset parameter value exceeding 10000 will be rejected with a 400 response.'
        required: false
        schema:
          type: integer
          format: int64
          default: 0
        example: 1000
      - name: deleted_user_ids
        in: query
        description: 'Limits the search results to items that were deleted by the given list of users, defined as a list of comma separated user IDs.


          The `trash_content` parameter needs to be set to `trashed_only`.


          If searching in trash is not performed, an empty result set is returned. The items need to be owned or shared with the currently authenticated user for them to show up in the search results.


          If the user does not have access to any files owned by any of the users, an empty result set is returned.


          Data available from 2023-02-01 onwards.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - '123422'
        - '23532'
        - '3241212'
      - name: deleted_at_range
        in: query
        description: 'Limits the search results to any items deleted within a given date range.


          Date ranges are defined as comma separated RFC3339 timestamps.


          If the start date is omitted (`2014-05-17T13:35:01-07:00`), anything deleted before the end date will be returned.


          If the end date is omitted (`2014-05-15T13:35:01-07:00`), the current date will be used as the end date instead.


          The `trash_content` parameter needs to be set to `trashed_only`.


          If searching in trash is not performed, then an empty result is returned.


          Data available from 2023-02-01 onwards.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - '2014-05-15T13:35:01-07:00'
        - '2014-05-17T13:35:01-07:00'
      responses:
        '200':
          description: Returns a collection of search results. If there are no matching search results, the `entries` array will be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultsResponse'
        '400':
          description: 'Returns an error when the request was not valid. This can have multiple reasons and the `context_info` object will provide you with more details.


            - `missing_parameter` - Please provide at least the `query` or `mdfilters` query parameter in a search.

            - `invalid_parameter` - Any of the fields might not be in the right format. This could for example mean that one of the RFC3339 dates is incorrect, or a string is provided where an integer is expected.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '403':
          description: 'Returns an error when the user does not have the permission to make this API call.


            - The developer provided a `scope` of `enterprise_content` but did not request this scope to be enabled for the user through our support channels.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '404':
          description: 'Returns an error when the user does not have access to an item mentioned in the request.


            - The developer provided a folder ID in `ancestor_folder_ids` that either does not exist or the user does not have access to.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: search
      tags:
      - Search
      x-codeSamples:
      - lang: curl
        label: Search for content
        source: "curl -i -X GET \"https://api.box.com/2.0/search?query=sales\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\""
      - lang: java
        label: Search for content
        source: client.getSearch().searchForContent(new SearchForContentQueryParams.Builder().ancestorFolderIds(Arrays.asList("0")).mdfilters(Arrays.asList(new MetadataFilter.Builder().scope(MetadataFilterScopeField.ENTERPRISE).templateKey(templateKey).filters(searchFilters).build())).build())
      - lang: node
        label: Search for content
        source: "await client.search.searchForContent({\n  ancestorFolderIds: ['0'],\n  mdfilters: [\n    {\n      filters: searchFilters,\n      scope: 'enterprise' as MetadataFilterScopeField,\n      templateKey: templateKey,\n    } satisfies MetadataFilter,\n  ],\n} satisfies SearchForContentQueryParams);"
      - lang: python
        label: Search for content
        source: "client.search.search_for_content(\n    ancestor_folder_ids=[\"0\"],\n    mdfilters=[\n        MetadataFilter(\n            filters=search_filters,\n            scope=MetadataFilterScopeField.ENTERPRISE,\n            template_key=template_key,\n        )\n    ],\n)"
components:
  schemas:
    File--Mini:
      description: A mini representation of a file, used when nested under another resource.
      type:
      - object
      - 'null'
      allOf:
      - $ref: '#/components/schemas/File--Base'
      - properties:
          sequence_id:
            allOf:
            - type:
              - string
              - 'null'
              example: '3'
              description: 'A numeric identifier that represents the most recent user event that has been applied to this item.


                This can be used in combination with the `GET /events`-endpoint to filter out user events that would have occurred before this identifier was read.


                An example would be where a Box Drive-like application would fetch an item via the API, and then listen to incoming user events for changes to the item. The application would ignore any user events where the `sequence_id` in the event is smaller than or equal to the `sequence_id` in the originally fetched resource.'
            - {}
          name:
            description: The name of the file.
            type: string
            example: Contract.pdf
          sha1:
            description: The SHA1 hash of the file. This can be used to compare the contents of a file on Box with a local file.
            type: string
            format: digest
            example: 85136C79CBF9FE36BB9D05D0639C70C265C18D37
          file_version:
            allOf:
            - $ref: '#/components/schemas/FileVersion--Mini'
            - description: The information about the current version of the file.
      title: File (Mini)
      x-box-resource-id: file--mini
      x-box-tag: files
      x-box-variant: mini
    ClientError:
      description: A generic error.
      type: object
      properties:
        type:
          description: The value will always be `error`.
          type: string
          example: error
          enum:
          - error
        status:
          description: The HTTP status of the response.
          type: integer
          format: int32
          example: 400
        code:
          description: A Box-specific error code.
          type: string
          example: item_name_invalid
          enum:
          - created
          - accepted
          - no_content
          - redirect
          - not_modified
          - bad_request
          - unauthorized
          - forbidden
          - not_found
          - method_not_allowed
          - conflict
          - precondition_failed
          - unprocessable_entity
          - too_many_requests
          - internal_server_error
          - unavailable
          - item_name_invalid
          - insufficient_scope
        message:
          description: A short message describing the error.
          type: string
          example: Method Not Allowed
        context_info:
          description: A free-form object that contains additional context about the error. The possible fields are defined on a per-endpoint basis. `message` is only one example.
          type:
          - object
          - 'null'
          example:
            message: Something went wrong
          additionalProperties: {}
        help_url:
          description: A URL that links to more information about why this error occurred.
          type: string
          example: https://developer.box.com/guides/api-calls/permissions-and-errors/common-errors/
        request_id:
          description: A unique identifier for this response, which can be used when contacting Box support.
          type: string
          example: abcdef123456
      title: Client error
      x-box-resource-id: client_error
    SearchResultsResponse:
      description: Search result from the content search endpoint.
      type: object
      oneOf:
      - $ref: '#/components/schemas/SearchResults'
      - $ref: '#/components/schemas/SearchResultsWithSharedLinks'
      title: Search results response
    MetadataFieldFilterFloatRange:
      description: Specifies which `float` field on the template to filter the search results by, specifying a range of values that can match.
      type: object
      properties:
        lt:
          description: Specifies the (inclusive) upper bound for the metadata field value. The value of a field must be lower than (`lt`) or equal to this value for the search query to match this template.
          type: number
          example: 200000
        gt:
          description: Specifies the (inclusive) lower bound for the metadata field value. The value of a field must be greater than (`gt`) or equal to this value for the search query to match this template.
          type: number
          example: 100000
      title: Metadata field filter (float range)
      x-box-resource-id: metadata_field_filter_float_range
    FileVersion--Mini:
      description: A mini representation of a file version, used when nested within another resource.
      type: object
      allOf:
      - $ref: '#/components/schemas/FileVersion--Base'
      - properties:
          sha1:
            description: The SHA1 hash of this version of the file.
            type: string
            example: 134b65991ed521fcfe4724b7d814ab8ded5185dc
      title: File version (Mini)
      x-box-resource-id: file_version--mini
      x-box-variant: mini
    MetadataQuery:
      description: Create a search using SQL-like syntax to return items that match specific metadata.
      type: object
      properties:
        from:
          description: Specifies the template used in the query. Must be in the form `scope.templateKey`. Not all templates can be used in this field, most notably the built-in, Box-provided classification templates can not be used in a query.
          type: string
          example: enterprise_123456.someTemplate
        query:
          description: 'The query to perform. A query is a logical expression that is very similar to a SQL `SELECT` statement. Values in the search query can be turned into parameters specified in the `query_param` arguments list to prevent having to manually insert search values into the query string.


            For example, a value of `:amount` would represent the `amount` value in `query_params` object.'
          type: string
          example: value >= :amount
        query_params:
          description: Set of arguments corresponding to the parameters specified in the `query`. The type of each parameter used in the `query_params` must match the type of the corresponding metadata template field.
          type: object
          example:
            amount: '100'
          additionalProperties:
            allOf:
            - {}
            - description: 'The value for the argument being used in the metadata search.


                The type of this parameter must match the type of the corresponding metadata template field.'
            - example: '100'
            x-box-example-key: amount
        ancestor_folder_id:
          description: The ID of the folder that you are restricting the query to. A value of zero will return results from all folders you have access to. A non-zero value will only return results found in the folder corresponding to the ID or in any of its subfolders.
          type: string
          example: '0'
        order_by:
          description: 'A list of template fields and directions to sort the metadata query results by.


            The ordering `direction` must be the same for each item in the array.'
          type: array
          items:
            type: object
            description: An object representing one of the metadata template fields to sort the metadata query results by.
            properties:
              field_key:
                description: 'The metadata template field to order by.


                  The `field_key` represents the `key` value of a field from the metadata template being searched for.'
                type: string
                example: amount
              direction:
                description: 'The direction to order by, either ascending or descending.


                  The `ordering` direction must be the same for each item in the array.'
                type: string
                example: asc
                enum:
                - ASC
                - DESC
                - asc
                - desc
        limit:
          description: A value between 0 and 100 that indicates the maximum number of results to return for a single request. This only specifies a maximum boundary and will not guarantee the minimum number of results returned.
          type: integer
          example: 50
          default: 100
          maximum: 100
          minimum: 0
        marker:
          description: Marker to use for requesting the next page.
          type: string
          example: AAAAAmVYB1FWec8GH6yWu2nwmanfMh07IyYInaa7DZDYjgO1H4KoLW29vPlLY173OKsci6h6xGh61gG73gnaxoS+o0BbI1/h6le6cikjlupVhASwJ2Cj0tOD9wlnrUMHHw3/ISf+uuACzrOMhN6d5fYrbidPzS6MdhJOejuYlvsg4tcBYzjauP3+VU51p77HFAIuObnJT0ff
        fields:
          description: 'By default, this endpoint returns only the most basic info about the items for which the query matches. This attribute can be used to specify a list of additional attributes to return for any item, including its metadata.


            This attribute takes a list of item fields, metadata template identifiers, or metadata template field identifiers.


            For example:


            - `created_by` will add the details of the user who created the item to the response.

            - `metadata.<scope>.<templateKey>` will return the mini-representation of the metadata instance identified by the `scope` and `templateKey`.

            - `metadata.<scope>.<templateKey>.<field>` will return all the mini-representation of the metadata instance identified by the `scope` and `templateKey` plus the field specified by the `field` name. Multiple fields for the same `scope` and `templateKey` can be defined.'
          type: array
          items:
            type: string
          example:
          - extension
          - created_at
          - item_status
          - metadata.enterprise_1234.contracts
          - metadata.enterprise_1234.regions.location
      required:
      - from
      - ancestor_folder_id
      title: Metadata query search request
    Resource:
      description: The file or folder resource.
      type: object
      oneOf:
      - $ref: '#/components/schemas/Folder--Mini'
      - $ref: '#/components/schemas/File--Mini'
      title: Resource
    User--Base:
