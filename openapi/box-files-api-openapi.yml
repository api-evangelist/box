openapi: 3.2.0
info:
  title: Box Platform Files API
  description: Box Platform provides functionality to provide access to content stored within Box. It provides endpoints for basic manipulation of files and folders, management of users within an enterprise, as well as more complex topics such as legal holds and retention policies.
  termsOfService: https://cloud.app.box.com/s/rmwxu64h1ipr41u49w3bbuvbsa29wku9
  contact:
    name: Box, Inc
    url: https://developer.box.com
    email: devrel@box.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '2024.0'
  x-box-commit-hash: 53bdced3cd
servers:
- url: https://api.box.com/2.0
  description: Box Platform API server.
security:
- OAuth2Security: []
tags:
- name: Files
  description: Files, together with Folders, are at the core of the Box API. Files can be uploaded and downloaded, as well as hold important metadata information about the content.
  x-box-tag: files
paths:
  /files/{file_id}:
    get:
      operationId: get_files_id
      summary: Get file information
      description: Retrieves the details about a file.
      parameters:
      - name: file_id
        in: path
        description: 'The unique identifier that represents a file.


          The ID for any file can be determined by visiting a file in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/files/123` the `file_id` is `123`.'
        required: true
        schema:
          type: string
        example: '12345'
      - name: fields
        in: query
        description: 'A comma-separated list of attributes to include in the response. This can be used to request fields that are not normally returned in a standard response.


          Be aware that specifying this parameter will have the effect that none of the standard fields are returned in the response unless explicitly specified, instead only fields for the mini representation are returned, additional to the fields requested.


          Additionally this field can be used to query any metadata applied to the file by specifying the `metadata` field as well as the scope and key of the template to retrieve, for example `?fields=metadata.enterprise_12345.contractTemplate`.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - id
        - type
        - name
        explode: false
      - name: if-none-match
        in: header
        description: 'Ensures an item is only returned if it has changed.


          Pass in the item''s last observed `etag` value into this header and the endpoint will fail with a `304 Not Modified` if the item has not changed since.'
        required: false
        schema:
          type: string
        example: '1'
      - name: boxapi
        in: header
        description: 'The URL, and optional password, for the shared link of this item.


          This header can be used to access items that have not been explicitly shared with a user.


          Use the format `shared_link=[link]` or if a password is required then use `shared_link=[link]&shared_link_password=[password]`.


          This header can be used on the file or folder shared, as well as on any files or folders nested within the item.'
        required: false
        schema:
          type: string
        example: shared_link=[link]&shared_link_password=[password]
      - name: x-rep-hints
        in: header
        description: 'A header required to request specific `representations` of a file. Use this in combination with the `fields` query parameter to request a specific file representation.


          The general format for these representations is `X-Rep-Hints: [...]` where `[...]` is one or many hints in the format `[fileType?query]`.


          For example, to request a `png` representation in `32x32` as well as `64x64` pixel dimensions provide the following hints.


          `x-rep-hints: [jpg?dimensions=32x32][jpg?dimensions=64x64]`


          Additionally, a `text` representation is available for all document file types in Box using the `[extracted_text]` representation.


          `x-rep-hints: [extracted_text]`.'
        required: false
        schema:
          type:
          - string
          - 'null'
        example: '[pdf]'
      responses:
        '200':
          description: 'Returns a file object.


            Not all available fields are returned by default. Use the [fields](#parameter-fields) query parameter to explicitly request any specific fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File--Full'
        '304':
          description: Returns an empty response when the `If-None-Match` header matches the current `etag` value of the folder. This indicates that the folder has not changed since it was last requested.
        '401':
          description: Returned when the access token provided in the `Authorization` header is not recognized or not provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '404':
          description: Returned if the file is not found, or the user does not have access to the file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '405':
          description: Returned if the `file_id` is not in a recognized format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '415':
          description: 'Returns an error if an action is performed on a file with an incorrect media type.


            - `unsupported_media_type` when requesting an `expiring_embed_link` for a file that is not supported by Box Embed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: files
      tags:
      - Files
      x-codeSamples:
      - lang: curl
        label: Get file information
        source: "curl -i -X GET \"https://api.box.com/2.0/files/12345\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\""
      - lang: dotnet
        label: Get file information
        source: 'await client.Files.GetFileByIdAsync(fileId: uploadedFile.Id, queryParams: new GetFileByIdQueryParams() { Fields = Array.AsReadOnly(new [] {"is_externally_owned","has_collaborations"}) });'
      - lang: swift
        label: Get file information
        source: 'try await client.files.getFileById(fileId: uploadedFile.id, queryParams: GetFileByIdQueryParams(fields: ["is_externally_owned", "has_collaborations"]))'
      - lang: java
        label: Get file information
        source: client.getFiles().getFileById(uploadedFile.getId(), new GetFileByIdQueryParams.Builder().fields(Arrays.asList("is_externally_owned", "has_collaborations")).build())
      - lang: node
        label: Get file information
        source: "await client.files.getFileById(uploadedFile.id, {\n  queryParams: {\n    fields: ['is_externally_owned', 'has_collaborations'],\n  } satisfies GetFileByIdQueryParams,\n} satisfies GetFileByIdOptionalsInput);"
      - lang: python
        label: Get file information
        source: "client.files.get_file_by_id(\n    uploaded_file.id, fields=[\"is_externally_owned\", \"has_collaborations\"]\n)"
    put:
      operationId: put_files_id
      summary: Update file
      description: Updates a file. This can be used to rename or move a file, create a shared link, or lock a file.
      parameters:
      - name: file_id
        in: path
        description: 'The unique identifier that represents a file.


          The ID for any file can be determined by visiting a file in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/files/123` the `file_id` is `123`.'
        required: true
        schema:
          type: string
        example: '12345'
      - name: fields
        in: query
        description: 'A comma-separated list of attributes to include in the response. This can be used to request fields that are not normally returned in a standard response.


          Be aware that specifying this parameter will have the effect that none of the standard fields are returned in the response unless explicitly specified, instead only fields for the mini representation are returned, additional to the fields requested.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - id
        - type
        - name
        explode: false
      - name: if-match
        in: header
        description: 'Ensures this item hasn''t recently changed before making changes.


          Pass in the item''s last observed `etag` value into this header and the endpoint will fail with a `412 Precondition Failed` if it has changed since.'
        required: false
        schema:
          type: string
        example: '1'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: 'An optional different name for the file. This can be used to rename the file.


                    File names must be unique within their parent folder. The name check is case-insensitive, so a file named `New File` cannot be created in a parent folder that already contains a folder named `new file`.'
                  type: string
                  example: NewFile.txt
                description:
                  description: The description for a file. This can be seen in the right-hand sidebar panel when viewing a file in the Box web app. Additionally, this index is used in the search index of the file, allowing users to find the file by the content in the description.
                  type: string
                  example: The latest reports. Automatically updated
                  maxLength: 256
                parent:
                  allOf:
                  - type: object
                    description: The parent for this item.
                    properties:
                      id:
                        description: The ID of parent item.
                        type: string
                        example: '123'
                      user_id:
                        description: The input for `user_id` is optional. Moving to non-root folder is not allowed when `user_id` is present. Parent folder id should be zero when `user_id` is provided.
                        type: string
                        example: '12346930'
                  - description: An optional new parent folder for the file. This can be used to move the file to a new folder.
                shared_link:
                  allOf:
                  - description: Defines a shared link for an item. Set this to `null` to remove the shared link.
                    type: object
                    properties:
                      access:
                        description: 'The level of access for the shared link. This can be restricted to anyone with the link (`open`), only people within the company (`company`) and only those who have been invited to the folder (`collaborators`).


                          If not set, this field defaults to the access level specified by the enterprise admin. To create a shared link with this default setting pass the `shared_link` object with no `access` field, for example `{ "shared_link": {} }`.


                          The `company` access level is only available to paid accounts.'
                        type: string
                        example: open
                        enum:
                        - open
                        - company
                        - collaborators
                      password:
                        description: The password required to access the shared link. Set the password to `null` to remove it. Passwords must now be at least eight characters long and include a number, upper case letter, or a non-numeric or non-alphabetic character. A password can only be set when `access` is set to `open`.
                        type:
                        - string
                        - 'null'
                        example: do-n8t-use-this-Password
                      vanity_name:
                        description: 'Defines a custom vanity name to use in the shared link URL, for example `https://app.box.com/v/my-shared-link`.


                          Custom URLs should not be used when sharing sensitive content as vanity URLs are a lot easier to guess than regular shared links.'
                        type: string
                        example: my-shared-link
                      unshared_at:
                        description: The timestamp at which this shared link will expire. This field can only be set by users with paid accounts.
                        type: string
                        format: date-time
                        example: '2012-12-12T10:53:43-08:00'
                      permissions:
                        type: object
                        properties:
                          can_download:
                            description: If the shared link allows for downloading of files. This can only be set when `access` is set to `open` or `company`.
                            type: boolean
                            example: true
                      one_time_passcode:
                        allOf:
                        - $ref: '#/components/schemas/SharedLinkOtpWritable'
                        - description: One-time-passcode (OTP) settings for the shared link.
                  - description: Defines a shared link for a file. Set this to `null` to remove the shared link.
                lock:
                  description: 'Defines a lock on an item. This prevents the item from being moved, renamed, or otherwise changed by anyone other than the user who created the lock.


                    Set this to `null` to remove the lock.'
                  type:
                  - object
                  - 'null'
                  properties:
                    access:
                      description: The type of this object.
                      type: string
                      example: lock
                      enum:
                      - lock
                    expires_at:
                      description: Defines the time at which the lock expires.
                      type: string
                      format: date-time
                      example: '2012-12-12T10:53:43-08:00'
                    is_download_prevented:
                      description: Defines if the file can be downloaded while it is locked.
                      type: boolean
                      example: true
                  required:
                  - type
                disposition_at:
                  description: The retention expiration timestamp for the given file. This date cannot be shortened once set on a file.
                  type: string
                  format: date-time
                  example: '2012-12-12T10:53:43-08:00'
                permissions:
                  description: Defines who can download a file.
                  type: object
                  properties:
                    can_download:
                      description: 'Defines who is allowed to download this file. The possible values are either `open` for everyone or `company` for the other members of the user''s enterprise.


                        This setting overrides the download permissions that are normally part of the `role` of a collaboration. When set to `company`, this essentially removes the download option for external users with `viewer` or `editor` a roles.'
                      type: string
                      example: open
                      enum:
                      - open
                      - company
                collections:
                  description: 'An array of collections to make this file a member of. Currently we only support the `favorites` collection.


                    To get the ID for a collection, use the [List all collections][1] endpoint.


                    Passing an empty array `[]` or `null` will remove the file from all collections.


                    [1]: /reference/get-collections'
                  type:
                  - array
                  - 'null'
                  items:
                    title: Reference
                    description: The bare basic reference for an object.
                    type: object
                    properties:
                      id:
                        description: The unique identifier for this object.
                        type: string
                        example: '11446498'
                      type:
                        description: The type for this object.
                        type: string
                        example: file
                tags:
                  description: 'The tags for this item. These tags are shown in the Box web app and mobile apps next to an item.


                    To add or remove a tag, retrieve the item''s current tags, modify them, and then update this field.


                    There is a limit of 100 tags per item, and 10,000 unique tags per enterprise.'
                  type: array
                  items:
                    type: string
                  example:
                  - approved
                  maxItems: 100
                  minItems: 1
      responses:
        '200':
          description: 'Returns a file object.


            Not all available fields are returned by default. Use the [fields](#parameter-fields) query parameter to explicitly request any specific fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File--Full'
        '400':
          description: Returned when the new retention time > maximum retention length.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '401':
          description: Returned when the access token provided in the `Authorization` header is not recognized or not provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '403':
          description: 'Returned if the user does not have all the permissions to complete the update.


            - `access_denied_insufficient_permissions` returned when the authenticated user does not have access to the destination folder to move the file to.

            - Returned when retention time is shorter or equal to current retention timestamp.

            - Returned when a `file_id` that is not under retention is entered.

            - Returned when a file that is retained but the disposition action is set to `remove_retention`

            - `forbidden_by_policy` is returned if copying a folder is forbidden due to information barrier restrictions.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '404':
          description: Returned if the file is not found, or the user does not have access to the file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '405':
          description: Returned if the `file_id` is not in a recognized format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '412':
          description: Returns an error when the `If-Match` header does not match the current `etag` value of the file. This indicates that the file has changed since it was last requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: files
      tags:
      - Files
      x-codeSamples:
      - lang: curl
        label: Update file
        source: "curl -i -X PUT \"https://api.box.com/2.0/files/12345\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\" \\\n     -H \"content-type: application/json\" \\\n     -d '{\n       \"name\": \"New name\"\n     }'"
      - lang: dotnet
        label: Update file
        source: 'await client.Files.UpdateFileByIdAsync(fileId: fileToUpdate.Id, requestBody: new UpdateFileByIdRequestBody() { Name = updatedName, Description = "Updated description" });'
      - lang: swift
        label: Update file
        source: 'try await client.files.updateFileById(fileId: fileToUpdate.id, requestBody: UpdateFileByIdRequestBody(name: updatedName, description: "Updated description"))'
      - lang: java
        label: Update file
        source: client.getFiles().updateFileById(fileToUpdate.getId(), new UpdateFileByIdRequestBody.Builder().name(updatedName).description("Updated description").build())
      - lang: node
        label: Update file
        source: "await client.files.updateFileById(fileToUpdate.id, {\n  requestBody: {\n    name: updatedName,\n    description: 'Updated description',\n  } satisfies UpdateFileByIdRequestBody,\n} satisfies UpdateFileByIdOptionalsInput);"
      - lang: python
        label: Update file
        source: "client.files.update_file_by_id(\n    file_to_update.id, name=updated_name, description=\"Updated description\"\n)"
    delete:
      operationId: delete_files_id
      summary: Delete file
      description: 'Deletes a file, either permanently or by moving it to the trash.


        The enterprise settings determine whether the item will be permanently deleted from Box or moved to the trash.'
      parameters:
      - name: file_id
        in: path
        description: 'The unique identifier that represents a file.


          The ID for any file can be determined by visiting a file in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/files/123` the `file_id` is `123`.'
        required: true
        schema:
          type: string
        example: '12345'
      - name: if-match
        in: header
        description: 'Ensures this item hasn''t recently changed before making changes.


          Pass in the item''s last observed `etag` value into this header and the endpoint will fail with a `412 Precondition Failed` if it has changed since.'
        required: false
        schema:
          type: string
        example: '1'
      responses:
        '204':
          description: Returns an empty response when the file has been successfully deleted.
        '401':
          description: Returned when the access token provided in the `Authorization` header is not recognized or not provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '404':
          description: Returned if the file is not found or has already been deleted, or the user does not have access to the file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '405':
          description: Returned if the `file_id` is not in a recognized format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '412':
          description: Returns an error when the `If-Match` header does not match the current `etag` value of the file. This indicates that the file has changed since it was last requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: files
      tags:
      - Files
      x-codeSamples:
      - lang: curl
        label: Delete file
        source: "curl -i -X DELETE \"https://api.box.com/2.0/files/12345\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\""
      - lang: dotnet
        label: Delete file
        source: 'await client.Files.DeleteFileByIdAsync(fileId: thumbnailFile.Id);'
      - lang: swift
        label: Delete file
        source: 'try await client.files.deleteFileById(fileId: thumbnailFile.id)'
      - lang: java
        label: Delete file
        source: client.getFiles().deleteFileById(thumbnailFile.getId())
      - lang: node
        label: Delete file
        source: await client.files.deleteFileById(thumbnailFile.id);
      - lang: python
        label: Delete file
        source: client.files.delete_file_by_id(thumbnail_file.id)
  /files/content:
    options:
      operationId: options_files_content
      summary: Preflight check before upload
      tags:
      - Files
      x-box-tag: uploads
      description: Performs a check to verify that a file will be accepted by Box before you upload the entire file.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: The name for the file.
                  type: string
                  example: File.mp4
                size:
                  description: The size of the file in bytes.
                  type: integer
                  format: int32
                  example: 1024
                parent:
                  allOf:
                  - type: object
                    description: The parent for this item.
                    properties:
                      id:
                        description: The ID of parent item.
                        type: string
                        example: '123'
                  - description: The parent folder to upload the file to.
      responses:
        '200':
          description: If the check passed, the response will include a session URL that can be used to upload the file to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrl'
        '409':
          description: If the check did not pass, the response will include some details on why it did not pass.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-codeSamples:
      - lang: curl
        label: Preflight check before upload
        source: "curl -i -X OPTIONS \"https://api.box.com/2.0/files/content\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\" \\\n     -H \"content-type: application/json\" \\\n     -d '{\"name\":\"Contract.pdf\", \"parent\":{\"id\":\"11446498\"}}'"
      - lang: dotnet
        label: Preflight check before upload
        source: 'await client.Uploads.PreflightFileUploadCheckAsync(requestBody: new PreflightFileUploadCheckRequestBody() { Name = newFileName, Size = 1024 * 1024, Parent = new PreflightFileUploadCheckRequestBodyParentField() { Id = "0" } });'
      - lang: java
        label: Preflight check before upload
        source: client.getUploads().preflightFileUploadCheck(new PreflightFileUploadCheckRequestBody.Builder().name(newFileName).size(1024 * 1024).parent(new PreflightFileUploadCheckRequestBodyParentField.Builder().id("0").build()).build())
      - lang: node
        label: Preflight check before upload
        source: "await client.uploads.preflightFileUploadCheck({\n  name: newFileName,\n  size: 1024 * 1024,\n  parent: { id: '0' } satisfies PreflightFileUploadCheckRequestBodyParentField,\n} satisfies PreflightFileUploadCheckRequestBody);"
      - lang: python
        label: Preflight check before upload
        source: "client.uploads.preflight_file_upload_check(\n    name=new_file_name, size=1024 * 1024, parent=PreflightFileUploadCheckParent(id=\"0\")\n)"
  /files/{file_id}/copy:
    post:
      operationId: post_files_id_copy
      summary: Copy file
      description: Creates a copy of a file.
      parameters:
      - name: file_id
        in: path
        description: 'The unique identifier that represents a file.


          The ID for any file can be determined by visiting a file in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/files/123` the `file_id` is `123`.'
        required: true
        schema:
          type: string
        example: '12345'
      - name: fields
        in: query
        description: 'A comma-separated list of attributes to include in the response. This can be used to request fields that are not normally returned in a standard response.


          Be aware that specifying this parameter will have the effect that none of the standard fields are returned in the response unless explicitly specified, instead only fields for the mini representation are returned, additional to the fields requested.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - id
        - type
        - name
        explode: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: 'An optional new name for the copied file.


                    There are some restrictions to the file name. Names containing non-printable ASCII characters, forward and backward slashes (`/`, `\`), and protected names like `.` and `..` are automatically sanitized by removing the non-allowed characters.'
                  type: string
                  example: FileCopy.txt
                  maxLength: 255
                version:
                  description: An optional ID of the specific file version to copy.
                  type: string
                  example: '0'
                parent:
                  description: The destination folder to copy the file to.
                  type: object
                  properties:
                    id:
                      description: The ID of folder to copy the file to.
                      type: string
                      example: '0'
                  required:
                  - id
              required:
              - parent
      responses:
        '201':
          description: 'Returns a new file object representing the copied file.


            Not all available fields are returned by default. Use the [fields](#parameter-fields) query parameter to explicitly request any specific fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File--Full'
        '304':
          description: Returns an empty response when the `If-None-Match` header matches the current `etag` value of the file. This indicates that the file has not changed since it was last requested.
        '400':
          description: 'Returns an error if some of the parameters are missing or not valid.


            - `bad_request` when a parameter is missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '403':
          description: 'Returns an error when the user does not have the right permissions to create the copy a file.


            - `forbidden_by_policy`: Returned if copying a file is forbidden due to information barrier restrictions.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '404':
          description: 'Returns an error if either the source file or the destination folder could not be found, or the authenticated user does not have access to either.


            - `not_found` when the authenticated user does not have access to the source file or the destination folder.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '409':
          description: '`operation_blocked_temporary`: Returned if either of the destination or source folders is locked due to another move, copy, delete or restore operation in process.


            The operation can be retried at a later point.


            `item_name_in_use` when a folder with the same name already exists.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: files
      tags:
      - Files
      x-codeSamples:
      - lang: curl
        label: Copy file
        source: "curl -i -X POST \"https://api.box.com/2.0/files/12345/copy\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\" \\\n     -H \"content-type: application/json\" \\\n     -d '{\n       \"parent\": {\n         \"id\": \"123\"\n       }\n     }'"
      - lang: dotnet
        label: Copy file
        source: 'await client.Files.CopyFileAsync(fileId: fileOrigin.Id, requestBody: new CopyFileRequestBody(parent: new CopyFileRequestBodyParentField(id: "0")) { Name = copiedFileName });'
      - lang: swift
        label: Copy file
        source: 'try await client.files.copyFile(fileId: fileOrigin.id, requestBody: CopyFileRequestBody(parent: CopyFileRequestBodyParentField(id: "0"), name: copiedFileName))'
      - lang: java
        label: Copy file
        source: client.getFiles().copyFile(fileOrigin.getId(), new CopyFileRequestBody.Builder(new CopyFileRequestBodyParentField("0")).name(copiedFileName).build())
      - lang: node
        label: Copy file
        source: "await client.files.copyFile(fileOrigin.id, {\n  parent: { id: '0' } satisfies CopyFileRequestBodyParentField,\n  name: copiedFileName,\n} satisfies CopyFileRequestBody);"
      - lang: python
        label: Copy file
        source: client.files.copy_file(file_origin.id, CopyFileParent(id="0"), name=copied_file_name)
  /files/{file_id}/thumbnail.{extension}:
    get:
      operationId: get_files_id_thumbnail_id
      summary: Get file thumbnail
      description: 'Retrieves a thumbnail, or smaller image representation, of a file.


        Sizes of `32x32`,`64x64`, `128x128`, and `256x256` can be returned in the `.png` format and sizes of `32x32`, `160x160`, and `320x320` can be returned in the `.jpg` format.


        Thumbnails can be generated for the image and video file formats listed [found on our community site][1].


        [1]: https://community.box.com/t5/Migrating-and-Previewing-Content/File-Types-and-Fonts-Supported-in-Box-Content-Preview/ta-p/327'
      parameters:
      - name: file_id
        in: path
        description: 'The unique identifier that represents a file.


          The ID for any file can be determined by visiting a file in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/files/123` the `file_id` is `123`.'
        required: true
        schema:
          type: string
        example: '12345'
      - name: extension
        in: path
        description: The file format for the thumbnail.
        required: true
        schema:
          type: string
          enum:
          - png
          - jpg
        example: png
      - name: min_height
        in: query
        description: The minimum height of the thumbnail.
        schema:
          type: integer
          maximum: 320
          minimum: 32
        example: 32
      - name: min_width
        in: query
        description: The minimum width of the thumbnail.
        schema:
          type: integer
          maximum: 320
          minimum: 32
        example: 32
      - name: max_height
        in: query
        description: The maximum height of the thumbnail.
        required: false
        schema:
          type: integer
          maximum: 320
          minimum: 32
        example: 320
      - name: max_width
        in: query
        description: The maximum width of the thumbnail.
        required: false
        schema:
          type: integer
          maximum: 320
          minimum: 32
        example: 320
      responses:
        '200':
          description: When a thumbnail can be created the thumbnail data will be returned in the body of the response.
          content:
            image/jpg:
              schema:
                description: The thumbnail.
                type: string
                format: binary
            image/png:
              schema:
                description: The thumbnail.
                type: string
                format: binary
        '202':
          description: 'Sometimes generating a thumbnail can take a few seconds. In these situations the API returns a `Location`-header pointing to a placeholder graphic for this file type.


            The placeholder graphic can be used in a user interface until the thumbnail generation has completed. The `Retry-After`-header indicates when to the thumbnail will be ready. At that time, retry this endpoint to retrieve the thumbnail.'
          headers:
            Retry-After:
              description: 'The time in seconds after which the thumbnail will be available.


                Your application only attempt to get the thumbnail again after this time.'
              schema:
                type: integer
                format: int64
            Location:
              description: A pointer to a placeholder graphic that can be used until the thumbnail has been generated.
              schema:
                type: string
                format: url
        '302':
          description: 'Returns an error when Box is not able to create a thumbnail for this file type.


            Instead, a `Location`-header pointing to a placeholder graphic for this file type will be returned.'
          headers:
            Location:
              description: A pointer to a placeholder graphic that can be used for this file type.
              schema:
                type: string
                format: url
        '400':
          description: 'Returns an error if some of the parameters are missing or not valid.


            - `requested_preview_unavailable` - an incorrect dimension was requested. This will happen if the dimension requested is larger or smaller than the available file sizes for the thumbnail format, or when when any of the size constraints contradict each other.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '403':
          description: Returned when the access token provided in the `Authorization` header is not recognized or not provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '404':
          description: 'Returned if the file is not found, or the user does not have access to the file, or for additional reasons.


            - `preview_cannot_be_generated` - Box does not support thumbnails for this type of file.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: files
      tags:
      - Files
      x-codeSamples:
      - lang: curl
        label: Get file thumbnail
        source: "curl -i -X GET \"https://api.box.com/2.0/files/12345/thumbnail.png\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\""
      - lang: dotnet
        label: Get file thumbnail
        source: 'await client.Files.GetFileThumbnailByIdAsync(fileId: thumbnailFile.Id, extension: GetFileThumbnailByIdExtension.Png);'
      - lang: swift
        label: Get file thumbnail
        source: 'try await client.files.getFileThumbnailById(fileId: thumbnailFile.id, extension_: GetFileThumbnailByIdExtension.png, downloadDestinationUrl: destinationPath)'
      - lang: java
        label: Get file thumbnail
        source: client.getFiles().getFileThumbnailById(thumbnailFile.getId(), GetFileThumbnailByIdExtension.PNG)
      - lang: node
        label: Get file thumbnail
        source: "await client.files.getFileThumbnailById(\n  thumbnailFile.id,\n  'png' as GetFileThumbnailByIdExtension,\n);"
      - lang: python
        label: Get file thumbnail
        source: "client.files.get_file_thumbnail_by_id(\n    thumbnail_file.id, GetFileThumbnailByIdExtension.PNG\n)"
components:
  schemas:
    File--Mini:
      description: A mini representation of a file, used when nested under another resource.
      type:
      - object
      - 'null'
      allOf:
      - $ref: '#/components/schemas/File--Base'
      - properties:
          sequence_id:
            allOf:
            - type:
              - string
              - 'null'
              example: '3'
              description: 'A numeric identifier that represents the most recent user event that has been applied to this item.


                This can be used in combination with the `GET /events`-endpoint to filter out user events that would have occurred before this identifier was read.


                An example would be where a Box Drive-like application would fetch an item via the API, and then listen to incoming user events for changes to the item. The application would ignore any user events where the `sequence_id` in the event is smaller than or equal to the `sequence_id` in the originally fetched resource.'
            - {}
          name:
            description: The name of the file.
            type: string
            example: Contract.pdf
          sha1:
            description: The SHA1 hash of the file. This can be used to compare the contents of a file on Box with a local file.
            type: string
            format: digest
            example: 85136C79CBF9FE36BB9D05D0639C70C265C18D37
          file_version:
            allOf:
            - $ref: '#/components/schemas/FileVersion--Mini'
            - description: The information about the current version of the file.
      title: File (Mini)
      x-box-resource-id: file--mini
      x-box-tag: files
      x-box-variant: mini
    SharedLinkOtpWritableNone:
      description: One-time-passcode (OTP) enforcement is turned off. The shared link is accessible without any one-time-passcode verification.
      type: object
      properties:
        mode:
          description: Set to `none` to disable OTP enforcement for the shared link.
          type: string
          example: none
          enum:
          - none
      required:
      - mode
      title: OTP turned off
    ClientError:
      description: A generic error.
      type: object
      properties:
        type:
          description: The value will always be `error`.
          type: string
          example: error
          enum:
          - error
        status:
          description: The HTTP status of the response.
          type: integer
          format: int32
          example: 400
        code:
          description: A Box-specific error code.
          type: string
          example: item_name_invalid
          enum:
          - created
          - accepted
          - no_content
          - redirect
          - not_modified
          - bad_request
          - unauthorized
          - forbidden
          - not_found
          - method_not_allowed
          - conflict
          - precondition_failed
          - unprocessable_entity
          - too_many_requests
          - internal_server_error
          - unavailable
          - item_name_invalid
          - insufficient_scope
        message:
          description: A short message describing the error.
          type: string
          example: Method Not Allowed
        context_info:
          description: A free-form object that contains additional context about the error. The possible fields are defined on a per-endpoint basis. `message` is only one example.
          type:
          - object
          - 'null'
          example:
            message: Something went wrong
          additionalProperties: {}
        help_url:
          description: A URL that links to more information about why this error occurred.
          type: string
          example: https://developer.box.com/guides/api-calls/permissions-and-errors/common-errors/
        request_id:
          description: A unique identifier for this response, which can be used when contacting Box support.
          type: string
          example: abcdef123456
      title: Client error
      x-box-resource-id: client_error
    FileVersion--Mini:
      description: A mini representation of a file version, used when nested within another resource.
      type: object
      allOf:
      - $ref: '#/components/schemas/FileVersion--Base'
      - properties:
          sha1:
            description: The SHA1 hash of this version of the file.
            type: string
            example: 134b65991ed521fcfe4724b7d814ab8ded5185dc
      title: File version (Mini)
      x-box-resource-id: file_version--mini
      x-box-variant: mini
    Resource:
      description: The file or folder resource.
      type: object
      oneOf:
      - $ref: '#/components/schemas/Folder--Mini'
      - $ref: '#/components/schemas/File--Mini'
      title: Resource
    User--Base:
      description: A mini representation of a user, used when nested within another resource.
      type: object
