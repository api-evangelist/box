      x-box-resource-id: metadata--base
      x-box-tag: file_metadata
      x-box-variant: base
      x-box-variants:
      - base
      - standard
      - full
    SharedLinkOtpWritableAllowlist:
      description: Anonymous recipients can request a one-time-passcode only when they enter an email that matches an entry on the `allowlist`.
      type: object
      properties:
        mode:
          description: Set to `allowlist` to restrict OTP requests to emails matching an entry on the `allowlist`.
          type: string
          example: allowlist
          enum:
          - allowlist
        allowlist:
          description: 'The list of email and domain entries that are permitted to access the shared link when `mode` is `allowlist`. Anonymous users whose email matches an entry can request and verify a one-time-passcode.


            Providing this field replaces the entire existing allowlist; passing an empty array clears all entries. Required when `mode` is `allowlist`.'
          type: array
          items:
            $ref: '#/components/schemas/SharedLinkOtpAllowlistEntryWritable'
          example:
          - type: email
            value: user@example.com
          - type: domain
            value: example.com
          maxItems: 1000
      required:
      - mode
      - allowlist
      title: OTP allowlist
    SharedLinkOtpAllowlistEntry:
      description: An entry on the OTP allowlist for a shared link. The entry can match either a specific email address or every email address that belongs to a domain.
      type: object
      properties:
        type:
          description: 'The kind of allowlist entry.


            - `email` - The entry matches a single email address.

            - `domain` - The entry matches every email address under the given domain.'
          type: string
          example: email
          enum:
          - email
          - domain
        value:
          description: 'The value of the allowlist entry.


            - For `email` entries, the full email address (must contain `@`).

            - For `domain` entries, the bare domain (e.g. `example.com`).'
          type: string
          example: alice@example.com
        created_at:
          description: The date and time when the allowlist entry was added.
          type: string
          format: date-time
          example: '2026-05-19T12:00:00Z'
        created_by:
          allOf:
          - $ref: '#/components/schemas/User--Base'
          - description: User who added this entry.
      required:
