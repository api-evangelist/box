openapi: 3.2.0
info:
  title: Box Platform Trashed folders API
  description: Box Platform provides functionality to provide access to content stored within Box. It provides endpoints for basic manipulation of files and folders, management of users within an enterprise, as well as more complex topics such as legal holds and retention policies.
  termsOfService: https://cloud.app.box.com/s/rmwxu64h1ipr41u49w3bbuvbsa29wku9
  contact:
    name: Box, Inc
    url: https://developer.box.com
    email: devrel@box.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '2024.0'
  x-box-commit-hash: 53bdced3cd
servers:
- url: https://api.box.com/2.0
  description: Box Platform API server.
security:
- OAuth2Security: []
tags:
- name: Trashed folders
  description: Folders that were deleted and are in trash.
  x-box-tag: trashed_folders
paths:
  /folders/{folder_id}:
    post:
      operationId: post_folders_id
      summary: Restore folder
      description: 'Restores a folder that has been moved to the trash.


        An optional new parent ID can be provided to restore the folder to in case the original folder has been deleted.


        During this operation, part of the file tree will be locked, mainly the source folder and all of its descendants, as well as the destination folder.


        For the duration of the operation, no other move, copy, delete, or restore operation can performed on any of the locked folders.'
      parameters:
      - name: folder_id
        in: path
        description: 'The unique identifier that represent a folder.


          The ID for any folder can be determined by visiting this folder in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/folder/123` the `folder_id` is `123`.


          The root folder of a Box account is always represented by the ID `0`.'
        required: true
        schema:
          type: string
        example: '12345'
      - name: fields
        in: query
        description: 'A comma-separated list of attributes to include in the response. This can be used to request fields that are not normally returned in a standard response.


          Be aware that specifying this parameter will have the effect that none of the standard fields are returned in the response unless explicitly specified, instead only fields for the mini representation are returned, additional to the fields requested.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - id
        - type
        - name
        explode: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: An optional new name for the folder.
                  type: string
                  example: Restored Photos
                parent:
                  allOf:
                  - type: object
                    description: The parent for this item.
                    properties:
                      id:
                        description: The ID of parent item.
                        type: string
                        example: '123'
                  - description: 'Specifies an optional ID of a folder to restore the folder to when the original folder no longer exists.


                      Please be aware that this ID will only be used if the original folder no longer exists. Use this ID to provide a fallback location to restore the folder to if the original location has been deleted.'
      responses:
        '201':
          description: Returns a folder object when the folder has been restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashFolderRestored'
        '403':
          description: Returns an error if the user does not have access to the folder the folder is being restored to, or the user does not have permission to restore folders from the trash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '404':
          description: Returns an error if the folder is not in the trash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '409':
          description: 'Returned an error if there is a folder with the same name in the destination folder.


            `operation_blocked_temporary`: Returned if either of the destination or source folders is locked due to another move, copy, delete or restore operation in process.


            The operation can be retried at a later point.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: trashed_folders
      tags:
      - Trashed folders
      x-codeSamples:
      - lang: curl
        label: Restore folder
        source: "curl -i -X POST \"https://api.box.com/2.0/folders/4353455\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\""
      - lang: dotnet
        label: Restore folder
        source: 'await client.TrashedFolders.RestoreFolderFromTrashAsync(folderId: folder.Id);'
      - lang: swift
        label: Restore folder
        source: 'try await client.trashedFolders.restoreFolderFromTrash(folderId: folder.id)'
      - lang: java
        label: Restore folder
        source: client.getTrashedFolders().restoreFolderFromTrash(folder.getId())
      - lang: node
        label: Restore folder
        source: await client.trashedFolders.restoreFolderFromTrash(folder.id);
      - lang: python
        label: Restore folder
        source: client.trashed_folders.restore_folder_from_trash(folder.id)
  /folders/{folder_id}/trash:
    get:
      operationId: get_folders_id_trash
      summary: Get trashed folder
      description: 'Retrieves a folder that has been moved to the trash.


        Please note that only if the folder itself has been moved to the trash can it be retrieved with this API call. If instead one of its parent folders was moved to the trash, only that folder can be inspected using the `GET /folders/:id/trash` API.


        To list all items that have been moved to the trash, please use the `GET /folders/trash/items` API.'
      parameters:
      - name: folder_id
        in: path
        description: 'The unique identifier that represent a folder.


          The ID for any folder can be determined by visiting this folder in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/folder/123` the `folder_id` is `123`.


          The root folder of a Box account is always represented by the ID `0`.'
        required: true
        schema:
          type: string
        example: '12345'
      - name: fields
        in: query
        description: 'A comma-separated list of attributes to include in the response. This can be used to request fields that are not normally returned in a standard response.


          Be aware that specifying this parameter will have the effect that none of the standard fields are returned in the response unless explicitly specified, instead only fields for the mini representation are returned, additional to the fields requested.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - id
        - type
        - name
        explode: false
      responses:
        '200':
          description: Returns the folder that was trashed, including information about when the it was moved to the trash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashFolder'
        '404':
          description: 'Returns an error if the folder can not be found directly in the trash.


            Please note that a `HTTP 404` is also returned if any of the folder''s parent folders have been moved to the trash.


            In that case, only that parent folder can be inspected using the [`GET /folders/:id/trash`](/reference/get-folders-id-trash) API.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: trashed_folders
      tags:
      - Trashed folders
      x-codeSamples:
      - lang: curl
        label: Get trashed folder
        source: "curl -i -X GET \"https://api.box.com/2.0/folders/4353455/trash\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\""
      - lang: dotnet
        label: Get trashed folder
        source: 'await client.TrashedFolders.GetTrashedFolderByIdAsync(folderId: folder.Id);'
      - lang: swift
        label: Get trashed folder
        source: 'try await client.trashedFolders.getTrashedFolderById(folderId: folder.id)'
      - lang: java
        label: Get trashed folder
        source: client.getTrashedFolders().getTrashedFolderById(folder.getId())
      - lang: node
        label: Get trashed folder
        source: await client.trashedFolders.getTrashedFolderById(folder.id);
      - lang: python
        label: Get trashed folder
        source: client.trashed_folders.get_trashed_folder_by_id(folder.id)
    delete:
      operationId: delete_folders_id_trash
      summary: Permanently remove folder
      description: Permanently deletes a folder that is in the trash. This action cannot be undone.
      parameters:
      - name: folder_id
        in: path
        description: 'The unique identifier that represent a folder.


          The ID for any folder can be determined by visiting this folder in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/folder/123` the `folder_id` is `123`.


          The root folder of a Box account is always represented by the ID `0`.'
        required: true
        schema:
          type: string
        example: '12345'
      responses:
        '204':
          description: Returns an empty response when the folder was permanently deleted.
        '404':
          description: Returns an error if the folder is not in the trash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: trashed_folders
      tags:
      - Trashed folders
      x-codeSamples:
      - lang: curl
        label: Permanently remove folder
        source: "curl -i -X DELETE \"https://api.box.com/2.0/folders/4353455/trash\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\""
      - lang: dotnet
        label: Permanently remove folder
        source: 'await client.TrashedFolders.DeleteTrashedFolderByIdAsync(folderId: folder.Id);'
      - lang: swift
        label: Permanently remove folder
        source: 'try await client.trashedFolders.deleteTrashedFolderById(folderId: folder.id)'
      - lang: java
        label: Permanently remove folder
        source: client.getTrashedFolders().deleteTrashedFolderById(folder.getId())
      - lang: node
        label: Permanently remove folder
        source: await client.trashedFolders.deleteTrashedFolderById(folder.id);
      - lang: python
        label: Permanently remove folder
        source: client.trashed_folders.delete_trashed_folder_by_id(folder.id)
components:
  schemas:
    TrashFolderRestored:
      description: Represents a folder restored from the trash.
      type: object
      properties:
        id:
          description: 'The unique identifier that represent a folder.


            The ID for any folder can be determined by visiting a folder in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/folders/123` the `folder_id` is `123`.'
          type: string
          example: '123456789'
        etag:
          description: The HTTP `etag` of this folder. This can be used within some API endpoints in the `If-Match` and `If-None-Match` headers to only perform changes on the folder if (no) changes have happened.
          type:
          - string
          - 'null'
          example: '1'
        type:
          description: The value will always be `folder`.
          type: string
          example: folder
          enum:
          - folder
        sequence_id:
          allOf:
          - type:
            - string
            - 'null'
            example: '3'
            description: 'A numeric identifier that represents the most recent user event that has been applied to this item.


              This can be used in combination with the `GET /events`-endpoint to filter out user events that would have occurred before this identifier was read.


              An example would be where a Box Drive-like application would fetch an item via the API, and then listen to incoming user events for changes to the item. The application would ignore any user events where the `sequence_id` in the event is smaller than or equal to the `sequence_id` in the originally fetched resource.'
          - {}
        name:
          description: The name of the folder.
          type: string
          example: Contracts
        created_at:
          description: The date and time when the folder was created. This value may be `null` for some folders such as the root folder or the trash folder.
          type:
          - string
          - 'null'
          format: date-time
          example: '2012-12-12T10:53:43-08:00'
        modified_at:
          description: The date and time when the folder was last updated. This value may be `null` for some folders such as the root folder or the trash folder.
          type:
          - string
          - 'null'
          format: date-time
          example: '2012-12-12T10:53:43-08:00'
        description:
          allOf:
          - type: string
            description: The optional description of this folder.
            maxLength: 256
            example: Legal contracts for the new ACME deal
          - {}
        size:
          description: 'The folder size in bytes.


            Be careful parsing this integer as its value can get very large.'
          type: integer
          format: int64
          example: 629644
        path_collection:
          allOf:
          - title: Path collection
            description: A list of parent folders for an item.
            type: object
            required:
            - total_count
            - entries
            properties:
              total_count:
                description: The number of folders in this list.
                type: integer
                format: int64
                example: 1
              entries:
                description: The parent folders for this item.
                type: array
                items:
                  $ref: '#/components/schemas/Folder--Mini'
          - description: The tree of folders that this file is contained in, starting at the root.
          - {}
        created_by:
          allOf:
          - $ref: '#/components/schemas/User--Mini'
          - description: The user who created this folder.
          - {}
        modified_by:
          allOf:
          - $ref: '#/components/schemas/User--Mini'
          - description: The user who last modified this folder.
          - {}
        trashed_at:
          description: The time at which this folder was put in the trash - becomes `null` after restore.
          type:
          - string
          - 'null'
          example: null
        purged_at:
          description: The time at which this folder is expected to be purged from the trash - becomes `null` after restore.
          type:
          - string
          - 'null'
          example: null
        content_created_at:
          description: The date and time at which this folder was originally created.
          type:
          - string
          - 'null'
          format: date-time
          example: '2012-12-12T10:53:43-08:00'
        content_modified_at:
          description: The date and time at which this folder was last updated.
          type:
          - string
          - 'null'
          format: date-time
          example: '2012-12-12T10:53:43-08:00'
        owned_by:
          allOf:
          - $ref: '#/components/schemas/User--Mini'
          - description: The user who owns this folder.
          - {}
        shared_link:
          description: The shared link for this file. This will be `null` if a folder had been trashed, even though the original shared link does become active again.
          type:
          - string
          - 'null'
          example: null
        folder_upload_email:
          description: The folder upload email for this folder. This will be `null` if a folder has been trashed, even though the original upload email does become active again.
          type:
          - string
          - 'null'
          example: null
        parent:
          allOf:
          - $ref: '#/components/schemas/Folder--Mini'
          - description: 'The optional folder that this folder is located within.


              This value may be `null` for some folders such as the root folder or the trash folder.'
          - {}
        item_status:
          description: 'Defines if this item has been deleted or not.


            - `active` when the item has is not in the trash,

            - `trashed` when the item has been moved to the trash but not deleted,

            - `deleted` when the item has been permanently deleted.'
          type: string
          example: active
          enum:
          - active
          - trashed
          - deleted
      title: Trashed Folder (Restored)
      x-box-resource-id: trash_folder_restored
      x-box-tag: trashed_folders
    Folder--Mini:
      description: A mini representation of a file version, used when nested under another resource.
      type: object
      allOf:
      - $ref: '#/components/schemas/Folder--Base'
      - properties:
          sequence_id:
            allOf:
            - type:
              - string
              - 'null'
              example: '3'
              description: 'A numeric identifier that represents the most recent user event that has been applied to this item.


                This can be used in combination with the `GET /events`-endpoint to filter out user events that would have occurred before this identifier was read.


                An example would be where a Box Drive-like application would fetch an item via the API, and then listen to incoming user events for changes to the item. The application would ignore any user events where the `sequence_id` in the event is smaller than or equal to the `sequence_id` in the originally fetched resource.'
            - {}
          name:
            description: The name of the folder.
            type: string
            example: Contracts
      title: Folder (Mini)
      x-box-resource-id: folder--mini
      x-box-tag: folders
      x-box-variant: mini
    ClientError:
      description: A generic error.
      type: object
      properties:
        type:
          description: The value will always be `error`.
          type: string
          example: error
          enum:
          - error
        status:
          description: The HTTP status of the response.
          type: integer
          format: int32
          example: 400
        code:
          description: A Box-specific error code.
          type: string
          example: item_name_invalid
          enum:
          - created
          - accepted
          - no_content
          - redirect
          - not_modified
          - bad_request
          - unauthorized
          - forbidden
          - not_found
          - method_not_allowed
          - conflict
          - precondition_failed
          - unprocessable_entity
          - too_many_requests
          - internal_server_error
          - unavailable
          - item_name_invalid
          - insufficient_scope
        message:
          description: A short message describing the error.
          type: string
          example: Method Not Allowed
        context_info:
          description: A free-form object that contains additional context about the error. The possible fields are defined on a per-endpoint basis. `message` is only one example.
          type:
          - object
          - 'null'
          example:
            message: Something went wrong
          additionalProperties: {}
        help_url:
          description: A URL that links to more information about why this error occurred.
          type: string
          example: https://developer.box.com/guides/api-calls/permissions-and-errors/common-errors/
        request_id:
          description: A unique identifier for this response, which can be used when contacting Box support.
          type: string
          example: abcdef123456
      title: Client error
      x-box-resource-id: client_error
    User--Mini:
      description: A mini representation of a user, as can be returned when nested within other resources.
      type: object
      allOf:
      - $ref: '#/components/schemas/User--Base'
      - properties:
          name:
            description: The display name of this user.
            type: string
            example: Aaron Levie
            maxLength: 50
          login:
            description: The primary email address of this user.
            type: string
            format: email
            example: ceo@example.com
      title: User (Mini)
      x-box-resource-id: user--mini
      x-box-tag: users
      x-box-variant: mini
    Folder--Base:
      description: The bare basic representation of a folder, the minimal amount of fields returned when using the `fields` query parameter.
      type: object
      properties:
        id:
          description: 'The unique identifier that represent a folder.


            The ID for any folder can be determined by visiting a folder in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/folders/123` the `folder_id` is `123`.'
          type: string
          example: '12345'
        etag:
          description: The HTTP `etag` of this folder. This can be used within some API endpoints in the `If-Match` and `If-None-Match` headers to only perform changes on the folder if (no) changes have happened.
          type:
          - string
          - 'null'
          example: '1'
        type:
          description: The value will always be `folder`.
          type: string
          example: folder
          enum:
          - folder
      required:
      - id
      - type
      title: Folder (Base)
      x-box-resource-id: folder--base
      x-box-tag: folders
      x-box-variant: base
      x-box-variants:
      - base
      - mini
      - standard
      - full
    TrashFolder:
      description: Represents a trashed folder.
      type: object
      properties:
        id:
          description: 'The unique identifier that represent a folder.


            The ID for any folder can be determined by visiting a folder in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/folders/123` the `folder_id` is `123`.'
          type: string
          example: '123456789'
        etag:
          description: The HTTP `etag` of this folder. This can be used within some API endpoints in the `If-Match` and `If-None-Match` headers to only perform changes on the folder if (no) changes have happened.
          type:
          - string
          - 'null'
          example: '1'
        type:
          description: The value will always be `folder`.
          type: string
          example: folder
          enum:
          - folder
        sequence_id:
          allOf:
          - type:
            - string
            - 'null'
            example: '3'
            description: 'A numeric identifier that represents the most recent user event that has been applied to this item.


              This can be used in combination with the `GET /events`-endpoint to filter out user events that would have occurred before this identifier was read.


              An example would be where a Box Drive-like application would fetch an item via the API, and then listen to incoming user events for changes to the item. The application would ignore any user events where the `sequence_id` in the event is smaller than or equal to the `sequence_id` in the originally fetched resource.'
          - {}
        name:
          description: The name of the folder.
          type: string
          example: Contracts
        created_at:
          description: The date and time when the folder was created. This value may be `null` for some folders such as the root folder or the trash folder.
          type:
          - string
          - 'null'
          format: date-time
          example: '2012-12-12T10:53:43-08:00'
        modified_at:
          description: The date and time when the folder was last updated. This value may be `null` for some folders such as the root folder or the trash folder.
          type:
          - string
          - 'null'
          format: date-time
          example: '2012-12-12T10:53:43-08:00'
        description:
          allOf:
          - type: string
            description: The optional description of this folder.
            maxLength: 256
            example: Legal contracts for the new ACME deal
          - {}
        size:
          description: 'The folder size in bytes.


            Be careful parsing this integer as its value can get very large.'
          type: integer
          format: int64
          example: 629644
        path_collection:
          allOf:
          - title: Path collection (Trash)
            description: A list of parent folders for an item in the trash.
            type: object
            required:
            - total_count
            - entries
            properties:
              total_count:
                description: The number of folders in this list.
                type: integer
                format: int64
                example: 1
              entries:
                description: Array of folders for this item's path collection.
                type: array
                items:
                  type: object
                  description: The parent folder for this item.
                  properties:
                    type:
                      description: The value will always be `folder`.
                      type: string
                      example: folder
                      enum:
                      - folder
                    id:
                      description: The unique identifier that represent a folder.
                      type: string
                      example: '123456789'
                    sequence_id:
                      description: This field is null for the Trash folder.
                      type:
                      - string
                      - 'null'
                      example: null
                    etag:
                      description: This field is null for the Trash folder.
                      type:
                      - string
                      - 'null'
                      example: null
                    name:
                      description: The name of the Trash folder.
                      type: string
                      example: Trash
          - description: The tree of folders that this file is contained in, starting at the root.
          - {}
        created_by:
          allOf:
          - $ref: '#/components/schemas/User--Mini'
          - description: The user who created this folder.
          - {}
        modified_by:
          allOf:
          - $ref: '#/components/schemas/User--Mini'
          - description: The user who last modified this folder.
          - {}
        trashed_at:
          description: The time at which this folder was put in the trash.
          type:
          - string
          - 'null'
          format: date-time
          example: '2012-12-12T10:53:43-08:00'
        purged_at:
          description: The time at which this folder is expected to be purged from the trash.
          type:
          - string
          - 'null'
          format: date-time
          example: '2012-12-12T10:53:43-08:00'
        content_created_at:
          description: The date and time at which this folder was originally created.
          type:
          - string
          - 'null'
          format: date-time
          example: '2012-12-12T10:53:43-08:00'
        content_modified_at:
          description: The date and time at which this folder was last updated.
          type:
          - string
          - 'null'
          format: date-time
          example: '2012-12-12T10:53:43-08:00'
        owned_by:
          allOf:
          - $ref: '#/components/schemas/User--Mini'
          - description: The user who owns this folder.
          - {}
        shared_link:
          description: The shared link for this folder. This will be `null` if a folder has been trashed, since the link will no longer be active.
          type:
          - string
          - 'null'
          example: null
        folder_upload_email:
          description: The folder upload email for this folder. This will be `null` if a folder has been trashed, since the upload will no longer work.
          type:
          - string
          - 'null'
          example: null
        parent:
          allOf:
          - $ref: '#/components/schemas/Folder--Mini'
          - description: 'The optional folder that this folder is located within.


              This value may be `null` for some folders such as the root folder or the trash folder.'
          - {}
        item_status:
          description: 'Defines if this item has been deleted or not.


            - `active` when the item has is not in the trash

            - `trashed` when the item has been moved to the trash but not deleted

            - `deleted` when the item has been permanently deleted.'
          type: string
          example: trashed
          enum:
          - active
