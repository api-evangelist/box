            - COLLABORATION_REMOVE
            - COLLABORATION_ROLE_CHANGE
            - COLLAB_ADD_COLLABORATOR
            - COLLAB_INVITE_COLLABORATOR
            - COLLAB_REMOVE_COLLABORATOR
