            - CONTENT_WORKFLOW_AUTOMATION_ADD
            - CONTENT_WORKFLOW_AUTOMATION_DELETE
            - CONTENT_WORKFLOW_POLICY_ADD
            - CONTENT_WORKFLOW_SHARING_POLICY_VIOLATION
            - CONTENT_WORKFLOW_UPLOAD_POLICY_VIOLATION
            - COPY
            - DATA_RETENTION_CREATE_RETENTION
            - DATA_RETENTION_REMOVE_RETENTION
            - DELETE
            - DELETE_USER
            - DEVICE_TRUST_CHECK_FAILED
            - DOWNLOAD
            - EDIT
            - EDIT_USER
            - EMAIL_ALIAS_CONFIRM
            - EMAIL_ALIAS_REMOVE
            - ENABLE_TWO_FACTOR_AUTH
            - ENTERPRISE_APP_AUTHORIZATION_UPDATE
            - FAILED_LOGIN
            - FILE_MARKED_MALICIOUS
            - FILE_WATERMARKED_DOWNLOAD
            - GROUP_ADD_ITEM
            - GROUP_ADD_USER
            - GROUP_CREATION
            - GROUP_DELETION
            - GROUP_EDITED
            - GROUP_REMOVE_ITEM
            - GROUP_REMOVE_USER
            - ITEM_COPY
            - ITEM_CREATE
            - ITEM_DOWNLOAD
            - ITEM_MAKE_CURRENT_VERSION
            - ITEM_MODIFY
            - ITEM_MOVE
            - ITEM_OPEN
            - ITEM_PREVIEW
            - ITEM_RENAME
            - ITEM_SHARED
            - ITEM_SHARED_CREATE
            - ITEM_SHARED_UNSHARE
            - ITEM_SHARED_UPDATE
            - ITEM_SYNC
            - ITEM_TRASH
            - ITEM_UNDELETE_VIA_TRASH
            - ITEM_UNSYNC
            - ITEM_UPLOAD
