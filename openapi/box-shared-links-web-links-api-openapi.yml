components:
  schemas:
    SharedLinkOtpAllowlistEntryWritable:
      description: An entry used to write the OTP allowlist for a shared link. The entry can match either a specific email address or every email address that belongs to a domain.
      type: object
      properties:
        type:
          description: 'The kind of allowlist entry.


            - `email` - The entry matches a single email address.

            - `domain` - The entry matches every email address under the given domain.'
          type: string
          example: email
          enum:
          - email
          - domain
        value:
          description: 'The value of the allowlist entry.


            - For `email` entries, the full email address (must contain `@`).

            - For `domain` entries, the bare domain (e.g. `example.com`).'
          type: string
          example: alice@example.com
      required:
      - type
      - value
      title: Shared link OTP allowlist entry (Write)
    SharedLinkOtpWritableOpen:
      description: Any anonymous recipient can request a one-time-passcode to any email address and access the shared link after verifying it. Collaborators and registered Box users access the link without being prompted.
      type: object
      properties:
        mode:
          description: Set to `open` to allow any anonymous recipient to request a one-time-passcode to any email address.
          type: string
          example: open
          enum:
          - open
      required:
      - mode
      title: OTP open
    Folder--Mini:
      description: A mini representation of a file version, used when nested under another resource.
      type: object
      allOf:
      - $ref: '#/components/schemas/Folder--Base'
      - properties:
          sequence_id:
            allOf:
            - type:
              - string
              - 'null'
              example: '3'
              description: 'A numeric identifier that represents the most recent user event that has been applied to this item.


                This can be used in combination with the `GET /events`-endpoint to filter out user events that would have occurred before this identifier was read.


                An example would be where a Box Drive-like application would fetch an item via the API, and then listen to incoming user events for changes to the item. The application would ignore any user events where the `sequence_id` in the event is smaller than or equal to the `sequence_id` in the originally fetched resource.'
            - {}
          name:
            description: The name of the folder.
            type: string
            example: Contracts
      title: Folder (Mini)
      x-box-resource-id: folder--mini
      x-box-tag: folders
      x-box-variant: mini
    SharedLinkOtpWritableNone:
      description: One-time-passcode (OTP) enforcement is turned off. The shared link is accessible without any one-time-passcode verification.
      type: object
      properties:
        mode:
          description: Set to `none` to disable OTP enforcement for the shared link.
          type: string
          example: none
          enum:
          - none
      required:
      - mode
      title: OTP turned off
    SharedLinkOtpWritableAllowlist:
      description: Anonymous recipients can request a one-time-passcode only when they enter an email that matches an entry on the `allowlist`.
      type: object
      properties:
        mode:
          description: Set to `allowlist` to restrict OTP requests to emails matching an entry on the `allowlist`.
          type: string
          example: allowlist
          enum:
          - allowlist
        allowlist:
          description: 'The list of email and domain entries that are permitted to access the shared link when `mode` is `allowlist`. Anonymous users whose email matches an entry can request and verify a one-time-passcode.


            Providing this field replaces the entire existing allowlist; passing an empty array clears all entries. Required when `mode` is `allowlist`.'
          type: array
          items:
            $ref: '#/components/schemas/SharedLinkOtpAllowlistEntryWritable'
          example:
          - type: email
            value: user@example.com
          - type: domain
            value: example.com
          maxItems: 1000
      required:
      - mode
      - allowlist
      title: OTP allowlist
    ClientError:
      description: A generic error.
      type: object
      properties:
        type:
          description: The value will always be `error`.
          type: string
          example: error
          enum:
          - error
        status:
          description: The HTTP status of the response.
          type: integer
          format: int32
          example: 400
        code:
          description: A Box-specific error code.
          type: string
          example: item_name_invalid
          enum:
          - created
          - accepted
          - no_content
          - redirect
          - not_modified
          - bad_request
          - unauthorized
          - forbidden
          - not_found
          - method_not_allowed
          - conflict
          - precondition_failed
          - unprocessable_entity
          - too_many_requests
          - internal_server_error
          - unavailable
          - item_name_invalid
          - insufficient_scope
        message:
          description: A short message describing the error.
          type: string
          example: Method Not Allowed
        context_info:
          description: A free-form object that contains additional context about the error. The possible fields are defined on a per-endpoint basis. `message` is only one example.
          type:
          - object
          - 'null'
          example:
            message: Something went wrong
          additionalProperties: {}
        help_url:
          description: A URL that links to more information about why this error occurred.
          type: string
          example: https://developer.box.com/guides/api-calls/permissions-and-errors/common-errors/
        request_id:
          description: A unique identifier for this response, which can be used when contacting Box support.
          type: string
          example: abcdef123456
      title: Client error
      x-box-resource-id: client_error
    WebLink--Base:
      description: 'Web links are objects that point to URLs. These objects are also known as bookmarks within the Box web application.


        Web link objects are treated similarly to file objects, they will also support most actions that apply to regular files.'
      type: object
      properties:
        id:
          description: The unique identifier for this web link.
          type: string
          example: '11446498'
        type:
          description: The value will always be `web_link`.
          type: string
          example: web_link
          enum:
          - web_link
        etag:
          description: The entity tag of this web link. Used with `If-Match` headers.
          type: string
          example: '1'
      required:
      - id
      - type
      title: Web link (Base)
      x-box-resource-id: web_link--base
      x-box-tag: web_links
      x-box-variant: base
      x-box-variants:
      - base
      - mini
      - standard
    WebLink--Mini:
      description: 'Web links are objects that point to URLs. These objects are also known as bookmarks within the Box web application.


        Web link objects are treated similarly to file objects, they will also support most actions that apply to regular files.'
      type: object
      allOf:
      - $ref: '#/components/schemas/WebLink--Base'
      - properties:
          url:
            description: The URL this web link points to.
            type: string
            example: https://www.example.com/example/1234
          sequence_id:
            allOf:
            - type:
              - string
              - 'null'
              example: '3'
              description: 'A numeric identifier that represents the most recent user event that has been applied to this item.


                This can be used in combination with the `GET /events`-endpoint to filter out user events that would have occurred before this identifier was read.


                An example would be where a Box Drive-like application would fetch an item via the API, and then listen to incoming user events for changes to the item. The application would ignore any user events where the `sequence_id` in the event is smaller than or equal to the `sequence_id` in the originally fetched resource.'
            - {}
          name:
            description: The name of the web link.
            type: string
            example: My Bookmark
      title: Web link (Mini)
      x-box-resource-id: web_link--mini
      x-box-tag: web_links
      x-box-variant: mini
    SharedLinkOtpAllowlistEntry:
      description: An entry on the OTP allowlist for a shared link. The entry can match either a specific email address or every email address that belongs to a domain.
      type: object
      properties:
        type:
          description: 'The kind of allowlist entry.


            - `email` - The entry matches a single email address.

            - `domain` - The entry matches every email address under the given domain.'
          type: string
          example: email
          enum:
          - email
          - domain
        value:
          description: 'The value of the allowlist entry.


            - For `email` entries, the full email address (must contain `@`).

            - For `domain` entries, the bare domain (e.g. `example.com`).'
          type: string
          example: alice@example.com
        created_at:
          description: The date and time when the allowlist entry was added.
          type: string
          format: date-time
          example: '2026-05-19T12:00:00Z'
        created_by:
          allOf:
          - $ref: '#/components/schemas/User--Base'
          - description: User who added this entry.
      required:
      - type
      - value
      - created_at
      - created_by
      title: Shared link OTP allowlist entry
    Collection:
      description: 'A collection of items, including files and folders.


        Currently, the only collection available is the `favorites` collection.


        The contents of a collection can be explored in a similar way to which the contents of a folder is explored.'
      type: object
      properties:
        id:
          description: The unique identifier for this collection.
          type: string
          example: '11446498'
        type:
          description: The value will always be `collection`.
          type: string
          example: collection
          enum:
          - collection
        name:
          description: The name of the collection.
          type: string
          example: Favorites
          enum:
          - Favorites
        collection_type:
          description: The type of the collection. This is used to determine the proper visual treatment for collections.
          type: string
          example: favorites
          enum:
          - favorites
      title: Collection
      x-box-resource-id: collection
      x-box-tag: collections
    User--Mini:
      description: A mini representation of a user, as can be returned when nested within other resources.
      type: object
      allOf:
      - $ref: '#/components/schemas/User--Base'
      - properties:
          name:
            description: The display name of this user.
            type: string
            example: Aaron Levie
            maxLength: 50
          login:
            description: The primary email address of this user.
            type: string
            format: email
            example: ceo@example.com
      title: User (Mini)
      x-box-resource-id: user--mini
      x-box-tag: users
      x-box-variant: mini
    Folder--Base:
      description: The bare basic representation of a folder, the minimal amount of fields returned when using the `fields` query parameter.
      type: object
      properties:
        id:
          description: 'The unique identifier that represent a folder.


            The ID for any folder can be determined by visiting a folder in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/folders/123` the `folder_id` is `123`.'
          type: string
          example: '12345'
        etag:
          description: The HTTP `etag` of this folder. This can be used within some API endpoints in the `If-Match` and `If-None-Match` headers to only perform changes on the folder if (no) changes have happened.
          type:
          - string
          - 'null'
          example: '1'
        type:
          description: The value will always be `folder`.
          type: string
          example: folder
          enum:
          - folder
      required:
      - id
      - type
      title: Folder (Base)
      x-box-resource-id: folder--base
      x-box-tag: folders
      x-box-variant: base
      x-box-variants:
      - base
      - mini
      - standard
      - full
    SharedLinkOtpWritable:
      description: 'One-time-passcode (OTP) settings for a shared link. When OTP enforcement is enabled, anonymous users must verify their identity via a one-time-passcode emailed to them before the shared link will grant access.


        OTP can only be used with shared links that have an `access` level of `open`. Password protection and OTP cannot be enabled at the same time.'
      oneOf:
      - $ref: '#/components/schemas/SharedLinkOtpWritableNone'
      - $ref: '#/components/schemas/SharedLinkOtpWritableOpen'
      - $ref: '#/components/schemas/SharedLinkOtpWritableAllowlist'
      title: Shared link OTP settings (Write)
    WebLink:
      description: 'Web links are objects that point to URLs. These objects are also known as bookmarks within the Box web application.


        Web link objects are treated similarly to file objects, they will also support most actions that apply to regular files.'
      type: object
      allOf:
      - $ref: '#/components/schemas/WebLink--Mini'
      - properties:
          parent:
            allOf:
            - $ref: '#/components/schemas/Folder--Mini'
            - description: The parent object the web link belongs to.
          description:
            description: The description accompanying the web link. This is visible within the Box web application.
            type: string
            example: Example page
          path_collection:
            allOf:
            - title: Path collection
              description: A list of parent folders for an item.
              type: object
              required:
              - total_count
              - entries
              properties:
                total_count:
                  description: The number of folders in this list.
                  type: integer
                  format: int64
                  example: 1
                entries:
                  description: The parent folders for this item.
                  type: array
                  items:
                    $ref: '#/components/schemas/Folder--Mini'
            - description: The tree of folders that this web link is contained in, starting at the root.
            - {}
          created_at:
            description: When this file was created on Box’s servers.
            type: string
            format: date-time
            example: '2012-12-12T10:53:43-08:00'
          modified_at:
            description: When this file was last updated on the Box servers.
            type: string
            format: date-time
            example: '2012-12-12T10:53:43-08:00'
          trashed_at:
            description: When this file was moved to the trash.
            type:
            - string
            - 'null'
            format: date-time
            example: '2012-12-12T10:53:43-08:00'
          purged_at:
            description: When this file will be permanently deleted.
            type:
            - string
            - 'null'
            format: date-time
            example: '2012-12-12T10:53:43-08:00'
          created_by:
            allOf:
            - $ref: '#/components/schemas/User--Mini'
            - description: The user who created this web link.
          modified_by:
            allOf:
            - $ref: '#/components/schemas/User--Mini'
            - description: The user who last modified this web link.
          owned_by:
            allOf:
            - $ref: '#/components/schemas/User--Mini'
            - description: The user who owns this web link.
          shared_link:
            allOf:
            - title: Shared link
              description: 'Shared links provide direct, read-only access to files or folder on Box.


                Shared links with open access level allow anyone with the URL to access the item, while shared links with company or collaborators access levels can only be accessed by appropriately authenticated Box users.'
              type: object
              required:
              - url
              - accessed
              - effective_access
              - effective_permission
              - is_password_enabled
              - download_count
              - preview_count
              - one_time_passcode
              properties:
                url:
                  description: 'The URL that can be used to access the item on Box.


                    This URL will display the item in Box''s preview UI where the file can be downloaded if allowed.


                    This URL will continue to work even when a custom `vanity_url` has been set for this shared link.'
                  type: string
                  format: url
                  example: https://www.box.com/s/vspke7y05sb214wjokpk
                download_url:
                  description: 'A URL that can be used to download the file. This URL can be used in a browser to download the file. This URL includes the file extension so that the file will be saved with the right file type.


                    This property will be `null` for folders.'
                  type:
                  - string
                  - 'null'
                  format: url
                  example: https://www.box.com/shared/static/rh935iit6ewrmw0unyul.jpeg
                  x-box-premium-feature: true
                vanity_url:
                  description: The "Custom URL" that can also be used to preview the item on Box. Custom URLs can only be created or modified in the Box Web application.
                  type:
                  - string
                  - 'null'
                  format: url
                  example: https://acme.app.box.com/v/my_url/
                vanity_name:
                  description: The custom name of a shared link, as used in the `vanity_url` field.
                  type:
                  - string
                  - 'null'
                  example: my_url
                access:
                  description: 'The access level for this shared link.


                    - `open` - provides access to this item to anyone with this link

                    - `company` - only provides access to this item to people the same company

                    - `collaborators` - only provides access to this item to people who are collaborators on this item


                    If this field is omitted when creating the shared link, the access level will be set to the default access level specified by the enterprise admin.'
                  type: string
                  example: open
                  enum:
                  - open
                  - company
                  - collaborators
                effective_access:
                  description: The effective access level for the shared link. This can be a more restrictive access level than the value in the `access` field when the enterprise settings restrict the allowed access levels.
                  type: string
                  example: company
                  enum:
                  - open
                  - company
                  - collaborators
                effective_permission:
                  description: The effective permissions for this shared link. These result in the more restrictive combination of the share link permissions and the item permissions set by the administrator, the owner, and any ancestor item such as a folder.
                  type: string
                  example: can_download
                  enum:
                  - can_edit
                  - can_download
                  - can_preview
                  - no_access
                unshared_at:
                  description: The date and time when this link will be unshared. This field can only be set by users with paid accounts.
                  type:
                  - string
                  - 'null'
                  format: date-time
                  example: '2018-04-13T13:53:23-07:00'
                is_password_enabled:
                  description: Defines if the shared link requires a password to access the item.
                  type: boolean
                  example: true
                permissions:
                  description: Defines if this link allows a user to preview, edit, and download an item. These permissions refer to the shared link only and do not supersede permissions applied to the item itself.
                  type: object
                  properties:
                    can_download:
                      description: 'Defines if the shared link allows for the item to be downloaded. For shared links on folders, this also applies to any items in the folder.


                        This value can be set to `true` when the effective access level is set to `open` or `company`, not `collaborators`.'
                      type: boolean
                      example: true
                    can_preview:
                      description: 'Defines if the shared link allows for the item to be previewed.


                        This value is always `true`. For shared links on folders this also applies to any items in the folder.'
                      type: boolean
                      example: true
                    can_edit:
                      description: 'Defines if the shared link allows for the item to be edited.


                        This value can only be `true` if `can_download` is also `true` and if the item has a type of `file`.'
                      type: boolean
                      example: false
                  required:
                  - can_download
                  - can_preview
                  - can_edit
                download_count:
                  description: The number of times this item has been downloaded.
                  type: integer
                  example: 3
                preview_count:
                  description: The number of times this item has been previewed.
                  type: integer
                  example: 3
                one_time_passcode:
                  allOf:
                  - title: Shared link OTP settings
                    description: 'One-time-passcode (OTP) settings for a shared link. When OTP enforcement is enabled, anonymous users must verify their identity via a one-time-passcode emailed to them before the shared link will grant access.


                      OTP can only be used with shared links that have an `access` level of `open`. Password protection and OTP cannot be enabled at the same time.'
                    type: object
                    required:
                    - mode
                    properties:
                      mode:
                        description: 'The current OTP enforcement mode for the shared link.


                          - `none` - OTP enforcement is turned off. The shared link is accessible without any one-time-passcode verification.

                          - `open` - Any anonymous recipient can request a one-time-passcode to any email address and access the shared link after verifying it. Collaborators and registered Box users access the link without being prompted.

                          - `allowlist` - Anonymous recipients can request a one-time-passcode only when they enter an email that matches an entry on the `allowlist`.'
                        type: string
                        example: allowlist
                      allowlist:
                        description: 'The list of email and domain entries that are permitted to access the shared link when `mode` is `allowlist`. Anonymous users whose email matches an entry can request and verify a one-time-passcode.


                          Because the entries carry recipient email addresses and the identity of the user who added them, this field is only returned to users with owner, co-owner, or editor access on the item. For viewer collaborators and below the field is omitted.


                          An allowlist contains at most 1000 entries, matching the limit enforced when setting the allowlist on a shared link.'
                        type: array
                        items:
                          $ref: '#/components/schemas/SharedLinkOtpAllowlistEntry'
                        example:
                        - type: email
                          value: alice@example.com
                          created_at: '2026-05-19T12:00:00Z'
                          created_by:
                            id: '11446498'
                            type: user
                        - type: domain
                          value: example.com
                          created_at: '2026-05-19T12:00:00Z'
                          created_by:
                            id: '11446498'
                            type: user
                        maxItems: 1000
                  - description: 'The one-time-passcode (OTP) settings for this shared link.


                      This field is always present. For links where OTP does not apply (for example, shared links whose `access` is not `open`), the object is returned with `mode` set to `none`.'
            - description: The shared link object for this item. Will be `null` if no shared link has been created.
          item_status:
            description: Whether this item is deleted or not. Values include `active`, `trashed` if the file has been moved to the trash, and `deleted` if the file has been permanently deleted.
            type: string
            example: active
            enum:
            - active
            - trashed
            - deleted
          collections:
            description: 'The collections that this web link belongs to.


              For more information, see the [collections guide](/guides/collections).'
            type: array
            items:
              $ref: '#/components/schemas/Collection'
          allowed_shared_link_access_levels:
            description: 'The shared link access levels the authenticated user is allowed to use when creating or updating a shared link for this web link.


              The list depends on item policy and user authorization, so it may be narrower than the levels available to the owner. An empty array means no access level is available to this user.'
            type: array
            items:
              title: Shared link access level
              type: string
              description: The access level for a shared link.
              example: open
              enum:
              - open
              - company
              - collaborators
            example:
            - open
      title: Web link
      x-box-resource-id: web_link
      x-box-tag: web_links
      x-box-variant: standard
    User--Base:
      description: A mini representation of a user, used when nested within another resource.
      type: object
      properties:
        id:
          description: The unique identifier for this user.
          type: string
          example: '11446498'
        type:
          description: The value will always be `user`.
          type: string
          example: user
          enum:
          - user
      required:
      - type
      - id
      title: User (Base)
      x-box-resource-id: user--base
      x-box-tag: users
      x-box-variant: base
      x-box-variants:
      - base
      - mini
      - standard
      - full
  securitySchemes:
    OAuth2Security:
      type: oauth2
      description: The access token received from the authorization server in the OAuth 2.0 flow.
      flows:
        authorizationCode:
          authorizationUrl: https://account.box.com/api/oauth2/authorize
          tokenUrl: https://api.box.com/oauth2/token
          scopes:
            root_readonly: Read all files and folders stored in Box
            root_readwrite: Read and write all files and folders stored in Box
            manage_app_users: Provision and manage app users
            manage_managed_users: Provision and manage managed users
            manage_groups: Manage an enterprise's groups
            manage_webhook: Create webhooks programmatically through the API
            manage_enterprise_properties: Manage enterprise properties
            manage_data_retention: Manage data retention polices
            manage_legal_hold: Manage Legal Holds
