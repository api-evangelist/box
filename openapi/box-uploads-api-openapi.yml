            type: boolean
            example: true
          download_url:
            description: 'A pre-authorized, expiring URL for directly downloading the file''s content. Requires authentication and is valid only for the current session.


              This field is only returned for files, not folders or web links.'
            type: string
            format: url
            example: https://dl.boxcloud.com/d/1/example_token/download
          authenticated_download_url:
            description: 'A stable API URL for the file content endpoint, `/2.0/files/{id}/content`. Unlike `download_url`, authorization is evaluated when the URL is requested with a valid access token.


