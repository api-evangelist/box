openapi: 3.2.0
info:
  title: Box Platform Trashed items API
  description: Box Platform provides functionality to provide access to content stored within Box. It provides endpoints for basic manipulation of files and folders, management of users within an enterprise, as well as more complex topics such as legal holds and retention policies.
  termsOfService: https://cloud.app.box.com/s/rmwxu64h1ipr41u49w3bbuvbsa29wku9
  contact:
    name: Box, Inc
    url: https://developer.box.com
    email: devrel@box.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '2024.0'
  x-box-commit-hash: 53bdced3cd
servers:
- url: https://api.box.com/2.0
  description: Box Platform API server.
security:
- OAuth2Security: []
tags:
- name: Trashed items
  description: Items that were deleted and are in trash.
  x-box-tag: trashed_items
paths:
  /folders/trash/items:
    get:
      operationId: get_folders_trash_items
      summary: List trashed items
      description: 'Retrieves the files and folders that have been moved to the trash.


        Any attribute in the full files or folders objects can be passed in with the `fields` parameter to retrieve those specific attributes that are not returned by default.


        This endpoint defaults to use offset-based pagination, yet also supports marker-based pagination using the `marker` parameter.


        The number of entries returned may be less than `total_count`. For example, if a user deletes items from a shared folder and is later removed as a collaborator, those deleted items will no longer appear in this endpoint’s results, even though they are still included in `total_count`.'
      parameters:
      - name: fields
        in: query
        description: 'A comma-separated list of attributes to include in the response. This can be used to request fields that are not normally returned in a standard response.


          Be aware that specifying this parameter will have the effect that none of the standard fields are returned in the response unless explicitly specified, instead only fields for the mini representation are returned, additional to the fields requested.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - id
        - type
        - name
        explode: false
      - name: limit
        in: query
        description: The maximum number of items to return per page.
        required: false
        schema:
          type: integer
          format: int64
          maximum: 1000
        example: 1000
      - name: offset
        in: query
        description: 'The offset of the item at which to begin the response.


          Queries with offset parameter value exceeding 10000 will be rejected with a 400 response.'
        required: false
        schema:
          type: integer
          format: int64
          default: 0
        example: 1000
      - name: usemarker
        in: query
        description: 'Specifies whether to use marker-based pagination instead of offset-based pagination. Only one pagination method can be used at a time.


          By setting this value to true, the API will return a `marker` field that can be passed as a parameter to this endpoint to get the next page of the response.'
        required: false
        schema:
          type: boolean
        example: true
      - name: marker
        in: query
        description: 'Defines the position marker at which to begin returning results. This is used when paginating using marker-based pagination.


          This requires `usemarker` to be set to `true`.'
        required: false
        schema:
          type: string
        example: JV9IRGZmieiBasejOG9yDCRNgd2ymoZIbjsxbJMjIs3kioVii
      - name: direction
        in: query
        description: The direction to sort results in. This can be either in alphabetical ascending (`ASC`) or descending (`DESC`) order.
        required: false
        schema:
          type: string
          enum:
          - ASC
          - DESC
        example: ASC
      - name: sort
        in: query
        description: 'Defines the **second** attribute by which items are sorted.


          Items are always sorted by their `type` first, with folders listed before files, and files listed before web links.


          This parameter is not supported when using marker-based pagination.'
        required: false
        schema:
          type: string
          enum:
          - name
          - date
          - size
        example: name
      responses:
        '200':
          description: Returns a list of items that have been deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Items'
        '400':
          description: 'Returns an error if some of the parameters are missing or not valid.


            - `invalid_parameter` can appear when the `sort`, `direction` or `offset` parameter is provided when using marker based pagination, or when the `marker` parameter is provided but `usemarker` is set to `false` or `null`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: trashed_items
      tags:
      - Trashed items
      x-codeSamples:
      - lang: curl
        label: List trashed items
        source: "curl -i -X GET \"https://api.box.com/2.0/folders/trash/items\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\""
      - lang: dotnet
        label: List trashed items
        source: await client.TrashedItems.GetTrashedItemsAsync();
      - lang: swift
        label: List trashed items
        source: try await client.trashedItems.getTrashedItems()
      - lang: java
        label: List trashed items
        source: client.getTrashedItems().getTrashedItems()
      - lang: node
        label: List trashed items
        source: await client.trashedItems.getTrashedItems();
      - lang: python
        label: List trashed items
        source: client.trashed_items.get_trashed_items()
components:
  schemas:
    File--Mini:
      description: A mini representation of a file, used when nested under another resource.
      type:
      - object
      - 'null'
      allOf:
      - $ref: '#/components/schemas/File--Base'
      - properties:
          sequence_id:
            allOf:
            - type:
              - string
              - 'null'
              example: '3'
              description: 'A numeric identifier that represents the most recent user event that has been applied to this item.


                This can be used in combination with the `GET /events`-endpoint to filter out user events that would have occurred before this identifier was read.


                An example would be where a Box Drive-like application would fetch an item via the API, and then listen to incoming user events for changes to the item. The application would ignore any user events where the `sequence_id` in the event is smaller than or equal to the `sequence_id` in the originally fetched resource.'
            - {}
          name:
            description: The name of the file.
            type: string
            example: Contract.pdf
          sha1:
            description: The SHA1 hash of the file. This can be used to compare the contents of a file on Box with a local file.
            type: string
            format: digest
            example: 85136C79CBF9FE36BB9D05D0639C70C265C18D37
          file_version:
            allOf:
            - $ref: '#/components/schemas/FileVersion--Mini'
            - description: The information about the current version of the file.
      title: File (Mini)
      x-box-resource-id: file--mini
      x-box-tag: files
      x-box-variant: mini
    ClientError:
      description: A generic error.
      type: object
      properties:
        type:
          description: The value will always be `error`.
          type: string
          example: error
          enum:
          - error
        status:
          description: The HTTP status of the response.
          type: integer
          format: int32
          example: 400
        code:
          description: A Box-specific error code.
          type: string
          example: item_name_invalid
          enum:
          - created
          - accepted
          - no_content
          - redirect
          - not_modified
          - bad_request
          - unauthorized
          - forbidden
          - not_found
          - method_not_allowed
          - conflict
          - precondition_failed
          - unprocessable_entity
          - too_many_requests
          - internal_server_error
          - unavailable
          - item_name_invalid
          - insufficient_scope
        message:
          description: A short message describing the error.
          type: string
          example: Method Not Allowed
        context_info:
          description: A free-form object that contains additional context about the error. The possible fields are defined on a per-endpoint basis. `message` is only one example.
          type:
          - object
          - 'null'
          example:
            message: Something went wrong
          additionalProperties: {}
        help_url:
          description: A URL that links to more information about why this error occurred.
          type: string
          example: https://developer.box.com/guides/api-calls/permissions-and-errors/common-errors/
        request_id:
          description: A unique identifier for this response, which can be used when contacting Box support.
          type: string
          example: abcdef123456
      title: Client error
      x-box-resource-id: client_error
    FileVersion--Mini:
      description: A mini representation of a file version, used when nested within another resource.
      type: object
      allOf:
      - $ref: '#/components/schemas/FileVersion--Base'
      - properties:
          sha1:
            description: The SHA1 hash of this version of the file.
            type: string
            example: 134b65991ed521fcfe4724b7d814ab8ded5185dc
      title: File version (Mini)
      x-box-resource-id: file_version--mini
      x-box-variant: mini
    Resource:
      description: The file or folder resource.
      type: object
      oneOf:
      - $ref: '#/components/schemas/Folder--Mini'
      - $ref: '#/components/schemas/File--Mini'
      title: Resource
    User--Base:
      description: A mini representation of a user, used when nested within another resource.
      type: object
      properties:
        id:
          description: The unique identifier for this user.
          type: string
          example: '11446498'
        type:
          description: The value will always be `user`.
          type: string
          example: user
          enum:
          - user
      required:
      - type
      - id
      title: User (Base)
      x-box-resource-id: user--base
      x-box-tag: users
      x-box-variant: base
      x-box-variants:
      - base
      - mini
      - standard
      - full
    ResourceScope:
      description: A relation between a resource (file or folder) and the scopes for which the resource can be accessed.
      type: object
      properties:
        scope:
          description: The scopes for the resource access.
          type: string
          example: item_download
          enum:
          - annotation_edit
          - annotation_view_all
          - annotation_view_self
          - base_explorer
          - base_picker
          - base_preview
          - base_upload
          - item_delete
          - item_download
          - item_preview
          - item_rename
          - item_share
          - item_upload
          - item_read
        object:
          $ref: '#/components/schemas/Resource'
      title: Resource scope
    Metadata--Base:
      description: The base representation of a metadata instance.
      type: object
      properties:
        $parent:
          description: The identifier of the item that this metadata instance has been attached to. This combines the `type` and the `id` of the parent in the form `{type}_{id}`.
          type: string
          example: folder_59449484661,
        $template:
          description: The name of the template.
          type: string
          example: marketingCollateral
        $scope:
          description: An ID for the scope in which this template has been applied. This will be `enterprise_{enterprise_id}` for templates defined for use in this enterprise, and `global` for general templates that are available to all enterprises using Box.
          type: string
          example: enterprise_27335
        $version:
          description: The version of the metadata instance. This version starts at 0 and increases every time a user-defined property is modified.
          type: integer
          example: 1
      title: Metadata instance (Base)
      x-box-resource-id: metadata--base
      x-box-tag: file_metadata
      x-box-variant: base
      x-box-variants:
      - base
      - standard
      - full
    WebLink--Base:
      description: 'Web links are objects that point to URLs. These objects are also known as bookmarks within the Box web application.


        Web link objects are treated similarly to file objects, they will also support most actions that apply to regular files.'
      type: object
      properties:
        id:
          description: The unique identifier for this web link.
          type: string
          example: '11446498'
        type:
          description: The value will always be `web_link`.
          type: string
          example: web_link
          enum:
          - web_link
        etag:
          description: The entity tag of this web link. Used with `If-Match` headers.
          type: string
          example: '1'
      required:
      - id
      - type
      title: Web link (Base)
      x-box-resource-id: web_link--base
      x-box-tag: web_links
      x-box-variant: base
      x-box-variants:
      - base
      - mini
      - standard
    SharedLinkOtpAllowlistEntry:
      description: An entry on the OTP allowlist for a shared link. The entry can match either a specific email address or every email address that belongs to a domain.
      type: object
      properties:
        type:
          description: 'The kind of allowlist entry.


            - `email` - The entry matches a single email address.

            - `domain` - The entry matches every email address under the given domain.'
          type: string
          example: email
          enum:
          - email
          - domain
        value:
          description: 'The value of the allowlist entry.


            - For `email` entries, the full email address (must contain `@`).

            - For `domain` entries, the bare domain (e.g. `example.com`).'
          type: string
          example: alice@example.com
        created_at:
          description: The date and time when the allowlist entry was added.
          type: string
          format: date-time
          example: '2026-05-19T12:00:00Z'
        created_by:
          allOf:
          - $ref: '#/components/schemas/User--Base'
          - description: User who added this entry.
      required:
      - type
      - value
      - created_at
      - created_by
      title: Shared link OTP allowlist entry
    Item:
      description: An item represents a file, folder, or web link.
      type: object
      oneOf:
      - $ref: '#/components/schemas/File--Full'
      - $ref: '#/components/schemas/Folder--Mini'
      - $ref: '#/components/schemas/WebLink'
      title: Item
    WebLink:
      description: 'Web links are objects that point to URLs. These objects are also known as bookmarks within the Box web application.


        Web link objects are treated similarly to file objects, they will also support most actions that apply to regular files.'
      type: object
      allOf:
      - $ref: '#/components/schemas/WebLink--Mini'
      - properties:
          parent:
            allOf:
            - $ref: '#/components/schemas/Folder--Mini'
            - description: The parent object the web link belongs to.
          description:
            description: The description accompanying the web link. This is visible within the Box web application.
            type: string
            example: Example page
          path_collection:
            allOf:
            - title: Path collection
              description: A list of parent folders for an item.
              type: object
              required:
              - total_count
              - entries
              properties:
                total_count:
                  description: The number of folders in this list.
                  type: integer
                  format: int64
                  example: 1
                entries:
                  description: The parent folders for this item.
                  type: array
                  items:
                    $ref: '#/components/schemas/Folder--Mini'
            - description: The tree of folders that this web link is contained in, starting at the root.
            - {}
          created_at:
            description: When this file was created on Box’s servers.
            type: string
            format: date-time
            example: '2012-12-12T10:53:43-08:00'
          modified_at:
            description: When this file was last updated on the Box servers.
            type: string
            format: date-time
            example: '2012-12-12T10:53:43-08:00'
          trashed_at:
            description: When this file was moved to the trash.
            type:
            - string
            - 'null'
            format: date-time
            example: '2012-12-12T10:53:43-08:00'
          purged_at:
            description: When this file will be permanently deleted.
            type:
            - string
            - 'null'
            format: date-time
            example: '2012-12-12T10:53:43-08:00'
          created_by:
            allOf:
            - $ref: '#/components/schemas/User--Mini'
            - description: The user who created this web link.
          modified_by:
            allOf:
            - $ref: '#/components/schemas/User--Mini'
            - description: The user who last modified this web link.
          owned_by:
            allOf:
            - $ref: '#/components/schemas/User--Mini'
            - description: The user who owns this web link.
          shared_link:
            allOf:
            - title: Shared link
              description: 'Shared links provide direct, read-only access to files or folder on Box.


                Shared links with open access level allow anyone with the URL to access the item, while shared links with company or collaborators access levels can only be accessed by appropriately authenticated Box users.'
              type: object
              required:
              - url
              - accessed
              - effective_access
              - effective_permission
              - is_password_enabled
              - download_count
              - preview_count
              - one_time_passcode
              properties:
                url:
                  description: 'The URL that can be used to access the item on Box.


                    This URL will display the item in Box''s preview UI where the file can be downloaded if allowed.


                    This URL will continue to work even when a custom `vanity_url` has been set for this shared link.'
                  type: string
                  format: url
                  example: https://www.box.com/s/vspke7y05sb214wjokpk
                download_url:
                  description: 'A URL that can be used to download the file. This URL can be used in a browser to download the file. This URL includes the file extension so that the file will be saved with the right file type.


                    This property will be `null` for folders.'
                  type:
                  - string
                  - 'null'
                  format: url
                  example: https://www.box.com/shared/static/rh935iit6ewrmw0unyul.jpeg
                  x-box-premium-feature: true
                vanity_url:
                  description: The "Custom URL" that can also be used to preview the item on Box. Custom URLs can only be created or modified in the Box Web application.
                  type:
                  - string
                  - 'null'
                  format: url
                  example: https://acme.app.box.com/v/my_url/
                vanity_name:
                  description: The custom name of a shared link, as used in the `vanity_url` field.
                  type:
                  - string
                  - 'null'
                  example: my_url
                access:
                  description: 'The access level for this shared link.


                    - `open` - provides access to this item to anyone with this link

                    - `company` - only provides access to this item to people the same company

                    - `collaborators` - only provides access to this item to people who are collaborators on this item


                    If this field is omitted when creating the shared link, the access level will be set to the default access level specified by the enterprise admin.'
                  type: string
                  example: open
                  enum:
                  - open
                  - company
                  - collaborators
                effective_access:
                  description: The effective access level for the shared link. This can be a more restrictive access level than the value in the `access` field when the enterprise settings restrict the allowed access levels.
                  type: string
                  example: company
                  enum:
                  - open
                  - company
                  - collaborators
                effective_permission:
                  description: The effective permissions for this shared link. These result in the more restrictive combination of the share link permissions and the item permissions set by the administrator, the owner, and any ancestor item such as a folder.
                  type: string
                  example: can_download
                  enum:
                  - can_edit
                  - can_download
                  - can_preview
                  - no_access
                unshared_at:
                  description: The date and time when this link will be unshared. This field can only be set by users with paid accounts.
                  type:
                  - string
                  - 'null'
                  format: date-time
                  example: '2018-04-13T13:53:23-07:00'
                is_password_enabled:
                  description: Defines if the shared link requires a password to access the item.
                  type: boolean
                  example: true
                permissions:
                  description: Defines if this link allows a user to preview, edit, and download an item. These permissions refer to the shared link only and do not supersede permissions applied to the item itself.
                  type: object
                  properties:
                    can_download:
                      description: 'Defines if the shared link allows for the item to be downloaded. For shared links on folders, this also applies to any items in the folder.


                        This value can be set to `true` when the effective access level is set to `open` or `company`, not `collaborators`.'
                      type: boolean
                      example: true
                    can_preview:
                      description: 'Defines if the shared link allows for the item to be previewed.


                        This value is always `true`. For shared links on folders this also applies to any items in the folder.'
                      type: boolean
                      example: true
                    can_edit:
                      description: 'Defines if the shared link allows for the item to be edited.


                        This value can only be `true` if `can_download` is also `true` and if the item has a type of `file`.'
                      type: boolean
                      example: false
                  required:
                  - can_download
                  - can_preview
                  - can_edit
                download_count:
                  description: The number of times this item has been downloaded.
                  type: integer
                  example: 3
                preview_count:
                  description: The number of times this item has been previewed.
                  type: integer
                  example: 3
                one_time_passcode:
                  allOf:
                  - title: Shared link OTP settings
                    description: 'One-time-passcode (OTP) settings for a shared link. When OTP enforcement is enabled, anonymous users must verify their identity via a one-time-passcode emailed to them before the shared link will grant access.


                      OTP can only be used with shared links that have an `access` level of `open`. Password protection and OTP cannot be enabled at the same time.'
                    type: object
                    required:
                    - mode
                    properties:
                      mode:
                        description: 'The current OTP enforcement mode for the shared link.


                          - `none` - OTP enforcement is turned off. The shared link is accessible without any one-time-passcode verification.

                          - `open` - Any anonymous recipient can request a one-time-passcode to any email address and access the shared link after verifying it. Collaborators and registered Box users access the link without being prompted.

                          - `allowlist` - Anonymous recipients can request a one-time-passcode only when they enter an email that matches an entry on the `allowlist`.'
                        type: string
                        example: allowlist
                      allowlist:
                        description: 'The list of email and domain entries that are permitted to access the shared link when `mode` is `allowlist`. Anonymous users whose email matches an entry can request and verify a one-time-passcode.


                          Because the entries carry recipient email addresses and the identity of the user who added them, this field is only returned to users with owner, co-owner, or editor access on the item. For viewer collaborators and below the field is omitted.


                          An allowlist contains at most 1000 entries, matching the limit enforced when setting the allowlist on a shared link.'
                        type: array
                        items:
                          $ref: '#/components/schemas/SharedLinkOtpAllowlistEntry'
                        example:
                        - type: email
                          value: alice@example.com
                          created_at: '2026-05-19T12:00:00Z'
                          created_by:
                            id: '11446498'
                            type: user
                        - type: domain
                          value: example.com
                          created_at: '2026-05-19T12:00:00Z'
                          created_by:
                            id: '11446498'
                            type: user
                        maxItems: 1000
                  - description: 'The one-time-passcode (OTP) settings for this shared link.


                      This field is always present. For links where OTP does not apply (for example, shared links whose `access` is not `open`), the object is returned with `mode` set to `none`.'
            - description: The shared link object for this item. Will be `null` if no shared link has been created.
          item_status:
            description: Whether this item is deleted or not. Values include `active`, `trashed` if the file has been moved to the trash, and `deleted` if the file has been permanently deleted.
            type: string
            example: active
            enum:
            - active
            - trashed
            - deleted
          collections:
            description: 'The collections that this web link belongs to.


              For more information, see the [collections guide](/guides/collections).'
            type: array
            items:
              $ref: '#/components/schemas/Collection'
          allowed_shared_link_access_levels:
            description: 'The shared link access levels the authenticated user is allowed to use when creating or updating a shared link for this web link.


              The list depends on item policy and user authorization, so it may be narrower than the levels available to the owner. An empty array means no access level is available to this user.'
            type: array
            items:
              title: Shared link access level
              type: string
              description: The access level for a shared link.
              example: open
              enum:
              - open
              - company
              - collaborators
            example:
            - open
      title: Web link
      x-box-resource-id: web_link
      x-box-tag: web_links
      x-box-variant: standard
    FileVersion--Base:
      description: The bare basic representation of a file version, the minimal amount of fields returned when using the `fields` query parameter.
      type: object
      properties:
        id:
          description: The unique identifier that represent a file version.
          type: string
          example: '12345'
        type:
          description: The value will always be `file_version`.
          type: string
          example: file_version
          enum:
          - file_version
      required:
      - id
      - type
      title: File version (Base)
      x-box-resource-id: file_version--base
      x-box-variant: base
      x-box-variants:
      - base
      - mini
      - standard
      - full
    Items:
      description: A list of files, folders, and web links in their mini representation.
      type: object
      allOf:
      - type: object
        description: The part of an API response that describes marker based pagination.
        properties:
          limit:
            description: The limit that was used for these entries. This will be the same as the `limit` query parameter unless that value exceeded the maximum value allowed. The maximum value varies by API.
            type: integer
            format: int64
            example: 1000
          next_marker:
            description: The marker for the start of the next page of results.
            type:
            - string
            - 'null'
            example: JV9IRGZmieiBasejOG9yDCRNgd2ymoZIbjsxbJMjIs3kioVii
          prev_marker:
            description: The marker for the start of the previous page of results.
            type:
            - string
            - 'null'
            example: JV9IRGZmieiBasejOG9yDCRNgd2ymoZIbjsxbJMjIs3kioVih
      - type: object
        description: The part of an API response that describes pagination.
        properties:
          total_count:
            description: 'One greater than the offset of the last entry in the entire collection. The total number of entries in the collection may be less than `total_count`.


              This field is only returned for calls that use offset-based pagination. For marker-based paginated APIs, this field will be omitted.'
            type: integer
            format: int64
            example: 5000
          limit:
            description: The limit that was used for these entries. This will be the same as the `limit` query parameter unless that value exceeded the maximum value allowed. The maximum value varies by API.
            type: integer
            format: int64
            example: 1000
          offset:
            description: 'The 0-based offset of the first entry in this set. This will be the same as the `offset` query parameter.


              This field is only returned for calls that use offset-based pagination. For marker-based paginated APIs, this field will be omitted.'
            type: integer
            format: int64
            example: 2000
          order:
            description: 'The order by which items are returned.


              This field is only returned for calls that use offset-based pagination. For marker-based paginated APIs, this field will be omitted.'
            type: array
            items:
              type: object
              description: The order in which a pagination is ordered.
              properties:
                by:
                  description: The field to order by.
                  type: string
                  example: type
                direction:
                  description: The direction to order by, either ascending or descending.
                  type: string
                  example: ASC
                  enum:
                  - ASC
                  - DESC
      - properties:
          entries:
            description: The items in this collection.
            type: array
            items:
              $ref: '#/components/schemas/Item'
      title: Items
      x-box-resource-id: items
      x-box-tag: folders
    Metadata--Full:
      description: An instance of a metadata template, which has been applied to a file or folder.
      type: object
      allOf:
      - $ref: '#/components/schemas/Metadata'
      - properties:
          $canEdit:
            description: Whether the user can edit this metadata instance.
            type: boolean
            example: true
          $id:
            description: A UUID to identify the metadata instance.
            type: string
            format: uuid
            example: 01234500-12f1-1234-aa12-b1d234cb567e
            maxLength: 36
          $type:
            description: A unique identifier for the "type" of this instance. This is an internal system property and should not be used by a client application.
            type: string
            example: properties-6bcba49f-ca6d-4d2a-a758-57fe6edf44d0
          $typeVersion:
            description: The last-known version of the template of the object. This is an internal system property and should not be used by a client application.
            type: integer
            example: 2
      - additionalProperties:
          allOf:
          - {}
          - example: Aaron Levie
          - description: A value for each of the fields that are present on the metadata template. For the `global.properties` template this can be a list of zero or more fields, as this template allows for any generic key-value pairs to be stored stored in the template.
          x-box-example-key: name
      title: Metadata instance (Full)
      x-box-resource-id: metadata--full
      x-box-tag: file_metadata
      x-box-variant: full
    Folder--Base:
      description: The bare basic representation of a folder, the minimal amount of fields returned when using the `fields` query parameter.
      type: object
      properties:
        id:
          description: 'The unique identifier that represent a folder.


            The ID for any folder can be determined by visiting a folder in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/folders/123` the `folder_id` is `123`.'
          type: string
          example: '12345'
        etag:
          description: The HTTP `etag` of this folder. This can be used within some API endpoints in the `If-Match` and `If-None-Match` headers to only perform changes on the folder if (no) changes have happened.
          type:
          - string
          - 'null'
          example: '1'
        type:
          description: The value will always be `folder`.
          type: string
          example: folder
          enum:
          - folder
      required:
      - id
      - type
      title: Folder (Base)
      x-box-resource-id: folder--base
      x-box-tag: folders
      x-box-variant: base
      x-box-variants:
      - base
      - mini
      - standard
      - full
    Metadata:
      description: An instance of a metadata template, which has been applied to a file or folder.
      type: object
      allOf:
      - $ref: '#/components/schemas/Metadata--Base'
      title: Metadata instance
      x-box-resource-id: metadata
      x-box-tag: file_metadata
      x-box-variant: standard
    File--Base:
      description: The bare basic representation of a file, the minimal amount of fields returned when using the `fields` query parameter.
      type:
      - object
      - 'null'
      properties:
        id:
          description: 'The unique identifier that represent a file.


            The ID for any file can be determined by visiting a file in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/files/123` the `file_id` is `123`.'
          type: string
          example: '12345'
        etag:
          description: The HTTP `etag` of this file. This can be used within some API endpoints in the `If-Match` and `If-None-Match` headers to only perform changes on the file if (no) changes have happened.
          type:
          - string
          - 'null'
          example: '1'
        type:
          description: The value will always be `file`.
          type: string
          example: file
          enum:
          - file
      required:
      - id
      - type
      title: File (Base)
      x-box-resource-id: file--base
      x-box-tag: files
      x-box-variant: base
      x-box-variants:
      - base
      - mini
      - standard
      - full
    Folder--Mini:
      description: A mini representation of a file version, used when nested under another resource.
      type: object
      allOf:
      - $ref: '#/components/schemas/Folder--Base'
      - properties:
          sequence_id:
            allOf:
            - type:
              - string
              - 'null'
              example: '3'
              description: 'A numeric identifier that represents the most recent user event that has been applied to this item.


                This can be used in combination with the `GET /events`-endpoint to filter out user events that would have occurred before this identifier was read.


                An example would be where a Box Drive-like application would fetch an item via the API, and then listen to incoming user events for changes to the item. The application would ignore any user events where the `sequence_id` in the event is smaller than or equal to the `sequence_id` in the originally fetched resource.'
            - {}
          name:
            description: The name of the folder.
            type: string
            example: Contracts
      title: Folder (Mini)
      x-box-resource-id: folder--mini
      x-box-tag: folders
      x-box-variant: mini
    User--Mini:
      description: A mini representation of a user, as can be returned when nested within other resources.
      type: object
      allOf:
      - $ref: '#/components/schemas/User--Base'
      - properties:
          name:
            description: The display name of this user.
            type: string
            example: Aaron Levie
            maxLength: 50
          login:
            description: The primary email address of this user.
            type: string
            format: email
            example: ceo@example.com
      title: User (Mini)
      x-box-resource-id: user--mini
      x-box-tag: users
      x-box-variant: mini
    Collection:
      description: 'A collection of items, including files and folders.


        Currently, the only collection available is the `favorites` collection.


        The contents of a collection can be explored in a similar way to which the contents of a folder is explored.'
      type: object
      properties:
        id:
          description: The unique identifier for this collection.
          type: string
          example: '11446498'
        type:
          description: The value will always be `collection`.
          type: string
          example: collection
          enum:
          - collection
        name:
          description: The name of the collection.
          type: string
          example: Favorites
          enum:
          - Favorites
        collection_type:
          description: The type of the collection. This is used to determine the proper visual treatment for collections.
          type: string
          example: favorites
          enum:
          - favorites
      title: Collection
      x-box-resource-id: collection
      x-box-tag: collections
    WebLink--Mini:
      description: 'Web links are objects that point to URLs. These objects are also known as bookmarks within the Box web application.


        Web link objects are treated similarly to file objects, they will also support most actions that apply to regular files.'
      type: object
      allOf:
      - $ref: '#/components/schemas/WebLink--Base'
      - properties:
          url:
            description: The URL this web link points to.
            type: string
            example: https://www.example.com/example/1234
          sequence_id:
            allOf:
            - type:
              - string
              - 'null'
              example: '3'
              description: 'A numeric identifier that represents the most recent user event that has been applied to this item.


                This can be used in combination with the `GET /events`-endpoint to filter out user events that would have occurred before this identifier was read.


                An example would be where a Box Drive-like application would fetch an item via the API, and then listen to incoming user events for changes to the item. The application would ignore any user events where the `sequence_id` in the event is smaller than or equal to the `sequence_id` in the originally fetched resource.'
            - {}
          name:
            description: The name of the web link.
            type: string
            example: My Bookmark
      title: Web link (Mini)
      x-box-resource-id: web_link--mini
      x-box-tag: web_links
      x-box-variant: mini
    File:
      description: A standard representation of a file, as returned from any file API endpoints by default.
      type: object
      allOf:
      - $ref: '#/components/schemas/File--Mini'
      - properties:
          description:
            description: The optional description of this file. If the description exceeds 255 characters, the first 255 characters are set as a file description and the rest of it is ignored.
            type: string
            example: Contract for Q1 renewal
            maxLength: 255
          size:
            description: The file size in bytes. Be careful parsing this integer as it can get very large and cause an integer overflow.
            type: integer
            example: 629644
          path_collection:
            allOf:
            - title: Path collection
              description: A list of parent folders for an item.
              type: object
              required:
              - total_count
              - entries
              properties:
                total_count:
                  description: The number of folders in this list.
                  type: integer
                  format: int64
                  example: 1
                entries:
                  description: The parent folders for this item.
                  type: array
                  items:
                    $ref: '#/components/schemas/Folder--Mini'
            - description: The tree of folders that this file is contained in, starting at the root.
            - {}
          created_at:
            description: The date and time when the file was created on Box.
            type: string
            format: date-time
            example: '2012-12-12T10:53:43-08:00'
          modified_at:
            description: The date and time when the file was last updated on Box.
            type: string
            format: date-time
            example: '2012-12-12T10:53:43-08:00'
          trashed_at:
            description: The time at which this file was put in the trash.
            type:
            - string
            - 'null'
            format: date-time
            example: '2012-12-12T10:53:43-08:00'
          purged_at:
            description: The time at which this file is expected to be purged from the trash.
            type:
            - string
            - 'null'
            format: date-time
            example: '2012-12-12T10:53:43-08:00'
          content_created_at:
            description: The date and time at which this file was originally created, which might be before it was uploaded to Box.
            type:
            - string
            - 'null'
            format: date-time
            example: '2012-12-12T10:53:43-08:00'
          content_modified_at:
            description: The date and time at which this file was last updated, which might be before it was uploaded to Box.
            type:
            - string
            - 'null'
            format: date-time
            example: '2012-12-12T10:53:43-08:00'
          created_by:
            allOf:
            - $ref: '#/components/schemas/User--Mini'
            - description: The user who created this file.
          modified_by:
            allOf:
            - $ref: '#/components/schemas/User--Mini'
            - description: The user who last modified this file.
            - {}
          owned_by:
            allOf:
            - $ref: '#/components/schemas/User--Mini'
            - description: The user who owns this file.
            - {}
          shared_link:
            allOf:
            - title: Shared link
              description: 'Shared links provide direct, read-only access to files or folder on Box.


                Shared links with open access level allow anyone with the URL to access the item, while shared links with company or collaborators access levels can only be accessed by appropriately authenticated Box users.'
              type: object
              required:
              - url
              - accessed
              - effective_access
              - effective_permission
              - is_password_enabled
              - download_count
              - preview_count
              - one_time_passcode
              properties:
                url:
                  description: 'The URL that can be used to access the item on Box.


                    This URL will display the item in Box''s preview UI where the file can be downloaded if allowed.


                    This URL will continue to work even when a custom `vanity_url` has been set for this shared link.'
                  type: string
                  format: url
                  example: https://www.box.com/s/vspke7y05sb214wjokpk
                download_url:
                  description: 'A URL that can be used to download the file. This URL can be used in a browser to download the file. This URL includes the file extension so that the file will be saved with the right file type.


                    This property will be `null` for folders.'
                  type:
                  - string
                  - 'null'
                  format: url
                  example: https://www.box.com/shared/static/rh935iit6ewrmw0unyul.jpeg
                  x-box-premium-feature: true
                vanity_url:
                  description: The "Custom URL" that can also be used to preview the item on Box. Custom URLs can only be created or modified in the Box Web application.
                  type:
                  - string
                  - 'null'
                  format: url
                  example: https://acme.app.box.com/v/my_url/
                vanity_name:
                  description: The custom name of a shared link, as used in the `vanity_url` field.
                  type:
                  - string
                  - 'null'
                  example: my_url
                access:
                  description: 'The access level for this shared link.


                    - `open` - provides access to this item to anyone with this link

                    - `company` - only provides access to this item to people the same company

                    - `collaborators` - only provides access to this item to people who are collaborators on this item


                    If this field is omitted when creating the shared link, the access level will be set to the default access level specified by the enterprise admin.'
                  type: string
                  example: open
                  enum:
                  - open
                  - company
                  - collaborators
                effective_access:
                  description: The effective access level for the shared link. This can be a more restrictive access level than the value in the `access` field when the enterprise settings restrict the allowed access levels.
                  type: string
                  example: company
                  enum:
                  - open
                  - company
                  - collaborators
                effective_permission:
                  description: The effective permissions for this shared link. These result in the more restrictive combination of the share link permissions and the item permissions set by the administrator, the owner, and any ancestor item such as a folder.
                  type: string
                  example: can_download
                  enum:
                  - can_edit
                  - can_download
                  - can_preview
                  - no_access
                unshared_at:
                  description: The date and time when this link will be unshared. This field can only be set by users with paid accounts.
                  type:
                  - string
                  - 'null'
                  format: date-time
                  example: '2018-04-13T13:53:23-07:00'
                is_password_enabled:
                  description: Defines if the shared link requires a password to access the item.
                  type: boolean
                  example: true
                permissions:
                  description: Defines if this link allows a user to preview, edit, and download an item. These permissions refer to the shared link only and do not supersede permissions applied to the item itself.
                  type: object
                  properties:
                    can_download:
                      description: 'Defines if the shared link allows for the item to be downloaded. For shared links on folders, this also applies to any items in the folder.


                        This value can be set to `true` when the effective access level is set to `open` or `company`, not `collaborators`.'
                      type: boolean
                      example: true
                    can_preview:
                      description: 'Defines if the shared link allows for the item to be previewed.


                        This value is always `true`. For shared links on folders this also applies to any items in the folder.'
                      type: boolean
                      example: true
                    can_edit:
                      description: 'Defines if the shared link allows for the item to be edited.


                        This value can only be `true` if `can_download` is also `true` and if the item has a type of `file`.'
                      type: boolean
                      example: false
                  required:
                  - can_download
                  - can_preview
                  - can_edit
                download_count:
                  description: The number of times this item has been downloaded.
                  type: integer
                  example: 3
                preview_count:
                  description: The number of times this item has been previewed.
                  type: integer
                  example: 3
                one_time_passcode:
                  allOf:
                  - title: Shared link OTP settings
                    description: 'One-time-passcode (OTP) settings for a shared link. When OTP enforcement is enabled, anonymous users must verify their identity via a one-time-passcode emailed to them before the shared link will grant access.


                      OTP can only be used with shared links that have an `access` level of `open`. Password protection and OTP cannot be enabled at the same time.'
                    type: object
                    required:
                    - mode
                    properties:
                      mode:
                        description: 'The current OTP enforcement mode for the shared link.


                          - `none` - OTP enforcement is turned off. The shared link is accessible without any one-time-passcode verification.

                          - `open` - Any anonymous recipient can request a one-time-passcode to any email address and access the shared link after verifying it. Collaborators and registered Box users access the link without being prompted.

                          - `allowlist` - Anonymous recipients can request a one-time-passcode only when they enter an email that matches an entry on the `allowlist`.'
                        type: string
                        example: allowlist
                      allowlist:
                        description: 'The list of email and domain entries that are permitted to access the shared link when `mode` is `allowlist`. Anonymous users whose email matches an entry can request and verify a one-time-passcode.


                          Because the entries carry recipient email addresses and the identity of the user who added them, this field is only returned to users with owner, co-owner, or editor access on the item. For viewer collaborators and below the field is omitted.


                          An allowlist contains at most 1000 entries, matching the limit enforced when setting the allowlist on a shared link.'
                        type: array
                        items:
                          $ref: '#/components/schemas/SharedLinkOtpAllowlistEntry'
                        example:
                        - type: email
                          value: alice@example.com
                          created_at: '2026-05-19T12:00:00Z'
                          created_by:
                            id: '11446498'
                            type: user
                        - type: domain
                          value: example.com
                          created_at: '2026-05-19T12:00:00Z'
                          created_by:
                            id: '11446498'
                            type: user
                        maxItems: 1000
                  - description: 'The one-time-passcode (OTP) settings for this shared link.


                      This field is always present. For links where OTP does not apply (for example, shared links whose `access` is not `open`), the object is returned with `mode` set to `none`.'
            - description: The shared link for this file. This value will be `null` if no shared link has been created for this file.
          parent:
            allOf:
            - $ref: '#/components/schemas/Folder--Mini'
            - description: The folder that this file is located within. This value may be `null` for some folders such as the root folder or the trash folder.
          item_status:
            description: 'Defines if this item has been deleted or not.


              - `active` when the item has is not in the trash

              - `trashed` when the item has been moved to the trash but not deleted

              - `deleted` when the item has been permanently deleted.'
            type: string
            example: active
            enum:
            - active
            - trashed
            - deleted
      title: File
      x-box-resource-id: file
      x-box-tag: files
      x-box-variant: standard
    File--Full:
      description: A full representation of a file, as can be returned from any file API endpoints by default.
      type: object
      allOf:
      - $ref: '#/components/schemas/File'
      - properties:
          version_number:
            description: The version number of this file.
            type: string
            example: '1'
          comment_count:
            description: The number of comments on this file.
            type: integer
            example: 10
          permissions:
            allOf:
            - type: object
              description: The permissions that the authenticated user has for a file.
              required:
              - can_annotate
              - can_comment
              - can_preview
              - can_upload
              - can_view_annotations_all
              - can_view_annotations_self
              allOf:
              - type: object
                description: The permissions that the authenticated user has for an item.
                required:
                - can_delete
                - can_download
                - can_invite_collaborator
                - can_rename
                - can_set_share_access
                - can_share
                properties:
                  can_delete:
                    description: Specifies if the current user can delete this item.
                    type: boolean
                    example: true
                  can_download:
                    description: Specifies if the current user can download this item.
                    type: boolean
                    example: true
                  can_invite_collaborator:
                    description: Specifies if the current user can invite new users to collaborate on this item, and if the user can update the role of a user already collaborated on this item.
                    type: boolean
                    example: true
                  can_rename:
                    description: Specifies if the user can rename this item.
                    type: boolean
                    example: true
                  can_set_share_access:
                    description: Specifies if the user can change the access level of an existing shared link on this item.
                    type: boolean
                    example: true
                  can_share:
                    description: Specifies if the user can create a shared link for this item.
                    type: boolean
                    example: true
              - properties:
                  can_annotate:
                    description: Specifies if the user can place annotations on this file.
                    type: boolean
                    example: true
                  can_comment:
                    description: Specifies if the user can place comments on this file.
                    type: boolean
                    example: true
                  can_preview:
                    description: Specifies if the user can preview this file.
                    type: boolean
                    example: true
                  can_upload:
                    description: Specifies if the user can upload a new version of this file.
                    type: boolean
                    example: true
                  can_view_annotations_all:
                    description: Specifies if the user view all annotations placed on this file.
                    type: boolean
                    example: true
                  can_view_annotations_self:
                    description: Specifies if the user view annotations placed by themselves on this file.
                    type: boolean
                    example: true
                  can_apply_watermark:
                    description: Specifies if the user can apply a watermark to this file.
                    type: boolean
                    example: true
            - description: Describes the permissions that the current user has for this file.
            - {}
          tags:
            allOf:
            - type: array
              example:
              - approved
              items:
                type: string
              minItems: 1
              maxItems: 100
              description: 'The tags for this item. These tags are shown in the Box web app and mobile apps next to an item.


                To add or remove a tag, retrieve the item''s current tags, modify them, and then update this field.


                There is a limit of 100 tags per item, and 10,000 unique tags per enterprise.'
            - {}
          lock:
            allOf:
            - title: Lock
              type: object
              description: The lock held on a file. A lock prevents a file from being moved, renamed, or otherwise changed by anyone else than the user who created the lock.
              properties:
                id:
                  description: The unique identifier for this lock.
                  type: string
                  example: '11446498'
                type:
                  description: The value will always be `lock`.
                  type: string
                  example: lock
                  enum:
                  - lock
                created_by:
                  allOf:
                  - $ref: '#/components/schemas/User--Mini'
                  - description: The user who created the lock.
                created_at:
                  description: The time this lock was created at.
                  type: string
                  format: date-time
                  example: '2012-12-12T10:53:43-08:00'
                expired_at:
                  description: The time this lock is to expire at, which might be in the past.
                  type: string
                  format: date-time
                  example: '2012-12-12T10:53:43-08:00'
                is_download_prevented:
                  description: Whether or not the file can be downloaded while locked.
                  type: boolean
                  example: true
                app_type:
                  description: If the lock is managed by an application rather than a user, this field identifies the type of the application that holds the lock. This is an open enum and may be extended with additional values in the future.
                  type:
                  - string
                  - 'null'
                  example: office_wopiplus
                  enum:
                  - gsuite
                  - office_wopi
                  - office_wopiplus
                  - other
            - description: The lock held on this file. If there is no lock, this can either be `null` or have a timestamp in the past.
          extension:
            description: Indicates the (optional) file extension for this file. By default, this is set to an empty string.
            type: string
            example: pdf
          is_package:
            description: Indicates if the file is a package. Packages are commonly used by Mac Applications and can include iWork files.
            type: boolean
            example: true
          expiring_embed_link:
            allOf:
            - title: Expiring embed link
              type: object
              description: An expiring Box Embed Link.
              allOf:
              - type: object
                description: The basics of an access token.
                properties:
                  access_token:
                    description: The requested access token.
                    type: string
                    format: token
                    example: c3FIOG9vSGV4VHo4QzAyg5T1JvNnJoZ3ExaVNyQWw6WjRsanRKZG5lQk9qUE1BVQ
                  expires_in:
                    description: The time in seconds by which this token will expire.
                    type: integer
                    format: int64
                    example: 3600
                  token_type:
                    description: The type of access token returned.
                    type: string
                    example: bearer
                    enum:
                    - bearer
                  restricted_to:
                    description: The permissions that this access token permits, providing a list of resources (files, folders, etc) and the scopes permitted for each of those resources.
                    type: array
                    items:
                      $ref: '#/components/schemas/ResourceScope'
              - properties:
                  url:
                    description: The actual expiring embed URL for this file, constructed from the file ID and access tokens specified in this object.
                    type: string
                    format: url
                    example: https://cloud.app.box.com/preview/expiring_embed/...
            - description: 'Requesting this field creates an expiring Box Embed URL for an embedded preview session in an `iframe`.


                This URL will expire after 60 seconds and the session will expire after 60 minutes.


                Not all file types are supported for these embed URLs. Box Embed is not optimized for mobile browsers and should not be used in web experiences designed for mobile devices. Many UI elements, like the **download** and **print** options might not show in mobile browsers.'
          watermark_info:
            allOf:
            - type: object
              description: Details about the watermark applied to this item.
              properties:
                is_watermarked:
                  description: Specifies if this item has a watermark applied.
                  type: boolean
                  example: true
                is_watermark_inherited:
                  description: Specifies if the watermark is inherited from any parent folder in the hierarchy.
                  type: boolean
                  example: false
                is_watermarked_by_access_policy:
                  description: Specifies if the watermark is enforced by an access policy.
                  type: boolean
                  example: false
            - description: Details about the watermark applied to this file.
          is_accessible_via_shared_link:
            description: Specifies if the file can be accessed via the direct shared link or a shared link to a parent folder.
            type: boolean
            example: true
          allowed_invitee_roles:
            description: A list of the types of roles that user can be invited at when sharing this file.
            type: array
            items:
              type: string
              enum:
              - editor
              - viewer
              - previewer
              - uploader
              - previewer uploader
              - viewer uploader
              - co-owner
            example:
            - editor
          is_externally_owned:
            description: Specifies if this file is owned by a user outside of the authenticated enterprise.
            type: boolean
            example: true
          has_collaborations:
            description: Specifies if this file has any other collaborators.
            type: boolean
            example: true
          metadata:
            allOf:
            - title: Item metadata instances
              type: object
              description: 'A list of metadata instances, nested within key-value pairs of their `scope` and `templateKey`.


                To access the metadata for a file or folder, first use the metadata endpoints to determine the metadata templates available to your enterprise.


                Then use the `GET /files/:id` or `GET /folder/:id` endpoint with the `fields` query parameter to get the metadata by ID.


                To request a metadata instance for a particular `scope` and `templateKey` use the following format for the `fields` parameter: `metadata.<scope>.<templateKey>`


                For example, `?fields=metadata.enterprise_27335.marketingCollateral`.'
              example:
                enterprise_27335:
                  marketingCollateral:
                    $canEdit: true
                    $id: 01234500-12f1-1234-aa12-b1d234cb567e
                    $parent: folder_59449484661
                    $scope: enterprise_27335
                    $template: marketingCollateral
                    $type: properties-6bcba49f-ca6d-4d2a-a758-57fe6edf44d0
                    $typeVersion: 2
                    $version: 1
              additionalProperties:
                type: object
                description: A list of metadata instances, nested within key-value pairs of their `scope` and `templateKey`.
                example:
                  marketingCollateral:
                    $canEdit: true
                    $id: 01234500-12f1-1234-aa12-b1d234cb567e
                    $parent: folder_59449484661
                    $scope: enterprise_27335
                    $template: marketingCollateral
                    $type: properties-6bcba49f-ca6d-4d2a-a758-57fe6edf44d0
                    $typeVersion: 2
                    $version: 1
                additionalProperties:
                  $ref: '#/components/schemas/Metadata--Full'
            - description: 'An object containing the metadata instances that have been attached to this file.


                Each metadata instance is uniquely identified by its `scope` and `templateKey`. There can only be one instance of any metadata template attached to each file. Each metadata instance is nested within an object with the `templateKey` as the key, which again itself is nested in an object with the `scope` as the key.'
          expires_at:
            description: When the file will automatically be deleted.
            type:
            - string
            - 'null'
            format: date-time
            example: '2012-12-12T10:53:43-08:00'
          representations:
            allOf:
            - title: Representations
              description: A list of file representations.
              type: object
              properties:
                entries:
                  description: A list of files.
                  type: array
                  items:
                    type: object
                    description: A file representation.
                    properties:
                      content:
                        description: An object containing the URL that can be used to actually fetch the representation.
                        properties:
                          url_template:
                            description: 'The download URL that can be used to fetch the representation. Make sure to make an authenticated API call to this endpoint.


                              This URL is a template and will require the `{+asset_path}` to be replaced by a path. In general, for unpaged representations it can be replaced by an empty string.


                              For paged representations, replace the `{+asset_path}` with the page to request plus the extension for the file, for example `1.pdf`.


                              When requesting the download URL the following additional query params can be passed along.


                              - `set_content_disposition_type` - Sets the `Content-Disposition` header in the API response with the specified disposition type of either `inline` or `attachment`. If not supplied, the `Content-Disposition` header is not included in the response.


                              - `set_content_disposition_filename` - Allows the application to define the representation''s file name used in the `Content-Disposition` header. If not defined, the filename is derived from the source file name in Box combined with the extension of the representation.'
                            type: string
                            example: https://dl.boxcloud.com/api/2.0/internal_files/123/versions/345/representations/png_paged_2048x2048/content/{+asset_path}?watermark_content=4567
                        type: object
                      info:
                        description: An object containing the URL that can be used to fetch more info on this representation.
                        type: object
                        properties:
                          url:
                            description: The API URL that can be used to get more info on this file representation. Make sure to make an authenticated API call to this endpoint.
                            type: string
                            example: https://api.box.com/2.0/internal_files/123/versions/345/representations/png_paged_2048x2048
                      properties:
                        description: An object containing the size and type of this presentation.
                        type: object
                        properties:
                          dimensions:
                            type: string
                            format: <width>x<height>
                            example: 2048x2048
                            description: The width by height size of this representation in pixels.
                          paged:
                            type: string
                            example: 'true'
                            description: Indicates if the representation is build up out of multiple pages.
                          thumb:
                            type: string
                            example: 'true'
                            description: Indicates if the representation can be used as a thumbnail of the file.
                      representation:
                        description: Indicates the file type of the returned representation.
                        type: string
                        example: png
                      status:
                        description: An object containing the status of this representation.
                        type: object
                        properties:
                          state:
                            description: 'The status of the representation.


                              - `success` defines the representation as ready to be viewed.

                              - `viewable` defines a video to be ready for viewing.

                              - `pending` defines the representation as to be generated. Retry this endpoint to re-check the status.

                              - `none` defines that the representation will be created when requested. Request the URL defined in the `info` object to trigger this generation.'
                            type: string
                            example: success
                            enum:
                            - success
                            - viewable
                            - pending
                            - none
            - description: A list of representations for a file that can be used to display a placeholder of the file in your application. By default this returns all representations and we recommend using the `x-rep-hints` header to further customize the desired representations.
          classification:
            allOf:
            - type: object
              description: The classification applied to an item.
              properties:
                name:
                  description: The name of the classification.
                  type: string
                  example: Top Secret
                definition:
                  description: An explanation of the meaning of this classification.
                  type: string
                  example: Content that should not be shared outside the company.
                color:
                  description: The color that is used to display the classification label in a user-interface. Colors are defined by the admin or co-admin who created the classification in the Box web app.
                  type: string
                  example: '#FF0000'
            - description: Details about the classification applied to this file.
          uploader_display_name:
            allOf:
            - title: Uploader display name
              type: string
              example: Ellis Wiggins
              description: 'The display name of the user that uploaded the file. In most cases this is the name of the user logged in at the time of the upload.


                If the file was uploaded using a File Request form that requires the user to provide an email address, this field is populated with that email address. If an email address was not required in the File Request form, this field is set to return a value of `File Request`.


                In all other anonymous cases where no email was provided this field will default to a value of `Someone`.'
          disposition_at:
            description: The retention expiration timestamp for the given file.
            type:
            - string
            - 'null'
            format: date-time
            example: '2012-12-12T10:53:43-08:00'
          shared_link_permission_options:
            description: A list of the types of roles that user can be invited at when sharing this file.
            type:
            - array
            - 'null'
            items:
              type: string
              enum:
              - can_preview
              - can_download
              - can_edit
            example:
            - can_preview
          is_associated_with_app_item:
            description: This field will return true if the file or any ancestor of the file is associated with at least one app item. Note that this will return true even if the context user does not have access to the app item(s) associated with the file.
            type: boolean
            example: true
          collections:
            description: 'The collections that this file belongs to.


              For more information, see the [collections guide](/guides/collections).'
            type: array
            items:
              $ref: '#/components/schemas/Collection'
          is_download_available:
            description: 'Whether the file''s binary content is eligible to be downloaded.


              This is a content-level flag and does not reflect whether the current user is authorized to download the file. Use `permissions.can_download`, when available, for that.'
            type: boolean
            example: true
          download_url:
            description: 'A pre-authorized, expiring URL for directly downloading the file''s content. Requires authentication and is valid only for the current session.


              This field is only returned for files, not folders or web links.'
            type: string
            format: url
            example: https://dl.boxcloud.com/d/1/example_token/download
          authenticated_download_url:
            description: 'A stable API URL for the file content endpoint, `/2.0/files/{id}/content`. Unlike `download_url`, authorization is evaluated when the URL is requested with a valid access token.


              This field is only returned for files, not folders or web links.'
            type: string
            format: url
            example: https://api.box.com/2.0/files/12345/content
          allowed_shared_link_access_levels:
            description: 'The shared link access levels the authenticated user is allowed to use when creating or updating a shared link for this file.


              The list depends on item policy and user authorization, so it may be narrower than the levels available to the owner. An empty array means no access level is available to this user.'
            type: array
            items:
              title: Shared link access level
              type: string
              description: The access level for a shared link.
              example: open
              enum:
              - open
              - company
              - collaborators
            example:
            - open
      title: File (Full)
      x-box-resource-id: file--full
      x-box-tag: files
      x-box-variant: full
  securitySchemes:
    OAuth2Security:
      type: oauth2
      description: The access token received from the authorization server in the OAuth 2.0 flow.
      flows:
        authorizationCode:
          authorizationUrl: https://account.box.com/api/oauth2/authorize
          tokenUrl: https://api.box.com/oauth2/token
          scopes:
            root_readonly: Read all files and folders stored in Box
            root_readwrite: Read and write all files and folders stored in Box
            manage_app_users: Provision and manage app users
            manage_managed_users: Provision and manage managed users
            manage_groups: Manage an enterprise's groups
            manage_webhook: Create webhooks programmatically through the API
            manage_enterprise_properties: Manage enterprise properties
            manage_data_retention: Manage data retention polices
            manage_legal_hold: Manage Legal Holds
externalDocs:
  description: Box Developer Documentation.
  url: https://developer.box.com
