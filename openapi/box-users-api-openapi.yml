          timezone:
            description: The user's timezone.
            type: string
            format: timezone
            example: Africa/Bujumbura
          space_amount:
            description: The user’s total available space amount in bytes.
            type: integer
            format: int64
            example: 11345156112
          space_used:
            description: The amount of space in use by the user.
            type: integer
            format: int64
            example: 1237009912
          max_upload_size:
            description: The maximum individual file size in bytes the user can have.
            type: integer
            format: int64
            example: 2147483648
          status:
            description: The user's account status.
            type: string
