openapi: 3.2.0
info:
  title: Box Platform Users API
  description: Box Platform provides functionality to provide access to content stored within Box. It provides endpoints for basic manipulation of files and folders, management of users within an enterprise, as well as more complex topics such as legal holds and retention policies.
  termsOfService: https://cloud.app.box.com/s/rmwxu64h1ipr41u49w3bbuvbsa29wku9
  contact:
    name: Box, Inc
    url: https://developer.box.com
    email: devrel@box.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '2024.0'
  x-box-commit-hash: 53bdced3cd
servers:
- url: https://api.box.com/2.0
  description: Box Platform API server.
security:
- OAuth2Security: []
tags:
- name: Users
  description: Box API supports a variety of users, ranging from real employees logging in with their Managed User account, to applications using App Users to drive powerful automation workflows.
  x-box-tag: users
paths:
  /users:
    get:
      operationId: get_users
      summary: List enterprise users
      description: 'Returns a list of all users for the Enterprise along with their `user_id`, `public_name`, and `login`.


        The application and the authenticated user need to have the permission to look up users in the entire enterprise.'
      parameters:
      - name: filter_term
        in: query
        description: 'Limits the results to only users who''s `name` or `login` start with the search term.


          For externally managed users, the search term needs to completely match the in order to find the user, and it will only return one user at a time.'
        required: false
        schema:
          type: string
        example: john
      - name: user_type
        in: query
        description: 'Limits the results to the kind of user specified.


          - `all` returns every kind of user for whom the `login` or `name` partially matches the `filter_term`. It will only return an external user if the login matches the `filter_term` completely, and in that case it will only return that user.

          - `managed` returns all managed and app users for whom the `login` or `name` partially matches the `filter_term`.

          - `external` returns all external users for whom the `login` matches the `filter_term` exactly.'
        required: false
        schema:
          type: string
          enum:
          - all
          - managed
          - external
        example: managed
      - name: external_app_user_id
        in: query
        description: 'Limits the results to app users with the given `external_app_user_id` value.


          When creating an app user, an `external_app_user_id` value can be set. This value can then be used in this endpoint to find any users that match that `external_app_user_id` value.'
        required: false
        schema:
          type: string
        example: my-user-1234
      - name: fields
        in: query
        description: 'A comma-separated list of attributes to include in the response. This can be used to request fields that are not normally returned in a standard response.


          Be aware that specifying this parameter will have the effect that none of the standard fields are returned in the response unless explicitly specified, instead only fields for the mini representation are returned, additional to the fields requested.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - id
        - type
        - name
        explode: false
      - name: offset
        in: query
        description: 'The offset of the item at which to begin the response.


          Queries with offset parameter value exceeding 10000 will be rejected with a 400 response.'
        required: false
        schema:
          type: integer
          format: int64
          default: 0
        example: 1000
      - name: limit
        in: query
        description: The maximum number of items to return per page.
        required: false
        schema:
          type: integer
          format: int64
          maximum: 1000
        example: 1000
      - name: usemarker
        in: query
        description: 'Specifies whether to use marker-based pagination instead of offset-based pagination. Only one pagination method can be used at a time.


          By setting this value to true, the API will return a `marker` field that can be passed as a parameter to this endpoint to get the next page of the response.'
        required: false
        schema:
          type: boolean
        example: true
      - name: marker
        in: query
        description: 'Defines the position marker at which to begin returning results. This is used when paginating using marker-based pagination.


          This requires `usemarker` to be set to `true`.'
        required: false
        schema:
          type: string
        example: JV9IRGZmieiBasejOG9yDCRNgd2ymoZIbjsxbJMjIs3kioVii
      responses:
        '200':
          description: Returns all of the users in the enterprise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Users'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: users
      tags:
      - Users
      x-codeSamples:
      - lang: curl
        label: List enterprise users
        source: "curl -i -X GET \"https://api.box.com/2.0/users\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\""
      - lang: dotnet
        label: List enterprise users
        source: await client.Users.GetUsersAsync();
      - lang: swift
        label: List enterprise users
        source: try await client.users.getUsers()
      - lang: java
        label: List enterprise users
        source: client.getUsers().getUsers()
      - lang: node
        label: List enterprise users
        source: await client.users.getUsers();
      - lang: python
        label: List enterprise users
        source: client.users.get_users()
    post:
      operationId: post_users
      summary: Create user
      description: Creates a new managed user in an enterprise. This endpoint is only available to users and applications with the right admin permissions.
      parameters:
      - name: fields
        in: query
        description: 'A comma-separated list of attributes to include in the response. This can be used to request fields that are not normally returned in a standard response.


          Be aware that specifying this parameter will have the effect that none of the standard fields are returned in the response unless explicitly specified, instead only fields for the mini representation are returned, additional to the fields requested.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - id
        - type
        - name
        explode: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: The name of the user.
                  type: string
                  example: Aaron Levie
                  maxLength: 50
                login:
                  description: 'The email address the user uses to log in


                    Required, unless `is_platform_access_only` is set to `true`.'
                  type: string
                  example: boss@box.com
                is_platform_access_only:
                  description: Specifies that the user is an app user.
                  type: boolean
                  example: true
                role:
                  description: The user’s enterprise role.
                  type: string
                  example: user
                  enum:
                  - coadmin
                  - user
                language:
                  description: The language of the user, formatted in modified version of the [ISO 639-1](/guides/api-calls/language-codes) format.
                  type: string
                  example: en
                is_sync_enabled:
                  description: Whether the user can use Box Sync.
                  type: boolean
                  example: true
                job_title:
                  description: The user’s job title.
                  type: string
                  example: CEO
                  maxLength: 100
                phone:
                  description: The user’s phone number.
                  type: string
                  example: '6509241374'
                  maxLength: 100
                address:
                  description: The user’s address.
                  type: string
                  example: 900 Jefferson Ave, Redwood City, CA 94063
                  maxLength: 255
                space_amount:
                  description: The user’s total available space in bytes. Set this to `-1` to indicate unlimited storage.
                  type: integer
                  format: int64
                  example: 11345156112
                tracking_codes:
                  description: Tracking codes allow an admin to generate reports from the admin console and assign an attribute to a specific group of users. This setting must be enabled for an enterprise before it can be used.
                  type: array
                  items:
                    $ref: '#/components/schemas/TrackingCode'
                can_see_managed_users:
                  description: Whether the user can see other enterprise users in their contact list.
                  type: boolean
                  example: true
                timezone:
                  description: The user's timezone.
                  type: string
                  format: timezone
                  example: Africa/Bujumbura
                is_external_collab_restricted:
                  description: Whether the user is allowed to collaborate with users outside their enterprise.
                  type: boolean
                  example: true
                is_exempt_from_device_limits:
                  description: Whether to exempt the user from enterprise device limits.
                  type: boolean
                  example: true
                is_exempt_from_login_verification:
                  description: Whether the user must use two-factor authentication.
                  type: boolean
                  example: true
                status:
                  description: The user's account status.
                  type: string
                  example: active
                  enum:
                  - active
                  - inactive
                  - cannot_delete_edit
                  - cannot_delete_edit_upload
                external_app_user_id:
                  description: An external identifier for an app user, which can be used to look up the user. This can be used to tie user IDs from external identity providers to Box users.
                  type: string
                  example: my-user-1234
              required:
              - name
      responses:
        '201':
          description: Returns a user object for the newly created user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User--Full'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: users
      tags:
      - Users
      x-codeSamples:
      - lang: curl
        label: Create user
        source: "curl -i -X POST \"https://api.box.com/2.0/users\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\" \\\n     -H \"content-type: application/json\" \\\n     -d '{\n       \"login\": \"ceo@example.com\",\n       \"name\": \"Aaron Levie\"\n     }'"
      - lang: dotnet
        label: Create user
        source: 'await client.Users.CreateUserAsync(requestBody: new CreateUserRequestBody(name: userName) { Login = userLogin, IsPlatformAccessOnly = true });'
      - lang: swift
        label: Create user
        source: 'try await client.users.createUser(requestBody: CreateUserRequestBody(name: userName, login: userLogin, isPlatformAccessOnly: true))'
      - lang: java
        label: Create user
        source: client.getUsers().createUser(new CreateUserRequestBody.Builder(userName).login(userLogin).isPlatformAccessOnly(true).build())
      - lang: node
        label: Create user
        source: "await client.users.createUser({\n  name: userName,\n  login: userLogin,\n  isPlatformAccessOnly: true,\n} satisfies CreateUserRequestBody);"
      - lang: python
        label: Create user
        source: client.users.create_user(user_name, login=user_login, is_platform_access_only=True)
  /users/me:
    get:
      operationId: get_users_me
      summary: Get current user
      description: 'Retrieves information about the user who is currently authenticated.


        In the case of a client-side authenticated OAuth 2.0 application this will be the user who authorized the app.


        In the case of a JWT, server-side authenticated application this will be the service account that belongs to the application by default.


        Use the `As-User` header to change who this API call is made on behalf of.'
      parameters:
      - name: fields
        in: query
        description: 'A comma-separated list of attributes to include in the response. This can be used to request fields that are not normally returned in a standard response.


          Be aware that specifying this parameter will have the effect that none of the standard fields are returned in the response unless explicitly specified, instead only fields for the mini representation are returned, additional to the fields requested.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - id
        - type
        - name
        explode: false
      responses:
        '200':
          description: Returns a single user object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User--Full'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: users
      tags:
      - Users
      x-codeSamples:
      - lang: curl
        label: Get current user
        source: "curl -i -X GET \"https://api.box.com/2.0/users/me\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\""
      - lang: dotnet
        label: Get current user
        source: await client.Users.GetUserMeAsync();
      - lang: swift
        label: Get current user
        source: try await client.users.getUserMe()
      - lang: java
        label: Get current user
        source: client.getUsers().getUserMe()
      - lang: node
        label: Get current user
        source: await client.users.getUserMe();
      - lang: python
        label: Get current user
        source: client.users.get_user_me()
  /users/{user_id}:
    get:
      operationId: get_users_id
      summary: Get user
      description: 'Retrieves information about a user in the enterprise.


        The application and the authenticated user need to have the permission to look up users in the entire enterprise.


        This endpoint also returns a limited set of information for external users who are collaborated on content owned by the enterprise for authenticated users with the right scopes. In this case, disallowed fields will return null instead.'
      parameters:
      - name: user_id
        in: path
        description: The ID of the user.
        required: true
        schema:
          type: string
        example: '12345'
      - name: fields
        in: query
        description: 'A comma-separated list of attributes to include in the response. This can be used to request fields that are not normally returned in a standard response.


          Be aware that specifying this parameter will have the effect that none of the standard fields are returned in the response unless explicitly specified, instead only fields for the mini representation are returned, additional to the fields requested.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - id
        - type
        - name
        explode: false
      responses:
        '200':
          description: 'Returns a single user object.


            Not all available fields are returned by default. Use the [fields](#parameter-fields) query parameter to explicitly request any specific fields using the [fields](#parameter-fields) parameter.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User--Full'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: users
      tags:
      - Users
      x-codeSamples:
      - lang: curl
        label: Get user
        source: "curl -i -X GET \"https://api.box.com/2.0/users/12345\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\""
      - lang: dotnet
        label: Get user
        source: 'await client.Users.GetUserByIdAsync(userId: user.Id);'
      - lang: swift
        label: Get user
        source: 'try await client.users.getUserById(userId: user.id)'
      - lang: java
        label: Get user
        source: client.getUsers().getUserById(user.getId())
      - lang: node
        label: Get user
        source: await client.users.getUserById(user.id);
      - lang: python
        label: Get user
        source: client.users.get_user_by_id(user.id)
    put:
      operationId: put_users_id
      summary: Update user
      description: Updates a managed or app user in an enterprise. This endpoint is only available to users and applications with the right admin permissions.
      parameters:
      - name: user_id
        in: path
        description: The ID of the user.
        required: true
        schema:
          type: string
        example: '12345'
      - name: fields
        in: query
        description: 'A comma-separated list of attributes to include in the response. This can be used to request fields that are not normally returned in a standard response.


          Be aware that specifying this parameter will have the effect that none of the standard fields are returned in the response unless explicitly specified, instead only fields for the mini representation are returned, additional to the fields requested.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - id
        - type
        - name
        explode: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enterprise:
                  description: Set this to `null` to roll the user out of the enterprise and make them a free user.
                  type:
                  - string
                  - 'null'
                  example: null
                notify:
                  description: Whether the user should receive an email when they are rolled out of an enterprise.
                  type: boolean
                  example: true
                name:
                  description: The name of the user.
                  type: string
                  example: Aaron Levie
                  maxLength: 50
                login:
                  description: 'The email address the user uses to log in


                    Note: If the target user''s email is not confirmed, then the primary login address cannot be changed.'
                  type: string
                  example: somename@box.com
                role:
                  description: The user’s enterprise role.
                  type: string
                  example: user
                  enum:
                  - coadmin
                  - user
                language:
                  description: The language of the user, formatted in modified version of the [ISO 639-1](/guides/api-calls/language-codes) format.
                  type: string
                  example: en
                is_sync_enabled:
                  description: Whether the user can use Box Sync.
                  type: boolean
                  example: true
                job_title:
                  description: The user’s job title.
                  type: string
                  example: CEO
                  maxLength: 100
                phone:
                  description: The user’s phone number.
                  type: string
                  example: '6509241374'
                  maxLength: 100
                address:
                  description: The user’s address.
                  type: string
                  example: 900 Jefferson Ave, Redwood City, CA 94063
                  maxLength: 255
                tracking_codes:
                  description: Tracking codes allow an admin to generate reports from the admin console and assign an attribute to a specific group of users. This setting must be enabled for an enterprise before it can be used.
                  type: array
                  items:
                    $ref: '#/components/schemas/TrackingCode'
                can_see_managed_users:
                  description: Whether the user can see other enterprise users in their contact list.
                  type: boolean
                  example: true
                timezone:
                  description: The user's timezone.
                  type: string
                  format: timezone
                  example: Africa/Bujumbura
                is_external_collab_restricted:
                  description: Whether the user is allowed to collaborate with users outside their enterprise.
                  type: boolean
                  example: true
                is_exempt_from_device_limits:
                  description: Whether to exempt the user from enterprise device limits.
                  type: boolean
                  example: true
                is_exempt_from_login_verification:
                  description: Whether the user must use two-factor authentication.
                  type: boolean
                  example: true
                is_password_reset_required:
                  description: Whether the user is required to reset their password.
                  type: boolean
                  example: true
                is_collaborated_content_available_when_owner_inactive:
                  description: Whether collaborators can access content owned by the user when the user is inactive. This setting preserves existing collaborator access and does not grant new permissions.
                  type: boolean
                  example: true
                status:
                  description: The user's account status.
                  type: string
                  example: active
                  enum:
                  - active
                  - inactive
                  - cannot_delete_edit
                  - cannot_delete_edit_upload
                space_amount:
                  description: The user’s total available space in bytes. Set this to `-1` to indicate unlimited storage.
                  type: integer
                  format: int64
                  example: 11345156112
                notification_email:
                  description: 'An alternate notification email address to which email notifications are sent. When it''s confirmed, this will be the email address to which notifications are sent instead of to the primary email address.


                    Set this value to `null` to remove the notification email.'
                  type:
                  - object
                  - 'null'
                  properties:
                    email:
                      description: The email address to send the notifications to.
                      type: string
                      example: notifications@example.com
                external_app_user_id:
                  description: 'An external identifier for an app user, which can be used to look up the user. This can be used to tie user IDs from external identity providers to Box users.


                    Note: In order to update this field, you need to request a token using the application that created the app user.'
                  type: string
                  example: my-user-1234
      responses:
        '200':
          description: Returns the updated user object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User--Full'
        '400':
          description: 'Returns an error if some of the parameters are missing or not valid.


            - `invalid_parameter` when a parameter is formatted incorrectly, for example when the `notification_email` has an incorrectly formatted email address.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '403':
          description: 'Returns an error if the user is not allowed to make the changes.


            - `access_denied_insufficient_permissions` when the user does not have the right permissions, for example when updating the notification email is turned off for the enterprise.

            - `denied_by_policy` when the user does not have the right permissions due to the information barrier restrictions.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: users
      tags:
      - Users
      x-codeSamples:
      - lang: curl
        label: Update user
        source: "curl -i -X PUT \"https://api.box.com/2.0/users/12345\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\" \\\n     -H \"content-type: application/json\" \\\n     -d '{\n       \"name\": \"Aaron Levie\"\n     }'"
      - lang: dotnet
        label: Update user
        source: 'await client.Users.UpdateUserByIdAsync(userId: user.Id, requestBody: new UpdateUserByIdRequestBody() { Name = updatedUserName });'
      - lang: swift
        label: Update user
        source: 'try await client.users.updateUserById(userId: user.id, requestBody: UpdateUserByIdRequestBody(name: updatedUserName))'
      - lang: java
        label: Update user
        source: client.getUsers().updateUserById(user.getId(), new UpdateUserByIdRequestBody.Builder().name(updatedUserName).build())
      - lang: node
        label: Update user
        source: "await client.users.updateUserById(user.id, {\n  requestBody: { name: updatedUserName } satisfies UpdateUserByIdRequestBody,\n} satisfies UpdateUserByIdOptionalsInput);"
      - lang: python
        label: Update user
        source: client.users.update_user_by_id(user.id, name=updated_user_name)
    delete:
      operationId: delete_users_id
      summary: Delete user
      description: 'Deletes a user. By default, this operation fails if the user still owns any content. To proceed, move their owned content first, or use the `force` parameter to delete the user and their files.


        If the enterprise has a retention policy, including a retired one, or a legal hold that is not fully released, you can''t delete a user who owns content, even with `force`. Transfer the user''s content first by using the Transfer owned folders endpoint.'
      parameters:
      - name: user_id
        in: path
        description: The ID of the user.
        required: true
        schema:
          type: string
        example: '12345'
      - name: notify
        in: query
        description: Whether the user will receive email notification of the deletion.
        schema:
          type: boolean
        example: true
      - name: force
        in: query
        description: 'Specifies whether to delete the user even if they still own files.


          If the user owns content and the enterprise has a retention policy, including a retired one, or a legal hold that is not fully released, setting `force` to `true` doesn''t delete the user. The request returns a `403` error, and you must transfer the user''s content before deleting the user.'
        schema:
          type: boolean
        example: true
      responses:
        '204':
          description: Removes the user and returns an empty response.
        '403':
          description: 'Returns an error if the user can''t be deleted.


            - `forbidden` with the message `User cannot be deleted due to retention policies. Please transfer user content first` when the user owns content and the enterprise has a retention policy, including a retired one, or a legal hold that is not fully released. This applies even if none of the policies apply to the user''s content, and even when `force` is set to `true`. Transfer the user''s content by using the [Transfer owned folders](/reference/put-users-id-folders-0) endpoint, then try again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: users
      tags:
      - Users
      x-codeSamples:
      - lang: curl
        label: Delete user
        source: "curl -i -X DELETE \"https://api.box.com/2.0/users/12345\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\""
      - lang: dotnet
        label: Delete user
        source: 'await client.Users.DeleteUserByIdAsync(userId: user.Id);'
      - lang: swift
        label: Delete user
        source: 'try await client.users.deleteUserById(userId: user.id)'
      - lang: java
        label: Delete user
        source: client.getUsers().deleteUserById(user.getId())
      - lang: node
        label: Delete user
        source: await client.users.deleteUserById(user.id);
      - lang: python
        label: Delete user
        source: client.users.delete_user_by_id(user.id)
components:
  schemas:
    TrackingCode:
      description: Tracking codes allow an admin to generate reports from the admin console and assign an attribute to a specific group of users. This setting must be enabled for an enterprise before it can be used.
      type: object
      properties:
        type:
          description: The value will always be `tracking_code`.
          type: string
          example: tracking_code
          enum:
          - tracking_code
        name:
          description: The name of the tracking code, which must be preconfigured in the Admin Console.
          type: string
          example: department
        value:
          description: The value of the tracking code.
          type: string
          example: Sales
      title: Tracking code
    User--Full:
      description: A full representation of a user, as can be returned from any user API endpoint.
      type: object
      allOf:
      - $ref: '#/components/schemas/User'
      - properties:
          role:
            description: The user’s enterprise role.
            type: string
            example: admin
            enum:
            - admin
            - coadmin
            - user
          tracking_codes:
            description: Tracking codes allow an admin to generate reports from the admin console and assign an attribute to a specific group of users. This setting must be enabled for an enterprise before it can be used.
            type: array
            items:
              $ref: '#/components/schemas/TrackingCode'
          can_see_managed_users:
            description: Whether the user can see other enterprise users in their contact list.
            type: boolean
            example: true
          is_sync_enabled:
            description: Whether the user can use Box Sync.
            type: boolean
            example: true
          is_external_collab_restricted:
            description: Whether the user is allowed to collaborate with users outside their enterprise.
            type: boolean
            example: true
          is_exempt_from_device_limits:
            description: Whether to exempt the user from Enterprise device limits.
            type: boolean
            example: true
          is_exempt_from_login_verification:
            description: Whether the user must use two-factor authentication.
            type: boolean
            example: true
          is_collaborated_content_available_when_owner_inactive:
            description: Whether collaborators can access content owned by the user when the user is inactive. This setting preserves existing collaborator access and does not grant new permissions.
            type: boolean
            example: true
          enterprise:
            allOf:
            - title: Enterprise
              type: object
              description: A representation of a Box enterprise.
              properties:
                id:
                  description: The unique identifier for this enterprise.
                  type: string
                  example: '11446498'
                type:
                  description: The value will always be `enterprise`.
                  type: string
                  example: enterprise
                  enum:
                  - enterprise
                name:
                  description: The name of the enterprise.
                  type: string
                  example: Acme Inc.
            - description: Representation of the user’s enterprise.
          my_tags:
            description: Tags for all files and folders owned by the user. Values returned will only contain tags that were set by the requester.
            type: array
            items:
              type: string
            example:
            - important
          hostname:
            description: The root (protocol, subdomain, domain) of any links that need to be generated for the user.
            type: string
            example: https://example.app.box.com/
          is_platform_access_only:
            description: Whether the user is an App User.
            type: boolean
            example: true
          external_app_user_id:
            description: An external identifier for an app user, which can be used to look up the user. This can be used to tie user IDs from external identity providers to Box users.
            type: string
            example: my-user-1234
      title: User (Full)
      x-box-resource-id: user--full
      x-box-tag: users
      x-box-variant: full
    ClientError:
      description: A generic error.
      type: object
      properties:
        type:
          description: The value will always be `error`.
          type: string
          example: error
          enum:
          - error
        status:
          description: The HTTP status of the response.
          type: integer
          format: int32
          example: 400
        code:
          description: A Box-specific error code.
          type: string
          example: item_name_invalid
          enum:
          - created
          - accepted
          - no_content
          - redirect
          - not_modified
          - bad_request
          - unauthorized
          - forbidden
          - not_found
          - method_not_allowed
          - conflict
          - precondition_failed
          - unprocessable_entity
          - too_many_requests
          - internal_server_error
          - unavailable
          - item_name_invalid
          - insufficient_scope
        message:
          description: A short message describing the error.
          type: string
          example: Method Not Allowed
        context_info:
          description: A free-form object that contains additional context about the error. The possible fields are defined on a per-endpoint basis. `message` is only one example.
          type:
          - object
          - 'null'
          example:
            message: Something went wrong
          additionalProperties: {}
        help_url:
          description: A URL that links to more information about why this error occurred.
          type: string
          example: https://developer.box.com/guides/api-calls/permissions-and-errors/common-errors/
        request_id:
          description: A unique identifier for this response, which can be used when contacting Box support.
          type: string
          example: abcdef123456
      title: Client error
      x-box-resource-id: client_error
    User--Mini:
