    post:
      operationId: post_folders_id_metadata_id_id
      summary: Box Create metadata instance on folder
      tags:
      - Folders
      x-box-tag: folder_metadata
      x-box-sanitized: true
      x-box-enable-explorer: false
      description: 'Applies an instance of a metadata template to a folder.


        In most cases only values that are present in the metadata template

        will be accepted, except for the `global.properties` template which accepts

        any key-value pair.


        To display the metadata template in the Box web app the enterprise needs to be

        configured to enable **Cascading Folder Level Metadata** for the user in the

        admin console.'
      parameters:
      - name: folder_id
        description: 'The unique identifier that represent a folder.


          The ID for any folder can be determined

          by visiting this folder in the web application

          and copying the ID from the URL. For example,

          for the URL `https://*.app.box.com/folder/123`

          the `folder_id` is `123`.


          The root folder of a Box account is

          always represented by the ID `0`.'
        example: '12345'
        in: path
        required: true
        schema:
          type: string
          nullable: false
      - name: scope
        description: The scope of the metadata template
        example: global
        in: path
        required: true
        schema:
          type: string
          enum:
          - global
          - enterprise
      - name: template_key
        description: The name of the metadata template
        example: properties
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: Aaron Levie
              additionalProperties:
                allOf:
                - {}
                - example: Aaron Levie
                - description: 'A value for each of the fields that are present on the metadata

                    template.

                    For the `global.properties` template this can be a list of zero

                    or more fields, as this template allows for any generic key-value

                    pairs to be stored in the template.'
              x-box-example-key: name
      responses:
        '201':
          description: 'Returns the instance of the template that was applied to the folder,

            including the data that was applied to the template.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metadata--Full'
        '400':
          description: 'Returns an error when the request body is not valid.


            * `schema_validation_failed` - The request body contains a value for

            a field that either does not exist, or for which the value or type does

            not match the expected field type. An example might be an unknown option

            for an `enum` or `multiSelect` field.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '404':
          description: 'Returns an error when the folder or metadata template was not found.


            * `not_found` - The folder could not be found, or the user does not have

            access to the folder.

            * `instance_tuple_not_found` - The metadata template was not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '409':
          description: 'Returns an error when an instance of this metadata template is already

            present on the folder.


            * `tuple_already_exists` - An instance of them metadata template already

            exists on the file.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
    put:
      operationId: put_folders_id_metadata_id_id
      summary: Box Update metadata instance on folder
      tags:
      - Folders
      x-box-tag: folder_metadata
      x-box-sanitized: true
      description: 'Updates a piece of metadata on a folder.


        The metadata instance can only be updated if the template has already been

        applied to the folder before. When editing metadata, only values that match

        the metadata template schema will be accepted.


        The update is applied atomically. If any errors occur during the

        application of the operations, the metadata instance will not be changed.'
      parameters:
      - name: folder_id
        description: 'The unique identifier that represent a folder.


          The ID for any folder can be determined

          by visiting this folder in the web application

          and copying the ID from the URL. For example,

          for the URL `https://*.app.box.com/folder/123`

          the `folder_id` is `123`.


          The root folder of a Box account is

          always represented by the ID `0`.'
        example: '12345'
        in: path
        required: true
        schema:
          type: string
          nullable: false
      - name: scope
        description: The scope of the metadata template
        example: global
        in: path
        required: true
        schema:
          type: string
          enum:
          - global
          - enterprise
      - name: template_key
        description: The name of the metadata template
        example: properties
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              description: 'A [JSON-Patch](https://tools.ietf.org/html/rfc6902)

                specification for the changes to make to the metadata

                instance.


                The changes are represented as a JSON array of

                operation objects.'
              type: array
              items:
                title: A metadata instance update operation
                description: 'A [JSON-Patch](https://tools.ietf.org/html/rfc6902) operation for a

                  change to make to the metadata instance.'
                type: object
                properties:
                  op:
                    type: string
                    example: add
                    enum:
                    - add
                    - replace
                    - remove
                    - test
                    - move
                    - copy
                    description: 'The type of change to perform on the template. Some

                      of these are hazardous as they will change existing templates.'
                  path:
                    type: string
                    example: /currentState
                    description: 'The location in the metadata JSON object

                      to apply the changes to, in the format of a

                      [JSON-Pointer](https://tools.ietf.org/html/rfc6901).


                      The path must always be prefixed with a `/` to represent the root

                      of the template. The characters `~` and `/` are reserved

                      characters and must be escaped in the key.'
                  value:
                    type: string
                    example: reviewed
                    description: 'The value to be set or tested.


                      Required for `add`, `replace`, and `test` operations. For `add`,

                      if the value exists already the previous value will be overwritten

                      by the new value. For `replace`, the value must exist before

                      replacing.


                      For `test`, the existing value at the `path` location must match

                      the specified value.'
                  from:
                    type: string
                    example: /nextState
                    description: 'The location in the metadata JSON object to move or copy a value

                      from. Required for `move` or `copy` operations and must be in the

                      format of a [JSON-Pointer](https://tools.ietf.org/html/rfc6901).'
      responses:
        '200':
          description: 'Returns the updated metadata template instance, with the

            custom template data included.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metadata--Full'
        '400':
          description: 'Returns an error when the request body is not valid.


            * `bad_request` - The request body format is not an array of valid JSON

            Patch objects.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '500':
          description: 'Returns an error in some edge cases when the request body is not a valid

            array of JSON Patch items.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
