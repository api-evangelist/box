      summary: Box List trashed items
      tags:
      - Folders
      x-box-tag: trashed_items
      description: 'Retrieves the files and folders that have been moved

        to the trash.


        Any attribute in the full files or folders objects can be passed

        in with the `fields` parameter to retrieve those specific

        attributes that are not returned by default.


        This endpoint defaults to use offset-based pagination, yet also supports

        marker-based pagination using the `marker` parameter.'
      parameters:
      - name: fields
        description: 'A comma-separated list of attributes to include in the

          response. This can be used to request fields that are

          not normally returned in a standard response.


          Be aware that specifying this parameter will have the

          effect that none of the standard fields are returned in

          the response unless explicitly specified, instead only

          fields for the mini representation are returned, additional

          to the fields requested.'
        in: query
        example:
        - id
        - type
        - name
        required: false
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: limit
        description: The maximum number of items to return per page.
        in: query
        required: false
        example: 1000
        schema:
          type: integer
          format: int64
          maximum: 1000
      - name: offset
        description: 'The offset of the item at which to begin the response.


          Queries with offset parameter value

          exceeding 10000 will be rejected

          with a 400 response.'
        in: query
        required: false
        example: 1000
        schema:
          type: integer
          format: int64
          default: 0
      - name: usemarker
        description: 'Specifies whether to use marker-based pagination instead of

          offset-based pagination. Only one pagination method can

          be used at a time.


          By setting this value to true, the API will return a `marker` field

          that can be passed as a parameter to this endpoint to get the next

          page of the response.'
        in: query
        required: false
        example: true
        schema:
          type: boolean
      - name: marker
        description: 'Defines the position marker at which to begin returning results. This is

          used when paginating using marker-based pagination.


          This requires `usemarker` to be set to `true`.'
        in: query
        required: false
        example: JV9IRGZmieiBasejOG9yDCRNgd2ymoZIbjsxbJMjIs3kioVii
        schema:
          type: string
      - name: direction
        description: 'The direction to sort results in. This can be either in alphabetical ascending

          (`ASC`) or descending (`DESC`) order.'
        in: query
        required: false
        example: ASC
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - name: sort
        description: 'Defines the **second** attribute by which items

          are sorted.


          Items are always sorted by their `type` first, with

          folders listed before files, and files listed

          before web links.


          This parameter is not supported when using marker-based pagination.'
        in: query
        required: false
        example: name
        schema:
          type: string
          enum:
          - name
          - date
          - size
      responses:
        '200':
          description: Returns a list of items that have been deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Items'
        '400':
          description: 'Returns an error if some of the parameters are missing or

            not valid.


            * `invalid_parameter` can appear when the `sort`, `direction` or `offset`

            parameter is provided when using marker based pagination, or when the

            `marker` parameter is provided but `usemarker` is set to `false` or

            `null`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
