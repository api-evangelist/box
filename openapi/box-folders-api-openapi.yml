      description: 'A full representation of a folder, as can be returned from any

        folder API endpoints by default'
      allOf:
      - $ref: '#/components/schemas/Folder'
      - properties:
          sync_state:
            allOf:
            - type: string
              example: synced
              nullable: false
              description: 'Specifies whether a folder should be synced to a

                user''s device or not. This is used by Box Sync

                (discontinued) and is not used by Box Drive.'
              enum:
              - synced
              - not_synced
              - partially_synced
          has_collaborations:
            type: boolean
            example: true
            nullable: false
            description: Specifies if this folder has any other collaborators.
          permissions:
            allOf:
            - type: object
              description: The permissions that the authenticated user has for a folder.
              required:
              - can_upload
              allOf:
              - type: object
                description: The permissions that the authenticated user has for an item.
                required:
                - can_delete
                - can_download
                - can_invite_collaborator
                - can_rename
                - can_set_share_access
                - can_share
                properties:
                  can_delete:
                    type: boolean
                    description: Specifies if the current user can delete this item.
                    example: true
                    nullable: false
                  can_download:
                    type: boolean
                    description: Specifies if the current user can download this item.
                    example: true
                    nullable: false
                  can_invite_collaborator:
                    type: boolean
                    description: 'Specifies if the current user can invite new

                      users to collaborate on this item, and if the user can

                      update the role of a user already collaborated on this

                      item.'
                    example: true
                    nullable: false
                  can_rename:
                    type: boolean
                    description: Specifies if the user can rename this item.
                    example: true
                    nullable: false
                  can_set_share_access:
                    type: boolean
                    description: 'Specifies if the user can change the access level of an

                      existing shared link on this item.'
                    example: true
                    nullable: false
                  can_share:
                    type: boolean
                    description: Specifies if the user can create a shared link for this item.
                    example: true
                    nullable: false
              - properties:
                  can_upload:
                    type: boolean
                    description: Specifies if the user can upload into this folder.
                    example: true
                    nullable: false
            - description: 'Describes the permissions that the current user has

                for this folder'
