openapi: 3.2.0
info:
  title: Box Platform Folders API
  description: Box Platform provides functionality to provide access to content stored within Box. It provides endpoints for basic manipulation of files and folders, management of users within an enterprise, as well as more complex topics such as legal holds and retention policies.
  termsOfService: https://cloud.app.box.com/s/rmwxu64h1ipr41u49w3bbuvbsa29wku9
  contact:
    name: Box, Inc
    url: https://developer.box.com
    email: devrel@box.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '2024.0'
  x-box-commit-hash: 53bdced3cd
servers:
- url: https://api.box.com/2.0
  description: Box Platform API server.
security:
- OAuth2Security: []
tags:
- name: Folders
  description: Folders, together with Files, are at the core of the Box API. Folders can be uploaded and downloaded, as well as hold important metadata information about the content.
  x-box-tag: folders
paths:
  /folders/{folder_id}:
    get:
      operationId: get_folders_id
      summary: Get folder information
      description: 'Retrieves details for a folder, including the first 100 entries in the folder.


        Passing `sort`, `direction`, `offset`, and `limit` parameters in query allows you to manage the list of returned folder items.


        To fetch more items within the folder, use the Get items in a folder endpoint.'
      parameters:
      - name: folder_id
        in: path
        description: 'The unique identifier that represent a folder.


          The ID for any folder can be determined by visiting this folder in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/folder/123` the `folder_id` is `123`.


          The root folder of a Box account is always represented by the ID `0`.'
        required: true
        schema:
          type: string
        example: '12345'
      - name: fields
        in: query
        description: 'A comma-separated list of attributes to include in the response. This can be used to request fields that are not normally returned in a standard response.


          Be aware that specifying this parameter will have the effect that none of the standard fields are returned in the response unless explicitly specified, instead only fields for the mini representation are returned, additional to the fields requested.


          Additionally this field can be used to query any metadata applied to the file by specifying the `metadata` field as well as the scope and key of the template to retrieve, for example `?fields=metadata.enterprise_12345.contractTemplate`.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - id
        - type
        - name
        explode: false
      - name: if-none-match
        in: header
        description: 'Ensures an item is only returned if it has changed.


          Pass in the item''s last observed `etag` value into this header and the endpoint will fail with a `304 Not Modified` if the item has not changed since.'
        required: false
        schema:
          type: string
        example: '1'
      - name: boxapi
        in: header
        description: 'The URL, and optional password, for the shared link of this item.


          This header can be used to access items that have not been explicitly shared with a user.


          Use the format `shared_link=[link]` or if a password is required then use `shared_link=[link]&shared_link_password=[password]`.


          This header can be used on the file or folder shared, as well as on any files or folders nested within the item.'
        required: false
        schema:
          type: string
        example: shared_link=[link]&shared_link_password=[password]
      - name: sort
        in: query
        description: 'Defines the **second** attribute by which items are sorted.


          The folder type affects the way the items are sorted:


          - **Standard folder**: Items are always sorted by their `type` first, with folders listed before files, and files listed before web links.


          - **Root folder**: This parameter is not supported for marker-based pagination on the root folder


          (the folder with an `id` of `0`).


          - **Shared folder with parent path to the associated folder visible to the collaborator**: Items are always sorted by their `type` first, with folders listed before files, and files listed before web links.'
        required: false
        schema:
          type: string
          enum:
          - id
          - name
          - date
          - size
        example: id
      - name: direction
        in: query
        description: The direction to sort results in. This can be either in alphabetical ascending (`ASC`) or descending (`DESC`) order.
        required: false
        schema:
          type: string
          enum:
          - ASC
          - DESC
        example: ASC
      - name: offset
        in: query
        description: 'The offset of the item at which to begin the response.


          Offset-based pagination is not guaranteed to work reliably for high offset values and may fail for large datasets. In those cases, reduce the number of items in the folder (for example, by restructuring the folder into smaller subfolders) before retrying the request.'
        required: false
        schema:
          type: integer
          format: int64
          default: 0
        example: 1000
      - name: limit
        in: query
        description: The maximum number of items to return per page.
        required: false
        schema:
          type: integer
          format: int64
          maximum: 1000
        example: 1000
      responses:
        '200':
          description: 'Returns a folder, including the first 100 entries in the folder. If you used query parameters like `sort`, `direction`, `offset`, or `limit` the _folder items list_ will be affected accordingly.


            To fetch more items within the folder, use the [Get items in a folder](/reference/get-folders-id-items)) endpoint.


            Not all available fields are returned by default. Use the [fields](#parameter-fields) query parameter to explicitly request any specific fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder--Full'
        '304':
          description: Returns an empty response when the `If-None-Match` header matches the current `etag` value of the folder. This indicates that the folder has not changed since it was last requested.
        '403':
          description: Returned when the access token provided in the `Authorization` header is not recognized or not provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '404':
          description: Returned if the folder is not found, or the user does not have access to the folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '405':
          description: Returned if the `folder_id` is not in a recognized format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: folders
      tags:
      - Folders
      x-codeSamples:
      - lang: curl
        label: Get folder information
        source: "curl -i -X GET \"https://api.box.com/2.0/folders/4353455\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\""
      - lang: dotnet
        label: Get folder information
        source: 'await client.Folders.GetFolderByIdAsync(folderId: "0");'
      - lang: swift
        label: Get folder information
        source: 'try await client.folders.getFolderById(folderId: "0")'
      - lang: java
        label: Get folder information
        source: client.getFolders().getFolderById("0")
      - lang: node
        label: Get folder information
        source: await client.folders.getFolderById('0');
      - lang: python
        label: Get folder information
        source: client.folders.get_folder_by_id("0")
    put:
      operationId: put_folders_id
      summary: Update folder
      description: Updates a folder. This can be also be used to move the folder, create shared links, update collaborations, and more.
      parameters:
      - name: folder_id
        in: path
        description: 'The unique identifier that represent a folder.


          The ID for any folder can be determined by visiting this folder in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/folder/123` the `folder_id` is `123`.


          The root folder of a Box account is always represented by the ID `0`.'
        required: true
        schema:
          type: string
        example: '12345'
      - name: fields
        in: query
        description: 'A comma-separated list of attributes to include in the response. This can be used to request fields that are not normally returned in a standard response.


          Be aware that specifying this parameter will have the effect that none of the standard fields are returned in the response unless explicitly specified, instead only fields for the mini representation are returned, additional to the fields requested.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - id
        - type
        - name
        explode: false
      - name: if-match
        in: header
        description: 'Ensures this item hasn''t recently changed before making changes.


          Pass in the item''s last observed `etag` value into this header and the endpoint will fail with a `412 Precondition Failed` if it has changed since.'
        required: false
        schema:
          type: string
        example: '1'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: 'The optional new name for this folder.


                    The following restrictions to folder names apply: names containing non-printable ASCII characters, forward and backward slashes (`/`, `\`), names with trailing spaces, and names `.` and `..` are not allowed.


                    Folder names must be unique within their parent folder. The name check is case-insensitive, so a folder named `New Folder` cannot be created in a parent folder that already contains a folder named `new folder`.'
                  type: string
                  example: New Folder
                description:
                  description: The optional description of this folder.
                  type: string
                  example: Legal contracts for the new ACME deal
                  maxLength: 256
                sync_state:
                  description: Specifies whether a folder should be synced to a user's device or not. This is used by Box Sync (discontinued) and is not used by Box Drive.
                  type: string
                  example: synced
                  enum:
                  - synced
                  - not_synced
                  - partially_synced
                can_non_owners_invite:
                  description: Specifies if users who are not the owner of the folder can invite new collaborators to the folder.
                  type: boolean
                  example: true
                parent:
                  allOf:
                  - type: object
                    description: The parent for this item.
                    properties:
                      id:
                        description: The ID of parent item.
                        type: string
                        example: '123'
                      user_id:
                        description: The input for `user_id` is optional. Moving to non-root folder is not allowed when `user_id` is present. Parent folder id should be zero when `user_id` is provided.
                        type: string
                        example: '12346930'
                  - description: The parent folder for this folder. Use this to move the folder or to restore it out of the trash.
                shared_link:
                  allOf:
                  - description: Defines a shared link for an item. Set this to `null` to remove the shared link.
                    type: object
                    properties:
                      access:
                        description: 'The level of access for the shared link. This can be restricted to anyone with the link (`open`), only people within the company (`company`) and only those who have been invited to the folder (`collaborators`).


                          If not set, this field defaults to the access level specified by the enterprise admin. To create a shared link with this default setting pass the `shared_link` object with no `access` field, for example `{ "shared_link": {} }`.


                          The `company` access level is only available to paid accounts.'
                        type: string
                        example: open
                        enum:
                        - open
                        - company
                        - collaborators
                      password:
                        description: The password required to access the shared link. Set the password to `null` to remove it. Passwords must now be at least eight characters long and include a number, upper case letter, or a non-numeric or non-alphabetic character. A password can only be set when `access` is set to `open`.
                        type:
                        - string
                        - 'null'
                        example: do-n8t-use-this-Password
                      vanity_name:
                        description: 'Defines a custom vanity name to use in the shared link URL, for example `https://app.box.com/v/my-shared-link`.


                          Custom URLs should not be used when sharing sensitive content as vanity URLs are a lot easier to guess than regular shared links.'
                        type: string
                        example: my-shared-link
                      unshared_at:
                        description: The timestamp at which this shared link will expire. This field can only be set by users with paid accounts.
                        type: string
                        format: date-time
                        example: '2012-12-12T10:53:43-08:00'
                      permissions:
                        type: object
                        properties:
                          can_download:
                            description: If the shared link allows for downloading of files. This can only be set when `access` is set to `open` or `company`.
                            type: boolean
                            example: true
                      one_time_passcode:
                        allOf:
                        - $ref: '#/components/schemas/SharedLinkOtpWritable'
                        - description: One-time-passcode (OTP) settings for the shared link.
                  - description: Enables the creation of a shared link for a folder.
                folder_upload_email:
                  allOf:
                  - title: Folder upload email
                    type: object
                    description: The Write Folder Upload Email object.
                    properties:
                      access:
                        description: 'When this parameter has been set, users can email files to the email address that has been automatically created for this folder.


                          To create an email address, set this property either when creating or updating the folder.


                          When set to `collaborators`, only emails from registered email addresses for collaborators will be accepted. This includes any email aliases a user might have registered.


                          When set to `open` it will accept emails from any email address.'
                        type: string
                        example: open
                        enum:
                        - open
                        - collaborators
                  - description: 'Setting this object enables the upload email address.


                      This email address can be used by users to directly upload files directly to the folder via email.


                      Setting the value to `null` will disable the email address.'
                tags:
                  description: 'The tags for this item. These tags are shown in the Box web app and mobile apps next to an item.


                    To add or remove a tag, retrieve the item''s current tags, modify them, and then update this field.


                    There is a limit of 100 tags per item, and 10,000 unique tags per enterprise.'
                  type: array
                  items:
                    type: string
                  example:
                  - approved
                  maxItems: 100
                  minItems: 1
                is_collaboration_restricted_to_enterprise:
                  description: Specifies if new invites to this folder are restricted to users within the enterprise. This does not affect existing collaborations.
                  type: boolean
                  example: true
                collections:
                  description: 'An array of collections to make this folder a member of. Currently we only support the `favorites` collection.


                    To get the ID for a collection, use the [List all collections][1] endpoint.


                    Passing an empty array `[]` or `null` will remove the folder from all collections.


                    [1]: /reference/get-collections'
                  type:
                  - array
                  - 'null'
                  items:
                    title: Reference
                    description: The bare basic reference for an object.
                    type: object
                    properties:
                      id:
                        description: The unique identifier for this object.
                        type: string
                        example: '11446498'
                      type:
                        description: The type for this object.
                        type: string
                        example: file
                can_non_owners_view_collaborators:
                  description: 'Restricts collaborators who are not the owner of this folder from viewing other collaborations on this folder.


                    It also restricts non-owners from inviting new collaborators.


                    When setting this field to `false`, it is required to also set `can_non_owners_invite_collaborators` to `false` if it has not already been set.'
                  type: boolean
                  example: true
      responses:
        '200':
          description: 'Returns a folder object for the updated folder


            Not all available fields are returned by default. Use the [fields](#parameter-fields) query parameter to explicitly request any specific fields.


            If the user is moving folders with a large number of items in all of their descendants, the call will be run asynchronously. If the operation is not completed within 10 minutes, the user will receive a 200 OK response, and the operation will continue running.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder--Full'
        '400':
          description: 'Returns an error if some of the parameters are missing or not valid, or if a folder lock is preventing a move operation.


            - `bad_request` when a parameter is missing or incorrect. This error also happens when a password is set for a shared link with an access type of `open`.

            - `item_name_too_long` when the folder name is too long.

            - `item_name_invalid` when the folder name contains non-valid characters.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '403':
          description: 'Returns an error if the user does not have the required access to perform the action.


            - `access_denied_insufficient_permissions`: Returned when the user does not have access to the folder or parent folder, or if the folder is being moved and a folder lock has been applied to prevent such operations.


            - `insufficient_scope`: Returned an error if the application does not have the right scope to update folders. Make sure your application has been configured to read and write all files and folders stored in Box.


            - `forbidden`: Returned when the user is not allowed to perform this action for other users. This can include trying to create a Shared Link with a `company` access level on a free account.


            - `forbidden_by_policy`: Returned if copying a folder is forbidden due to information barrier restrictions.


            Returns an error if there are too many actions in the request body.


            - `operation_limit_exceeded`: Returned when the user passes any parameters in addition to the `parent.id` in the request body. The calls to this endpoint have to be split up. The first call needs to include only the `parent.id`, the next call can include other parameters.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '404':
          description: 'Returns an error if the folder or parent folder could not be found, or the authenticated user does not have access to either folder.


            - `not_found` when the authenticated user does not have access to the folder or parent folder.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '409':
          description: '`operation_blocked_temporary`: Returned if either of the destination or source folders is locked due to another move, copy, delete or restore operation in progress.


            The operation can be retried at a later point.


            `item_name_in_use`: Returned if a folder with the name already exists in the parent folder.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '412':
          description: Returns an error when the `If-Match` header does not match the current `etag` value of the folder. This indicates that the folder has changed since it was last requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '503':
          description: Returns an error when the operation takes longer than 600 seconds. The operation will continue after this response has been returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: folders
      tags:
      - Folders
      x-codeSamples:
      - lang: curl
        label: Update folder
        source: "curl -i -X PUT \"https://api.box.com/2.0/folders/4353455\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\" \\\n     -H \"content-type: application/json\" \\\n     -d '{\n       \"name\": \"New folder name\"\n     }'"
      - lang: dotnet
        label: Update folder
        source: 'await client.Folders.UpdateFolderByIdAsync(folderId: folderToUpdate.Id, requestBody: new UpdateFolderByIdRequestBody() { Name = updatedName, Description = "Updated description" });'
      - lang: swift
        label: Update folder
        source: 'try await client.folders.updateFolderById(folderId: folderToUpdate.id, requestBody: UpdateFolderByIdRequestBody(name: updatedName, description: "Updated description"))'
      - lang: java
        label: Update folder
        source: client.getFolders().updateFolderById(folderToUpdate.getId(), new UpdateFolderByIdRequestBody.Builder().name(updatedName).description("Updated description").build())
      - lang: node
        label: Update folder
        source: "await client.folders.updateFolderById(folderToUpdate.id, {\n  requestBody: {\n    name: updatedName,\n    description: 'Updated description',\n  } satisfies UpdateFolderByIdRequestBody,\n} satisfies UpdateFolderByIdOptionalsInput);"
      - lang: python
        label: Update folder
        source: "client.folders.update_folder_by_id(\n    folder_to_update.id, name=updated_name, description=\"Updated description\"\n)"
    delete:
      operationId: delete_folders_id
      summary: Delete folder
      description: Deletes a folder, either permanently or by moving it to the trash.
      parameters:
      - name: folder_id
        in: path
        description: 'The unique identifier that represent a folder.


          The ID for any folder can be determined by visiting this folder in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/folder/123` the `folder_id` is `123`.


          The root folder of a Box account is always represented by the ID `0`.'
        required: true
        schema:
          type: string
        example: '12345'
      - name: if-match
        in: header
        description: 'Ensures this item hasn''t recently changed before making changes.


          Pass in the item''s last observed `etag` value into this header and the endpoint will fail with a `412 Precondition Failed` if it has changed since.'
        required: false
        schema:
          type: string
        example: '1'
      - name: recursive
        in: query
        description: Delete a folder that is not empty by recursively deleting the folder and all of its content.
        required: false
        schema:
          type: boolean
        example: true
      responses:
        '204':
          description: Returns an empty response when the folder is successfully deleted or moved to the trash.
        '400':
          description: 'Returns an error if the user makes a bad request.


            - `folder_not_empty`: Returned if the folder is not empty. Use the `recursive` query parameter to recursively delete the folder and its contents.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '403':
          description: 'Returns an error if the user does not have the required access to perform the action.


            - `access_denied_insufficient_permissions`: Returned when the user does not have access to the folder, or when a folder lock has been applied to the folder to prevent deletion.


            - `insufficient_scope`: Returned an error if the application does not have the right scope to delete folders. Make sure your application has been configured to read and write all files and folders stored in Box.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '404':
          description: 'Returns an error if the folder could not be found, or the authenticated user does not have access to the folder.


            - `not_found` when the authenticated user does not have access to the folder.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '409':
          description: '`operation_blocked_temporary`: Returned if the folder is locked due to another move, copy, delete or restore operation in progress.


            The operation can be retried at a later point.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '412':
          description: Returns an error when the `If-Match` header does not match the current `etag` value of the folder. This indicates that the folder has changed since it was last requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '503':
          description: Returns an error when the operation takes longer than 600 seconds. The operation will continue after this response has been returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: folders
      tags:
      - Folders
      x-codeSamples:
      - lang: curl
        label: Delete folder
        source: "curl -i -X DELETE \"https://api.box.com/2.0/folders/4353455\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\""
      - lang: dotnet
        label: Delete folder
        source: 'await client.Folders.DeleteFolderByIdAsync(folderId: newFolder.Id);'
      - lang: swift
        label: Delete folder
        source: 'try await client.folders.deleteFolderById(folderId: newFolder.id)'
      - lang: java
        label: Delete folder
        source: client.getFolders().deleteFolderById(newFolder.getId())
      - lang: node
        label: Delete folder
        source: await client.folders.deleteFolderById(newFolder.id);
      - lang: python
        label: Delete folder
        source: client.folders.delete_folder_by_id(new_folder.id)
  /folders/{folder_id}/items:
    get:
      operationId: get_folders_id_items
      summary: List items in folder
      description: 'Retrieves a page of items in a folder. These items can be files, folders, and web links.


        To request more information about the folder itself, like its size, use the Get a folder endpoint instead.'
      parameters:
      - name: folder_id
        in: path
        description: 'The unique identifier that represent a folder.


          The ID for any folder can be determined by visiting this folder in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/folder/123` the `folder_id` is `123`.


          The root folder of a Box account is always represented by the ID `0`.'
        required: true
        schema:
          type: string
        example: '12345'
      - name: fields
        in: query
        description: 'A comma-separated list of attributes to include in the response. This can be used to request fields that are not normally returned in a standard response.


          Be aware that specifying this parameter will have the effect that none of the standard fields are returned in the response unless explicitly specified, instead only fields for the mini representation are returned, additional to the fields requested.


          Additionally this field can be used to query any metadata applied to the file by specifying the `metadata` field as well as the scope and key of the template to retrieve, for example `?fields=metadata.enterprise_12345.contractTemplate`.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - id
        - type
        - name
        explode: false
      - name: usemarker
        in: query
        description: 'Specifies whether to use marker-based pagination instead of offset-based pagination. Only one pagination method can be used at a time.


          By setting this value to true, the API will return a `marker` field that can be passed as a parameter to this endpoint to get the next page of the response.'
        required: false
        schema:
          type: boolean
        example: true
      - name: marker
        in: query
        description: 'Defines the position marker at which to begin returning results. This is used when paginating using marker-based pagination.


          This requires `usemarker` to be set to `true`.'
        required: false
        schema:
          type: string
        example: JV9IRGZmieiBasejOG9yDCRNgd2ymoZIbjsxbJMjIs3kioVii
      - name: offset
        in: query
        description: 'The offset of the item at which to begin the response.


          Offset-based pagination is not guaranteed to work reliably for high offset values and may fail for large datasets. In those cases, use marker-based pagination by setting `usemarker` to `true`.'
        required: false
        schema:
          type: integer
          format: int64
          default: 0
        example: 1000
      - name: limit
        in: query
        description: The maximum number of items to return per page.
        required: false
        schema:
          type: integer
          format: int64
          maximum: 1000
        example: 1000
      - name: boxapi
        in: header
        description: 'The URL, and optional password, for the shared link of this item.


          This header can be used to access items that have not been explicitly shared with a user.


          Use the format `shared_link=[link]` or if a password is required then use `shared_link=[link]&shared_link_password=[password]`.


          This header can be used on the file or folder shared, as well as on any files or folders nested within the item.'
        required: false
        schema:
          type: string
        example: shared_link=[link]&shared_link_password=[password]
      - name: sort
        in: query
        description: 'Defines the **second** attribute by which items are sorted.


          The folder type affects the way the items are sorted:


          - **Standard folder**: Items are always sorted by their `type` first, with folders listed before files, and files listed before web links.


          - **Root folder**: This parameter is not supported for marker-based pagination on the root folder


          (the folder with an `id` of `0`).


          - **Shared folder with parent path to the associated folder visible to the collaborator**: Items are always sorted by their `type` first, with folders listed before files, and files listed before web links.'
        required: false
        schema:
          type: string
          enum:
          - id
          - name
          - date
          - size
        example: id
      - name: direction
        in: query
        description: The direction to sort results in. This can be either in alphabetical ascending (`ASC`) or descending (`DESC`) order.
        required: false
        schema:
          type: string
          enum:
          - ASC
          - DESC
        example: ASC
      responses:
        '200':
          description: Returns a collection of files, folders, and web links contained in a folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Items'
        '403':
          description: Returned when the access token provided in the `Authorization` header is not recognized or not provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '404':
          description: Returned if the folder is not found, or the user does not have access to the folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '405':
          description: Returned if the `folder_id` is not in a recognized format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
