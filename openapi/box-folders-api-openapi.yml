      - mini
      - standard
    SharedLinkOtpWritableAllowlist:
      description: Anonymous recipients can request a one-time-passcode only when they enter an email that matches an entry on the `allowlist`.
      type: object
      properties:
        mode:
          description: Set to `allowlist` to restrict OTP requests to emails matching an entry on the `allowlist`.
