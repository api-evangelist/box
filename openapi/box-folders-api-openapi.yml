  /folders:
    post:
      operationId: post_folders
      summary: Create folder
      description: Creates a new empty folder within the specified parent folder.
      parameters:
      - name: fields
        in: query
        description: 'A comma-separated list of attributes to include in the response. This can be used to request fields that are not normally returned in a standard response.


          Be aware that specifying this parameter will have the effect that none of the standard fields are returned in the response unless explicitly specified, instead only fields for the mini representation are returned, additional to the fields requested.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - id
        - type
        - name
        explode: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: 'The name for the new folder.


                    The following restrictions to folder names apply: names containing non-printable ASCII characters, forward and backward slashes (`/`, `\`), names with trailing spaces, and names `.` and `..` are not allowed.


                    Folder names must be unique within their parent folder. The name check is case-insensitive, so a folder named `New Folder` cannot be created in a parent folder that already contains a folder named `new folder`.'
                  type: string
                  example: New Folder
                  maxLength: 255
                  minLength: 1
                parent:
                  description: The parent folder to create the new folder within.
                  type: object
                  properties:
                    id:
                      description: The ID of parent folder.
                      type: string
                      example: '0'
                  required:
                  - id
                folder_upload_email:
                  allOf:
                  - title: Folder upload email
                    type: object
                    description: The Write Folder Upload Email object.
                    properties:
                      access:
                        description: 'When this parameter has been set, users can email files to the email address that has been automatically created for this folder.


                          To create an email address, set this property either when creating or updating the folder.


                          When set to `collaborators`, only emails from registered email addresses for collaborators will be accepted. This includes any email aliases a user might have registered.


                          When set to `open` it will accept emails from any email address.'
                        type: string
                        example: open
                        enum:
                        - open
                        - collaborators
                  - description: 'Setting this object enables the upload email address.


                      This email address can be used by users to directly upload files directly to the folder via email.'
                sync_state:
                  description: Specifies whether a folder should be synced to a user's device or not. This is used by Box Sync (discontinued) and is not used by Box Drive.
                  type: string
                  example: synced
                  enum:
                  - synced
                  - not_synced
                  - partially_synced
              required:
              - name
              - parent
      responses:
        '201':
          description: 'Returns a folder object.


            Not all available fields are returned by default. Use the [fields](#parameter-fields) query parameter to explicitly request any specific fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder--Full'
        '400':
          description: 'Returns an error if some of the parameters are missing or not valid.


            - `bad_request` when a parameter is missing or incorrect.

            - `item_name_too_long` when the folder name is too long.

            - `item_name_invalid` when the folder name contains non-valid characters.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '403':
          description: Returns an error if the user does not have the required access to perform the action. This might be because they don't have access to the folder or parent folder, or because the application does not have permission to write files and folders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '404':
          description: 'Returns an error if the parent folder could not be found, or the authenticated user does not have access to the parent folder.


            - `not_found` when the authenticated user does not have access to the parent folder.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '409':
          description: '`operation_blocked_temporary`: Returned if either of the destination or source folders is locked due to another move, copy, delete or restore operation in process.


            The operation can be retried at a later point.


            `item_name_in_use`: Returned if a folder with the name already exists in the parent folder.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: folders
      tags:
      - Folders
      x-codeSamples:
      - lang: curl
        label: Create folder
        source: "curl -i -X POST \"https://api.box.com/2.0/folders\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\" \\\n     -H \"content-type: application/json\" \\\n     -d '{\n       \"name\": \"New Folder\",\n       \"parent\": {\n         \"id\": \"0\"\n       }\n     }'"
      - lang: dotnet
        label: Create folder
        source: 'await client.Folders.CreateFolderAsync(requestBody: new CreateFolderRequestBody(name: newFolderName, parent: new CreateFolderRequestBodyParentField(id: "0")));'
      - lang: swift
        label: Create folder
        source: 'try await client.folders.createFolder(requestBody: CreateFolderRequestBody(name: newFolderName, parent: CreateFolderRequestBodyParentField(id: "0")))'
      - lang: java
        label: Create folder
        source: client.getFolders().createFolder(new CreateFolderRequestBody(newFolderName, new CreateFolderRequestBodyParentField("0")))
      - lang: node
        label: Create folder
        source: "await client.folders.createFolder({\n  name: newFolderName,\n  parent: { id: '0' } satisfies CreateFolderRequestBodyParentField,\n} satisfies CreateFolderRequestBody);"
      - lang: python
        label: Create folder
        source: client.folders.create_folder(new_folder_name, CreateFolderParent(id="0"))
  /folders/{folder_id}/copy:
    post:
      operationId: post_folders_id_copy
      summary: Copy folder
      description: 'Creates a copy of a folder within a destination folder.


        The original folder will not be changed.'
      parameters:
      - name: folder_id
        in: path
        description: 'The unique identifier of the folder to copy.


          The ID for any folder can be determined by visiting this folder in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/folder/123` the `folder_id` is `123`.


          The root folder with the ID `0` can not be copied.'
        required: true
        schema:
          type: string
        example: '0'
      - name: fields
        in: query
        description: 'A comma-separated list of attributes to include in the response. This can be used to request fields that are not normally returned in a standard response.


          Be aware that specifying this parameter will have the effect that none of the standard fields are returned in the response unless explicitly specified, instead only fields for the mini representation are returned, additional to the fields requested.'
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - id
        - type
        - name
        explode: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: 'An optional new name for the copied folder.


                    There are some restrictions to the file name. Names containing non-printable ASCII characters, forward and backward slashes (`/`, `\`), as well as names with trailing spaces are prohibited.


                    Additionally, the names `.` and `..` are not allowed either.'
                  type: string
                  example: New Folder
                  maxLength: 255
                  minLength: 1
                parent:
                  description: The destination folder to copy the folder to.
                  type: object
                  properties:
                    id:
                      description: The ID of parent folder.
                      type: string
                      example: '0'
                  required:
                  - id
              required:
              - parent
      responses:
        '201':
          description: 'Returns a new folder object representing the copied folder.


            Not all available fields are returned by default. Use the [fields](#parameter-fields) query parameter to explicitly request any specific fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder--Full'
        '304':
          description: Returns an empty response when the `If-None-Match` header matches the current `etag` value of the folder. This indicates that the folder has not changed since it was last requested.
        '400':
          description: 'Returns an error if some of the parameters are missing or not valid.


            - `bad_request` when a parameter is missing.

            - `item_name_too_long` when the new folder name is too long.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '403':
          description: 'Returns an error when the user does not have the right permissions to copy a folder.


            - `forbidden_by_policy`: Returned if copying a folder is forbidden due to information barrier restrictions.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '404':
          description: 'Returns an error if either the source or destination folder could not be found, or the authenticated user does not have access to either folders.


            - `not_found` when the authenticated user does not have access to the parent folder.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '409':
          description: 'Returns an error if a folder by this name already exists in the destination folder, or if the destination folder is locked.


            - `item_name_in_use` when a folder with the same name already exists.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '500':
          description: Returns an error when trying to copy the root folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: folders
      tags:
      - Folders
      x-codeSamples:
      - lang: curl
        label: Copy folder
        source: "curl -i -X POST \"https://api.box.com/2.0/folders/4353455/copy\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\" \\\n     -H \"content-type: application/json\" \\\n     -d '{\n       \"parent\": {\n         \"id\": \"345345\"\n       }\n     }'"
      - lang: dotnet
        label: Copy folder
        source: 'await client.Folders.CopyFolderAsync(folderId: folderOrigin.Id, requestBody: new CopyFolderRequestBody(parent: new CopyFolderRequestBodyParentField(id: "0")) { Name = copiedFolderName });'
      - lang: swift
        label: Copy folder
        source: 'try await client.folders.copyFolder(folderId: folderOrigin.id, requestBody: CopyFolderRequestBody(parent: CopyFolderRequestBodyParentField(id: "0"), name: copiedFolderName))'
      - lang: java
        label: Copy folder
        source: client.getFolders().copyFolder(folderOrigin.getId(), new CopyFolderRequestBody.Builder(new CopyFolderRequestBodyParentField("0")).name(copiedFolderName).build())
      - lang: node
        label: Copy folder
        source: "await client.folders.copyFolder(folderOrigin.id, {\n  parent: { id: '0' } satisfies CopyFolderRequestBodyParentField,\n  name: copiedFolderName,\n} satisfies CopyFolderRequestBody);"
      - lang: python
        label: Copy folder
        source: "client.folders.copy_folder(\n    folder_origin.id, CopyFolderParent(id=\"0\"), name=copied_folder_name\n)"
components:
  schemas:
    File--Mini:
      description: A mini representation of a file, used when nested under another resource.
      type:
      - object
      - 'null'
      allOf:
      - $ref: '#/components/schemas/File--Base'
      - properties:
          sequence_id:
            allOf:
            - type:
              - string
              - 'null'
              example: '3'
              description: 'A numeric identifier that represents the most recent user event that has been applied to this item.


                This can be used in combination with the `GET /events`-endpoint to filter out user events that would have occurred before this identifier was read.


                An example would be where a Box Drive-like application would fetch an item via the API, and then listen to incoming user events for changes to the item. The application would ignore any user events where the `sequence_id` in the event is smaller than or equal to the `sequence_id` in the originally fetched resource.'
            - {}
          name:
            description: The name of the file.
            type: string
            example: Contract.pdf
          sha1:
            description: The SHA1 hash of the file. This can be used to compare the contents of a file on Box with a local file.
            type: string
            format: digest
            example: 85136C79CBF9FE36BB9D05D0639C70C265C18D37
          file_version:
            allOf:
            - $ref: '#/components/schemas/FileVersion--Mini'
            - description: The information about the current version of the file.
      title: File (Mini)
      x-box-resource-id: file--mini
      x-box-tag: files
      x-box-variant: mini
    SharedLinkOtpWritableNone:
      description: One-time-passcode (OTP) enforcement is turned off. The shared link is accessible without any one-time-passcode verification.
      type: object
      properties:
        mode:
          description: Set to `none` to disable OTP enforcement for the shared link.
          type: string
          example: none
          enum:
          - none
      required:
      - mode
      title: OTP turned off
    ClientError:
      description: A generic error.
      type: object
      properties:
        type:
          description: The value will always be `error`.
          type: string
          example: error
          enum:
          - error
        status:
          description: The HTTP status of the response.
          type: integer
          format: int32
          example: 400
        code:
          description: A Box-specific error code.
          type: string
          example: item_name_invalid
          enum:
          - created
          - accepted
          - no_content
          - redirect
          - not_modified
          - bad_request
          - unauthorized
          - forbidden
          - not_found
          - method_not_allowed
          - conflict
          - precondition_failed
          - unprocessable_entity
          - too_many_requests
          - internal_server_error
          - unavailable
          - item_name_invalid
          - insufficient_scope
        message:
          description: A short message describing the error.
          type: string
          example: Method Not Allowed
        context_info:
          description: A free-form object that contains additional context about the error. The possible fields are defined on a per-endpoint basis. `message` is only one example.
          type:
          - object
          - 'null'
          example:
            message: Something went wrong
          additionalProperties: {}
        help_url:
          description: A URL that links to more information about why this error occurred.
          type: string
          example: https://developer.box.com/guides/api-calls/permissions-and-errors/common-errors/
        request_id:
          description: A unique identifier for this response, which can be used when contacting Box support.
          type: string
          example: abcdef123456
      title: Client error
      x-box-resource-id: client_error
    FileVersion--Mini:
      description: A mini representation of a file version, used when nested within another resource.
      type: object
      allOf:
      - $ref: '#/components/schemas/FileVersion--Base'
      - properties:
          sha1:
            description: The SHA1 hash of this version of the file.
            type: string
            example: 134b65991ed521fcfe4724b7d814ab8ded5185dc
      title: File version (Mini)
      x-box-resource-id: file_version--mini
      x-box-variant: mini
    Resource:
      description: The file or folder resource.
      type: object
      oneOf:
      - $ref: '#/components/schemas/Folder--Mini'
      - $ref: '#/components/schemas/File--Mini'
      title: Resource
    User--Base:
      description: A mini representation of a user, used when nested within another resource.
      type: object
      properties:
        id:
          description: The unique identifier for this user.
          type: string
          example: '11446498'
        type:
          description: The value will always be `user`.
          type: string
          example: user
