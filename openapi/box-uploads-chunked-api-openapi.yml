openapi: 3.2.0
info:
  title: Box Platform Uploads (Chunked) API
  description: Box Platform provides functionality to provide access to content stored within Box. It provides endpoints for basic manipulation of files and folders, management of users within an enterprise, as well as more complex topics such as legal holds and retention policies.
  termsOfService: https://cloud.app.box.com/s/rmwxu64h1ipr41u49w3bbuvbsa29wku9
  contact:
    name: Box, Inc
    url: https://developer.box.com
    email: devrel@box.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '2024.0'
  x-box-commit-hash: 53bdced3cd
servers:
- url: https://api.box.com/2.0
  description: Box Platform API server.
security:
- OAuth2Security: []
tags:
- name: Uploads (Chunked)
  description: The chunked upload endpoints support files from 20MB in size and allow an application to upload the file in parts, allowing for more control to catch any errors and retry parts individually.
  x-box-tag: chunked_uploads
paths:
  /files/upload_sessions:
    post:
      operationId: post_files_upload_sessions
      summary: Create upload session
      description: Creates an upload session for a new file.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                folder_id:
                  description: The ID of the folder to upload the new file to.
                  type: string
                  example: '0'
                file_size:
                  description: The total number of bytes of the file to be uploaded.
                  type: integer
                  format: int64
                  example: 104857600
                file_name:
                  description: The name of new file.
                  type: string
                  example: Project.mov
              required:
              - folder_id
              - file_size
              - file_name
      responses:
        '201':
          description: Returns a new upload session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '400':
          description: 'Returns an error if some of the parameters are missing or not valid.


            - `missing_destination`: No `folder_id` was provided.

            - `invalid_folder_id`: `folder_id` is not valid.

            - `item_name_invalid`: `file_name` is not valid.

            - `missing_file_size`: `file_size` was not provided.

            - `invalid_file_size`: `file_size` was not a valid number.

            - `file_size_too_small`: `file_size` is below minimum file size for uploads via this API.

            - `missing_file_name`: `file_name` was not provided.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '403':
          description: 'Returns an error if the operation is not allowed for some reason.


            - `storage_limit_exceeded`: Account storage limit reached.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '404':
          description: 'Returns an error if the parent folder could not be found, or the authenticated user does not have access to it.


            - `invalid_parameter`: The `folder_id` value represents a folder that the user does not have access to, or does not exist.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '409':
          description: Returns an error if the file already exists, or the account has run out of disk space.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: chunked_uploads
      servers:
      - url: https://upload.box.com/api/2.0
        description: Server for file uploads.
      tags:
      - Uploads (Chunked)
      x-codeSamples:
      - lang: curl
        label: Create upload session
        source: "curl -i -X POST \"https://upload.box.com/api/2.0/files/upload_sessions\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\" \\\n     -H \"content-type: application/json\" \\\n     -d '{\n       \"folder_id\": \"0\",\n       \"file_size\": 104857600,\n       \"file_name\": \"Contract.pdf\"\n     }'"
      - lang: dotnet
        label: Create upload session
        source: 'await client.ChunkedUploads.CreateFileUploadSessionAsync(requestBody: new CreateFileUploadSessionRequestBody(fileName: fileName, fileSize: (long)(fileSize), folderId: parentFolderId));'
      - lang: swift
        label: Create upload session
        source: 'try await client.chunkedUploads.createFileUploadSession(requestBody: CreateFileUploadSessionRequestBody(fileName: fileName, fileSize: Int64(fileSize), folderId: parentFolderId))'
      - lang: java
        label: Create upload session
        source: client.getChunkedUploads().createFileUploadSession(new CreateFileUploadSessionRequestBody(parentFolderId, fileSize, fileName))
      - lang: node
        label: Create upload session
        source: "await client.chunkedUploads.createFileUploadSession({\n  fileName: fileName,\n  fileSize: fileSize,\n  folderId: parentFolderId,\n} satisfies CreateFileUploadSessionRequestBody);"
      - lang: python
        label: Create upload session
        source: "client.chunked_uploads.create_file_upload_session(\n    parent_folder_id, file_size, file_name\n)"
  /files/{file_id}/upload_sessions:
    post:
      operationId: post_files_id_upload_sessions
      summary: Create upload session for existing file
      description: Creates an upload session for an existing file.
      parameters:
      - name: file_id
        in: path
        description: 'The unique identifier that represents a file.


          The ID for any file can be determined by visiting a file in the web application and copying the ID from the URL. For example, for the URL `https://*.app.box.com/files/123` the `file_id` is `123`.'
        required: true
        schema:
          type: string
        example: '12345'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file_size:
                  description: The total number of bytes of the file to be uploaded.
                  type: integer
                  format: int64
                  example: 104857600
                file_name:
                  description: The optional new name of new file.
                  type: string
                  example: Project.mov
              required:
              - file_size
      responses:
        '201':
          description: Returns a new upload session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '409':
          description: Returns an error if the file already exists, or if the account has run out of disk space.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: chunked_uploads
      servers:
      - url: https://upload.box.com/api/2.0
        description: Server for file uploads.
      tags:
      - Uploads (Chunked)
      x-codeSamples:
      - lang: curl
        label: Create upload session for existing file
        source: "curl -i -X POST \"https://upload.box.com/api/2.0/files/12345/upload_sessions\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\" \\\n     -H \"content-type: application/json\" \\\n     -d '{\n       \"file_size\": 104857600\n     }'"
      - lang: dotnet
        label: Create upload session for existing file
        source: 'await client.ChunkedUploads.CreateFileUploadSessionForExistingFileAsync(fileId: uploadedFile.Id, requestBody: new CreateFileUploadSessionForExistingFileRequestBody(fileSize: (long)(fileSize)));'
      - lang: swift
        label: Create upload session for existing file
        source: 'try await client.chunkedUploads.createFileUploadSessionForExistingFile(fileId: uploadedFile.id, requestBody: CreateFileUploadSessionForExistingFileRequestBody(fileSize: Int64(fileSize)))'
      - lang: java
        label: Create upload session for existing file
        source: client.getChunkedUploads().createFileUploadSessionForExistingFile(uploadedFile.getId(), new CreateFileUploadSessionForExistingFileRequestBody(fileSize))
      - lang: node
        label: Create upload session for existing file
        source: "await client.chunkedUploads.createFileUploadSessionForExistingFile(\n  uploadedFile.id,\n  {\n    fileSize: fileSize,\n  } satisfies CreateFileUploadSessionForExistingFileRequestBody,\n);"
      - lang: python
        label: Create upload session for existing file
        source: "client.chunked_uploads.create_file_upload_session_for_existing_file(\n    uploaded_file.id, file_size\n)"
  /files/upload_sessions/{upload_session_id}:
    get:
      operationId: get_files_upload_sessions_id
      summary: Get upload session
      description: 'Return information about an upload session.


        The actual endpoint URL is returned by the `Create upload session` endpoint.'
      parameters:
      - name: upload_session_id
        in: path
        description: The ID of the upload session.
        required: true
        schema:
          type: string
        example: D5E3F7A
      responses:
        '200':
          description: Returns an upload session object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: chunked_uploads
      servers:
      - url: https://{box-upload-server}/api/2.0
        description: Server for file uploads.
        variables:
          box-upload-server:
            description: The server for the upload session.
            default: upload.box.com
      tags:
      - Uploads (Chunked)
      x-box-enable-explorer: false
      x-codeSamples:
      - lang: curl
        label: Get upload session
        source: "curl -i -X GET \"https://upload.box.com/api/2.0/files/upload_sessions/F971964745A5CD0C001BBE4E58196BFD\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\""
      - lang: dotnet
        label: Get upload session
        source: 'await client.ChunkedUploads.GetFileUploadSessionByIdAsync(uploadSessionId: uploadSessionId);'
      - lang: swift
        label: Get upload session
        source: 'try await client.chunkedUploads.getFileUploadSessionById(uploadSessionId: uploadSessionId)'
      - lang: java
        label: Get upload session
        source: client.getChunkedUploads().getFileUploadSessionById(uploadSessionId)
      - lang: node
        label: Get upload session
        source: await client.chunkedUploads.getFileUploadSessionById(uploadSessionId);
      - lang: python
        label: Get upload session
        source: client.chunked_uploads.get_file_upload_session_by_id(upload_session_id)
    put:
      operationId: put_files_upload_sessions_id
      summary: Upload part of file
      description: 'Uploads a chunk of a file for an upload session.


        The actual endpoint URL is returned by the `Create upload session` and `Get upload session` endpoints.'
      parameters:
      - name: upload_session_id
        in: path
        description: The ID of the upload session.
        required: true
        schema:
          type: string
        example: D5E3F7A
      - name: digest
        in: header
        description: 'The [RFC3230][1] message digest of the chunk uploaded.


          `SHA-1` and `SHA-512` ([RFC5843][2]) are supported. The digest must be base64 encoded. The format of this header is as `sha=BASE64_ENCODED_DIGEST` for `SHA-1`, or `sha-512=BASE64_ENCODED_DIGEST` for `SHA-512`.


          To get the value for the digest, use the openSSL command to encode the file part: `openssl sha1 -binary <FILE_PART_NAME> | base64` for `SHA-1`, or `openssl sha512 -binary <FILE_PART_NAME> | base64` for `SHA-512`.


          [1]: https://tools.ietf.org/html/rfc3230

          [2]: https://tools.ietf.org/html/rfc5843'
        required: true
        schema:
          type: string
        example: sha=fpRyg5eVQletdZqEKaFlqwBXJzM=
      - name: content-range
        in: header
        description: 'The byte range of the chunk.


          Must not overlap with the range of a part already uploaded this session. Each part’s size must be exactly equal in size to the part size specified in the upload session that you created. One exception is the last part of the file, as this can be smaller.


          When providing the value for `content-range`, remember that:


          - The lower bound of each part''s byte range must be a multiple of the part size.

          - The higher bound must be a multiple of the part size - 1.'
        required: true
        schema:
          type: string
        example: bytes 8388608-16777215/445856194
      requestBody:
        content:
          application/octet-stream:
            schema:
              description: The binary content of the file.
              type: string
              format: binary
      responses:
        '200':
          description: 'Chunk has been uploaded successfully.


            The response always includes `sha512`. It also includes `sha1` if the `Digest` header used `SHA-1`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedPart'
        '409':
          description: Returns an error if the chunk conflicts with another chunk previously uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '412':
          description: Returns an error if a precondition was not met.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '416':
          description: Returns an error if the content range does not match a specified range for the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: chunked_uploads
      servers:
      - url: https://{box-upload-server}/api/2.0
        description: Server for file uploads.
        variables:
          box-upload-server:
            description: The server for the upload session.
            default: upload.box.com
      tags:
      - Uploads (Chunked)
      x-box-enable-explorer: false
      x-codeSamples:
      - lang: curl
        label: Upload part of file
        source: "curl -i -X PUT \"https://upload.box.com/api/2.0/files/upload_sessions/F971964745A5CD0C001BBE4E58196BFD\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\" \\\n     -H \"digest: sha=fpRyg5eVQletdZqEKaFlqwBXJzM=\" \\\n     -H \"content-range: bytes 8388608-16777215/445856194\" \\\n     -H \"content-type: application/octet-stream\" \\\n     --data-binary @<FILE_NAME>"
      - lang: dotnet
        label: Upload part of file
        source: 'await client.ChunkedUploads.UploadFilePartAsync(uploadSessionId: acc.UploadSessionId, requestBody: Utils.GenerateByteStreamFromBuffer(buffer: chunkBuffer), headers: new UploadFilePartHeaders(digest: digest, contentRange: contentRange));'
      - lang: swift
        label: Upload part of file
        source: 'try await client.chunkedUploads.uploadFilePart(uploadSessionId: acc.uploadSessionId, requestBody: Utils.generateByteStreamFromBuffer(buffer: chunkBuffer), headers: UploadFilePartHeaders(digest: digest, contentRange: contentRange))'
      - lang: java
        label: Upload part of file
        source: client.getChunkedUploads().uploadFilePart(acc.getUploadSessionId(), generateByteStreamFromBuffer(chunkBuffer), new UploadFilePartHeaders(digest, contentRange))
      - lang: node
        label: Upload part of file
        source: "await client.chunkedUploads.uploadFilePart(\n  acc.uploadSessionId,\n  generateByteStreamFromBuffer(chunkBuffer),\n  {\n    digest: digest,\n    contentRange: contentRange,\n  } satisfies UploadFilePartHeadersInput,\n);"
      - lang: python
        label: Upload part of file
        source: "client.chunked_uploads.upload_file_part(\n    acc.upload_session_id,\n    generate_byte_stream_from_buffer(chunk_buffer),\n    digest,\n    content_range,\n)"
    delete:
      operationId: delete_files_upload_sessions_id
      summary: Remove upload session
      description: 'Abort an upload session and discard all data uploaded.


        This cannot be reversed.


        The actual endpoint URL is returned by the `Create upload session` and `Get upload session` endpoints.'
      parameters:
      - name: upload_session_id
        in: path
        description: The ID of the upload session.
        required: true
        schema:
          type: string
        example: D5E3F7A
      responses:
        '204':
          description: A blank response is returned if the session was successfully aborted.
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: chunked_uploads
      servers:
      - url: https://{box-upload-server}/api/2.0
        description: Server for file uploads.
        variables:
          box-upload-server:
            description: The server for the upload session.
            default: upload.box.com
      tags:
      - Uploads (Chunked)
      x-box-enable-explorer: false
      x-codeSamples:
      - lang: curl
        label: Remove upload session
        source: "curl -i -X DELETE \"https://upload.box.com/api/2.0/files/upload_sessions/F971964745A5CD0C001BBE4E58196BFD\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\""
      - lang: dotnet
        label: Remove upload session
        source: 'await client.ChunkedUploads.DeleteFileUploadSessionByIdAsync(uploadSessionId: uploadSessionId);'
      - lang: swift
        label: Remove upload session
        source: 'try await client.chunkedUploads.deleteFileUploadSessionById(uploadSessionId: uploadSessionId)'
      - lang: java
        label: Remove upload session
        source: client.getChunkedUploads().deleteFileUploadSessionById(uploadSessionId)
      - lang: node
        label: Remove upload session
        source: await client.chunkedUploads.deleteFileUploadSessionById(uploadSessionId);
      - lang: python
        label: Remove upload session
        source: client.chunked_uploads.delete_file_upload_session_by_id(upload_session_id)
  /files/upload_sessions/{upload_session_id}/parts:
    get:
      operationId: get_files_upload_sessions_id_parts
      summary: List parts
      description: 'Return a list of the chunks uploaded to the upload session so far.


        The actual endpoint URL is returned by the `Create upload session` and `Get upload session` endpoints.'
      parameters:
      - name: upload_session_id
        in: path
        description: The ID of the upload session.
        required: true
        schema:
          type: string
        example: D5E3F7A
      - name: offset
        in: query
        description: 'The offset of the item at which to begin the response.


          Queries with offset parameter value exceeding 10000 will be rejected with a 400 response.'
        required: false
        schema:
          type: integer
          format: int64
          default: 0
        example: 1000
      - name: limit
        in: query
        description: The maximum number of items to return per page.
        required: false
        schema:
          type: integer
          format: int64
          maximum: 1000
        example: 1000
      responses:
        '200':
          description: 'Returns a list of parts that have been uploaded.


            Each part includes the hash type used to upload it. Parts uploaded with a `SHA-512` `Digest` header don''t include `sha1`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadParts'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: chunked_uploads
      servers:
      - url: https://{box-upload-server}/api/2.0
        description: Server for file uploads.
        variables:
          box-upload-server:
            description: The server for the upload session.
            default: upload.box.com
      tags:
      - Uploads (Chunked)
      x-box-enable-explorer: false
      x-codeSamples:
      - lang: curl
        label: List parts
        source: "curl -i -X GET \"https://upload.box.com/api/2.0/files/upload_sessions/F971964745A5CD0C001BBE4E58196BFD/parts\" \\\n     -H \"authorization: Bearer <ACCESS_TOKEN>\""
      - lang: dotnet
        label: List parts
        source: 'await client.ChunkedUploads.GetFileUploadSessionPartsAsync(uploadSessionId: uploadSessionId);'
      - lang: swift
        label: List parts
        source: 'try await client.chunkedUploads.getFileUploadSessionParts(uploadSessionId: uploadSessionId)'
      - lang: java
        label: List parts
        source: client.getChunkedUploads().getFileUploadSessionParts(uploadSessionId)
      - lang: node
        label: List parts
        source: await client.chunkedUploads.getFileUploadSessionParts(uploadSessionId);
      - lang: python
        label: List parts
        source: client.chunked_uploads.get_file_upload_session_parts(upload_session_id)
  /files/upload_sessions/{upload_session_id}/plan:
    post:
      operationId: post_files_upload_sessions_id_plan
      summary: Plan upload session
      description: 'Plan an upload session by checking which parts already exist on the server. This endpoint allows clients to optimize uploads by skipping parts that have already been uploaded (cache hits) and only uploading missing parts.


        The actual endpoint URL is returned by the `Create upload session` and `Get upload session` endpoints.'
      parameters:
      - name: upload_session_id
        in: path
        description: The ID of the upload session.
        required: true
        schema:
          type: string
        example: D5E3F7A
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadSessionPlanRequest'
      responses:
        '200':
          description: Returns information about which parts already exist (hits) and which parts need to be uploaded (misses).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionPlanResponse'
        '404':
          description: Returns an error if the upload session cannot be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: chunked_uploads
      servers:
      - url: https://{box-upload-server}/api/2.0
        description: Server for file uploads.
        variables:
          box-upload-server:
            description: The server for the upload session.
            default: upload.box.com
      tags:
      - Uploads (Chunked)
      x-box-enable-explorer: false
      x-codeSamples:
      - lang: dotnet
        label: Plan upload session
        source: 'await client.ChunkedUploads.CreateFileUploadSessionPlanByUrlAsync(url: planUrl, requestBody: new UploadSessionPlanRequest(parts: parts));'
      - lang: swift
        label: Plan upload session
        source: 'try await client.chunkedUploads.createFileUploadSessionPlanByUrl(url: planUrl, requestBody: UploadSessionPlanRequest(parts: parts))'
      - lang: java
        label: Plan upload session
        source: client.getChunkedUploads().createFileUploadSessionPlanByUrl(planUrl, new UploadSessionPlanRequest(parts))
      - lang: node
        label: Plan upload session
        source: "await client.chunkedUploads.createFileUploadSessionPlanByUrl(planUrl, {\n  parts: parts,\n} satisfies UploadSessionPlanRequest);"
      - lang: python
        label: Plan upload session
        source: client.chunked_uploads.create_file_upload_session_plan_by_url(plan_url, parts)
  /files/upload_sessions/{upload_session_id}/commit:
    post:
      operationId: post_files_upload_sessions_id_commit
      summary: Commit upload session
      description: 'Close an upload session and create a file from the uploaded chunks.


        The actual endpoint URL is returned by the `Create upload session` and `Get upload session` endpoints.'
      parameters:
      - name: upload_session_id
        in: path
        description: The ID of the upload session.
        required: true
        schema:
          type: string
        example: D5E3F7A
      - name: digest
        in: header
        description: 'The [RFC3230][1] message digest of the whole file.


          Only SHA1 is supported. The SHA1 digest must be Base64 encoded. The format of this header is as `sha=BASE64_ENCODED_DIGEST`.


          `SHA-512` is not supported for the whole-file digest, even if the parts were uploaded with `SHA-512` digests.


          [1]: https://tools.ietf.org/html/rfc3230'
        required: true
        schema:
          type: string
        example: sha=fpRyg5eVQletdZqEKaFlqwBXJzM=
      - name: if-match
        in: header
        description: 'Ensures this item hasn''t recently changed before making changes.


          Pass in the item''s last observed `etag` value into this header and the endpoint will fail with a `412 Precondition Failed` if it has changed since.'
        required: false
        schema:
          type: string
        example: '1'
      - name: if-none-match
        in: header
        description: 'Ensures an item is only returned if it has changed.


          Pass in the item''s last observed `etag` value into this header and the endpoint will fail with a `304 Not Modified` if the item has not changed since.'
        required: false
        schema:
          type: string
        example: '1'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parts:
                  description: 'The list details for the uploaded parts.


                    Each entry can include `sha1` or `sha512`. Include `sha512` on every entry or on none of them. A request where only some entries include `sha512` is rejected.


                    Include parts that the server already has, returned as `hits` by the [`Plan upload session`](/reference/post-files-upload-sessions-id-plan) endpoint. Use the `part_id`, `offset`, and `size` from the plan response. If the other entries include `sha512`, include the `sha512` value from the plan response. Otherwise, leave the hash out of these entries.'
                  type: array
                  items:
                    $ref: '#/components/schemas/UploadPart'
              required:
              - parts
      responses:
        '201':
          description: Returns the file object in a list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Files'
        '202':
          description: 'Returns when all chunks have been uploaded but not yet processed.


            Inspect the upload session to get more information about the progress of processing the chunks, then retry committing the file when all chunks have processed.'
          headers:
            Retry-After:
              description: Indicates the number of seconds the client should wait before attempting their commit request again.
              schema:
                type: integer
        '400':
          description: 'Returns an error if the request body is not valid.


            - `invalid_parts_field` - Only some entries in `parts` include `sha512`. Include `sha512` on every entry or on none of them.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '409':
          description: Returns an error if there is already a file with the same name in the target folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        '412':
          description: Returns an error if the `If-Match` or `If-None-Match` conditions fail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
        default:
          description: An unexpected client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientError'
      x-box-tag: chunked_uploads
