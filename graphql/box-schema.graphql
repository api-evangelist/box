}

type ReadySignLink {
  url: String
  name: String
  instructions: String
  folderId: String
  isNotificationDisabled: Boolean
  isActive: Boolean
}

type CustomBranding {
  companyName: String
  logoUri: String
  brandingColor: String
  emailFooterText: String
}

