# ──────────────────────────────────────────────
# Root Query Type
# ──────────────────────────────────────────────

type Query {
  # Files
  file(id: ID!): File
  fileVersions(fileId: ID!): [FileVersion!]
  fileVersion(fileId: ID!, versionId: ID!): FileVersion
  fileRequest(id: ID!): FileRequest
  downloadFile(fileId: ID!): String

  # Folders
  folder(id: ID!): Folder
  folderItems(id: ID!, limit: Int, offset: Int): FolderItemsPage
  folderLocks(folderId: ID!): [FolderLock!]
  rootFolder: Folder
  trashedFolder(id: ID!): Folder
  trashedFolderItems(limit: Int, offset: Int): FolderItemsPage

  # Web Links
  webLink(id: ID!): WebLink
  trashedWebLink(id: ID!): WebLink

  # Users
  currentUser: User
  user(id: ID!): User
  users(filterTerm: String, userType: String, externalAppUserId: String, limit: Int, offset: Int): [User!]
  userEmailAliases(userId: ID!): [EmailAlias!]
  userAvatar(userId: ID!): Avatar

  # Groups
  group(id: ID!): Group
  groups(limit: Int, offset: Int): [Group!]
  groupMemberships(groupId: ID!, limit: Int, offset: Int): [GroupMembership!]
  userGroupMemberships(userId: ID!, limit: Int, offset: Int): [GroupMembership!]
  groupCollaborations(groupId: ID!, limit: Int, offset: Int): [Collaboration!]

  # Collaborations
  collaboration(id: ID!): Collaboration
  fileCollaborations(fileId: ID!, limit: Int, offset: Int): [Collaboration!]
  folderCollaborations(folderId: ID!, limit: Int, offset: Int): [Collaboration!]
  pendingCollaborations(limit: Int, offset: Int): [Collaboration!]
  collaborationAllowlistEntries(limit: Int, marker: String): [CollaborationAllowlistEntry!]
  collaborationAllowlistExemptTargets(limit: Int, marker: String): [CollaborationAllowlistExemptTarget!]

  # Metadata
  fileMetadata(fileId: ID!, scope: String!, templateKey: String!): Metadata
  folderMetadata(folderId: ID!, scope: String!, templateKey: String!): Metadata
  metadataTemplate(scope: String!, templateKey: String!): MetadataTemplate
  metadataTemplates(scope: String!, limit: Int, marker: String): [MetadataTemplate!]
  enterpriseMetadataTemplates(limit: Int, marker: String): [MetadataTemplate!]
  metadataCascadePolicies(folderId: ID!, limit: Int, marker: String): [MetadataCascadePolicy!]

  # Shared Links
  sharedItemByLink(sharedLinkUrl: String!): FolderItem
  fileSharedLink(fileId: ID!): File
  folderSharedLink(folderId: ID!): Folder
  webLinkSharedLink(webLinkId: ID!): WebLink

  # Comments
  comment(id: ID!): Comment
  fileComments(fileId: ID!, limit: Int, offset: Int): [Comment!]

  # Tasks
  task(id: ID!): Task
  fileTasks(fileId: ID!): [Task!]
  taskAssignment(id: ID!): TaskAssignment
  taskAssignments(taskId: ID!): [TaskAssignment!]

  # Events
  events(streamType: String, streamPosition: String, limit: Int): EventStream
  enterpriseEvents(streamType: String, createdAfter: DateTime, createdBefore: DateTime, limit: Int, nextStreamPosition: String): EventStream

  # Collections
  collections: [Collection!]
  collectionItems(collectionId: ID!, limit: Int, offset: Int): CollectionItem

  # Recent Items
  recentItems(limit: Int, fields: [String!]): [FolderItem!]

  # Search
  search(query: String!, options: SearchOptions): SearchResult

  # Retention Policies
  retentionPolicy(id: ID!): RetentionPolicy
  retentionPolicies(policyName: String, policyType: String, createdByUserId: ID, limit: Int, marker: String): [RetentionPolicy!]
  retentionPolicyAssignment(id: ID!): RetentionPolicyAssignment
  retentionPolicyAssignments(retentionPolicyId: ID!, type: String, limit: Int, marker: String): [RetentionPolicyAssignment!]

  # Legal Holds
  legalHoldPolicy(id: ID!): LegalHoldPolicy
  legalHoldPolicies(policyName: String, limit: Int, marker: String): [LegalHoldPolicy!]
  legalHoldAssignment(id: ID!): LegalHoldAssignment
  legalHoldAssignments(legalHoldPolicyId: ID!, type: String, limit: Int, marker: String): [LegalHoldAssignment!]
  fileVersionLegalHold(id: ID!): LegalHold
  fileVersionLegalHolds(policyId: ID!, limit: Int, marker: String): [LegalHold!]
  fileVersionRetentions(limit: Int, marker: String, fileId: ID, fileVersionId: ID, policyId: ID): [FileVersion!]

  # Sign Requests
  signRequest(id: ID!): SignRequest
  signRequests(limit: Int, marker: String): [SignRequest!]
  signTemplate(id: ID!): Template
  signTemplates(limit: Int, marker: String): [Template!]

  # Webhooks
  webhook(id: ID!): Webhook
  webhooks(limit: Int, marker: String): [Webhook!]

  # Storage Policies
  storagePolicy(id: ID!): StoragePolicy
  storagePolicies(limit: Int, marker: String): [StoragePolicy!]
  storagePolicyAssignment(id: ID!): StoragePolicyAssignment
  storagePolicyAssignments(resolvedForType: String!, resolvedForId: ID!): [StoragePolicyAssignment!]

  # Terms of Service
  termsOfService(id: ID!): TermsOfService
  enterpriseTermsOfServices(tosType: String): [TermsOfService!]
  termsOfServiceUserStatus(tosId: ID!, userId: ID): TermsOfServiceAcceptance

  # Device Pins
  devicePin(id: ID!): DevicePin
  enterpriseDevicePins(limit: Int, marker: String, direction: String): [DevicePin!]

  # Shield / Info Barriers
  informationBarrier(id: ID!): InformationBarrier
  informationBarriers(limit: Int, marker: String): [InformationBarrier!]
  informationBarrierSegment(id: ID!): InformationBarrierSegment
  informationBarrierSegments(informationBarrierId: ID!, limit: Int, marker: String): [InformationBarrierSegment!]

  # Invites
  invite(id: ID!): Invite

  # Skills / Classifications
  classifications(scope: String): [Classification!]
}

input SearchOptions {
  scope: String
  fileExtensions: [String!]
  ancestorFolderIds: [ID!]
  ownerUserIds: [ID!]
  recentUpdaterUserIds: [ID!]
  contentTypes: [String!]
  type: String
  trashContent: String
  sort: String
  direction: String
  limit: Int
  offset: Int
  fields: [String!]
}

# ──────────────────────────────────────────────
# Root Mutation Type
# ──────────────────────────────────────────────

type Mutation {
  # Files
  copyFile(fileId: ID!, parentId: ID!, name: String, version: String): File
  updateFile(id: ID!, name: String, description: String, tags: [String!], parentId: ID!): File
  deleteFile(id: ID!, etag: String): Boolean
  lockFile(fileId: ID!, expiredAt: DateTime, isDownloadPrevented: Boolean): FileLock
  unlockFile(fileId: ID!): Boolean
  createFileRequest(folderId: ID!, title: String, description: String, isDescriptionRequired: Boolean, isEmailRequired: Boolean, expiresAt: DateTime): FileRequest
  updateFileRequest(id: ID!, title: String, description: String, status: String, isDescriptionRequired: Boolean, isEmailRequired: Boolean, expiresAt: DateTime): FileRequest
  deleteFileRequest(id: ID!): Boolean
  applyWatermarkToFile(fileId: ID!): Watermark
  removeWatermarkFromFile(fileId: ID!): Boolean
  addFileToCollection(fileId: ID!, collectionId: ID!): File
  removeFileFromCollection(fileId: ID!, collectionId: ID!): File
  createFileSharedLink(fileId: ID!, settings: SharedLinkSettingsInput): File
  removeFileSharedLink(fileId: ID!): File

  # Folders
  createFolder(name: String!, parentId: ID!): Folder
  copyFolder(folderId: ID!, parentId: ID!, name: String): Folder
  updateFolder(id: ID!, name: String, description: String, parentId: ID!, tags: [String!]): Folder
  deleteFolder(id: ID!, recursive: Boolean): Boolean
  createFolderLock(folderId: ID!): FolderLock
  deleteFolderLock(id: ID!): Boolean
  applyWatermarkToFolder(folderId: ID!): Watermark
  removeWatermarkFromFolder(folderId: ID!): Boolean
  createFolderSharedLink(folderId: ID!, settings: SharedLinkSettingsInput): Folder
  removeFolderSharedLink(folderId: ID!): Folder

  # Web Links
  createWebLink(url: String!, parentId: ID!, name: String, description: String): WebLink
  updateWebLink(id: ID!, url: String, parentId: ID!, name: String, description: String): WebLink
  deleteWebLink(id: ID!): Boolean
  createWebLinkSharedLink(webLinkId: ID!, settings: SharedLinkSettingsInput): WebLink
  removeWebLinkSharedLink(webLinkId: ID!): WebLink

  # Metadata
  createFileMetadata(fileId: ID!, scope: String!, templateKey: String!, fields: JSON!): Metadata
  updateFileMetadata(fileId: ID!, scope: String!, templateKey: String!, updates: [FileMetadataUpdateInput!]!): Metadata
  deleteFileMetadata(fileId: ID!, scope: String!, templateKey: String!): Boolean
  createFolderMetadata(folderId: ID!, scope: String!, templateKey: String!, fields: JSON!): Metadata
  updateFolderMetadata(folderId: ID!, scope: String!, templateKey: String!, updates: [FileMetadataUpdateInput!]!): Metadata
  deleteFolderMetadata(folderId: ID!, scope: String!, templateKey: String!): Boolean
  createMetadataTemplate(scope: String!, templateKey: String!, displayName: String!, hidden: Boolean, fields: [MetadataFieldInput!]!): MetadataTemplate
  updateMetadataTemplate(scope: String!, templateKey: String!, updates: [JSON!]!): MetadataTemplate
  deleteMetadataTemplate(scope: String!, templateKey: String!): Boolean
  createMetadataCascadePolicy(folderId: ID!, scope: String!, templateKey: String!): MetadataCascadePolicy
  deleteMetadataCascadePolicy(id: ID!): Boolean
  applyMetadataCascadePolicy(id: ID!, conflictResolution: String!): Boolean

  # Collaborations
  createCollaboration(itemId: ID!, itemType: String!, accessibleById: ID, accessibleByType: String, inviteEmail: String, role: CollaborationRole!, expiresAt: DateTime): Collaboration
  updateCollaboration(id: ID!, role: CollaborationRole!, status: CollaborationStatus, expiresAt: DateTime): Collaboration
  deleteCollaboration(id: ID!): Boolean
  acceptCollaboration(id: ID!): Collaboration
  addCollaborationAllowlistEntry(domain: String!, direction: String!): CollaborationAllowlistEntry
  deleteCollaborationAllowlistEntry(id: ID!): Boolean
  addCollaborationAllowlistExemptTarget(userId: ID!): CollaborationAllowlistExemptTarget
  deleteCollaborationAllowlistExemptTarget(id: ID!): Boolean

  # Users
  createUser(name: String!, login: String, isPlatformAccessOnly: Boolean, role: String, language: String, timezone: String, spaceAmount: Float, trackingCodes: [TrackingCodeInput!], canSeeManagedUsers: Boolean, isSyncEnabled: Boolean, isExternalCollabRestricted: Boolean, isExemptFromDeviceLimits: Boolean, isExemptFromLoginVerification: Boolean, jobTitle: String, phone: String, address: String, status: UserStatus): User
  updateUser(id: ID!, name: String, role: String, language: String, timezone: String, spaceAmount: Float, trackingCodes: [TrackingCodeInput!], isSyncEnabled: Boolean, isExternalCollabRestricted: Boolean, isExemptFromDeviceLimits: Boolean, isExemptFromLoginVerification: Boolean, jobTitle: String, phone: String, address: String, status: UserStatus, login: String): User
  deleteUser(id: ID!, notify: Boolean, force: Boolean): Boolean
  addEmailAlias(userId: ID!, email: String!): EmailAlias
  removeEmailAlias(userId: ID!, aliasId: ID!): Boolean
  transferUserContent(sourceUserId: ID!, destUserId: ID!): Folder
  deleteUserAvatar(userId: ID!): Boolean

  # Groups
  createGroup(name: String!, provenance: String, externalSyncIdentifier: String, description: String, invitabilityLevel: String, memberViewabilityLevel: String): Group
  updateGroup(id: ID!, name: String, provenance: String, externalSyncIdentifier: String, description: String, invitabilityLevel: String, memberViewabilityLevel: String): Group
  deleteGroup(id: ID!): Boolean
  addGroupMembership(userId: ID!, groupId: ID!, role: GroupRole): GroupMembership
  updateGroupMembership(id: ID!, role: GroupRole!): GroupMembership
  deleteGroupMembership(id: ID!): Boolean

  # Invites
  inviteUser(enterpriseId: ID!, login: String!): Invite

  # Comments
  createComment(fileId: ID!, message: String!, taggedMessage: String): Comment
  updateComment(id: ID!, message: String!): Comment
  deleteComment(id: ID!): Boolean

  # Tasks
  createTask(fileId: ID!, action: TaskAction!, message: String, dueAt: DateTime, completionRule: String): Task
  updateTask(id: ID!, action: TaskAction, message: String, dueAt: DateTime, completionRule: String): Task
  deleteTask(id: ID!): Boolean
  createTaskAssignment(taskId: ID!, userId: ID): TaskAssignment
  updateTaskAssignment(id: ID!, resolutionState: TaskAssignmentStatus!, message: String): TaskAssignment
  deleteTaskAssignment(id: ID!): Boolean

  # Webhooks
  createWebhook(targetId: ID!, targetType: String!, address: String!, triggers: [WebhookTrigger!]!): Webhook
  updateWebhook(id: ID!, address: String, triggers: [WebhookTrigger!]): Webhook
  deleteWebhook(id: ID!): Boolean

  # Sign Requests
  createSignRequest(signers: [SignRequestSignerInput!]!, sourceFiles: [SignFileInput!]!, parentFolderId: ID!, isDocumentPreparationNeeded: Boolean, emailSubject: String, emailMessage: String, redirectUrl: String, declinedRedirectUrl: String, daysValid: Int, externalId: String, prefillTags: [SignPrefillTagInput!]): SignRequest
  cancelSignRequest(id: ID!): SignRequest
  resendSignRequest(id: ID!): Boolean

  # Retention Policies
  createRetentionPolicy(policyName: String!, policyType: RetentionPolicyType!, dispositionAction: RetentionPolicyDispositionAction!, retentionLength: Int, canOwnerExtendRetention: Boolean, areOwnersNotified: Boolean, description: String): RetentionPolicy
  updateRetentionPolicy(id: ID!, policyName: String, status: String, dispositionAction: RetentionPolicyDispositionAction, retentionLength: Int, description: String): RetentionPolicy
  deleteRetentionPolicy(id: ID!): Boolean
  createRetentionPolicyAssignment(policyId: ID!, assignToId: ID!, assignToType: String!, filterFields: [MetadataFilterInput!], startDateField: String): RetentionPolicyAssignment
  deleteRetentionPolicyAssignment(id: ID!): Boolean

  # Legal Holds
  createLegalHoldPolicy(policyName: String!, description: String, filterStartedAt: DateTime, filterEndedAt: DateTime, isOngoing: Boolean): LegalHoldPolicy
  updateLegalHoldPolicy(id: ID!, policyName: String, description: String, releaseNotes: String): LegalHoldPolicy
  deleteLegalHoldPolicy(id: ID!): Boolean
  createLegalHoldAssignment(policyId: ID!, assignToId: ID!, assignToType: String!): LegalHoldAssignment
  deleteLegalHoldAssignment(id: ID!): Boolean

  # Terms of Service
  createTermsOfService(status: TermsOfServiceStatus!, tosType: TermsOfServiceType!, text: String!): TermsOfService
  updateTermsOfService(id: ID!, status: TermsOfServiceStatus!, text: String!): TermsOfService
  createTermsOfServiceAcceptance(tosId: ID!, userId: ID!, isAccepted: Boolean!): TermsOfServiceAcceptance
  updateTermsOfServiceAcceptance(id: ID!, isAccepted: Boolean!): TermsOfServiceAcceptance

  # Storage Policies
  createStoragePolicyAssignment(policyId: ID!, userId: ID!): StoragePolicyAssignment
  updateStoragePolicyAssignment(id: ID!, policyId: ID!): StoragePolicyAssignment

  # Device Pins
  deleteDevicePin(id: ID!): Boolean

  # Classifications
  addClassificationToFile(fileId: ID!, name: String!): Metadata
  updateClassificationOnFile(fileId: ID!, name: String!): Metadata
  deleteClassificationFromFile(fileId: ID!): Boolean
  addClassificationToFolder(folderId: ID!, name: String!): Metadata
  updateClassificationOnFolder(folderId: ID!, name: String!): Metadata
  deleteClassificationFromFolder(folderId: ID!): Boolean
}

