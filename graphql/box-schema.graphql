"""
Box Platform GraphQL Schema
Conceptual schema derived from the Box REST API v2 surface.
Reference: https://developer.box.com/reference/
"""

# ──────────────────────────────────────────────
# Scalars
# ──────────────────────────────────────────────

scalar DateTime
scalar JSON
scalar Upload

# ──────────────────────────────────────────────
# Enums
# ──────────────────────────────────────────────

enum AccessLevel {
  OPEN
  COLLABORATORS
  COMPANY
}

enum CollaborationRole {
  EDITOR
  VIEWER
  PREVIEWER
  UPLOADER
  PREVIEWER_UPLOADER
  VIEWER_UPLOADER
  CO_OWNER
  OWNER
}

enum CollaborationStatus {
  ACCEPTED
  PENDING
  REJECTED
}

enum TaskAction {
  REVIEW
  COMPLETE
}

enum TaskResolution {
  COMPLETE
  INCOMPLETE
  APPROVED
  REJECTED
}

enum TaskAssignmentStatus {
  COMPLETED
  INCOMPLETE
  APPROVED
  REJECTED
}

enum RetentionPolicyType {
  FINITE
  INDEFINITE
}

enum RetentionPolicyDispositionAction {
  PERMANENTLY_DELETE
  REMOVE_RETENTION
}

enum SignRequestStatus {
  CONVERTING
  CREATED
  SENT
  VIEWED
  SIGNED
  CANCELLED
  DECLINED
  ERROR_CONVERTING
  ERROR_SENDING
  EXPIRED
  DOWNLOADED
  SIGNED_AND_DOWNLOADED
}

enum SignRequestSignerRole {
  SIGNER
  APPROVER
  FINAL_COPY_READER
}

enum WebhookTrigger {
  FILE_UPLOADED
  FILE_PREVIEWED
  FILE_DOWNLOADED
  FILE_TRASHED
  FILE_DELETED
  FILE_RESTORED
  FILE_COPIED
  FILE_MOVED
  FILE_LOCKED
  FILE_UNLOCKED
  FILE_RENAMED
  COMMENT_CREATED
  COMMENT_UPDATED
  COMMENT_DELETED
  TASK_ASSIGNMENT_CREATED
  TASK_ASSIGNMENT_UPDATED
  METADATA_INSTANCE_CREATED
  METADATA_INSTANCE_UPDATED
  METADATA_INSTANCE_DELETED
  FOLDER_CREATED
  FOLDER_RENAMED
  FOLDER_DOWNLOADED
  FOLDER_RESTORED
  FOLDER_DELETED
  FOLDER_COPIED
  FOLDER_MOVED
  FOLDER_TRASHED
  COLLABORATION_CREATED
  COLLABORATION_ACCEPTED
  COLLABORATION_REJECTED
  COLLABORATION_REMOVED
  COLLABORATION_UPDATED
  SHARED_LINK_DELETED
  SHARED_LINK_CREATED
  SHARED_LINK_UPDATED
  SIGN_REQUEST_COMPLETED
  SIGN_REQUEST_DECLINED
  SIGN_REQUEST_EXPIRED
}

enum UserStatus {
  ACTIVE
  INACTIVE
  CANNOT_DELETE_EDIT
  CANNOT_DELETE_EDIT_UPLOAD
}

enum GroupRole {
  ADMIN
  MEMBER
}

enum MetadataFieldType {
  STRING
  FLOAT
  DATE
  ENUM
  MULTISELECT
}

enum EventType {
  ITEM_CREATE
  ITEM_UPLOAD
  ITEM_MOVE
  ITEM_COPY
  ITEM_TRASH
  ITEM_DELETE
  ITEM_RESTORE
  ITEM_RENAME
  ITEM_MAKE_CURRENT_VERSION
  ITEM_DOWNLOAD
  ITEM_PREVIEW
  ITEM_LOCK
  ITEM_UNLOCK
  ITEM_SHARED_CREATE
  ITEM_SHARED_UPDATE
  ITEM_SHARED
  COLLABORATION_CREATED
  COLLABORATION_ACCEPTED
  COLLABORATION_REMOVED
  LOGIN
  FAILED_LOGIN
  CHANGE_LOGIN
}

enum TermsOfServiceType {
  MANAGED
  EXTERNAL
}

enum TermsOfServiceStatus {
  ENABLED
  DISABLED
}

enum LegalHoldPolicyStatus {
  ACTIVE
  APPLYING
  RELEASING
  RELEASED
}

# ──────────────────────────────────────────────
# Core Content Types
# ──────────────────────────────────────────────

type File {
  id: ID!
  type: String!
  name: String!
  description: String
  size: Int!
  createdAt: DateTime!
  modifiedAt: DateTime!
  contentCreatedAt: DateTime
  contentModifiedAt: DateTime
  sha1: String
  etag: String
  sequenceId: String
  parent: Folder
  createdBy: User
  modifiedBy: User
  ownedBy: User
  sharedLink: SharedLink
  permissions: Permission
  tags: [String!]
  lock: FileLock
  extension: String
  isPackage: Boolean
  versionNumber: String
  commentCount: Int
  watermarkInfo: WatermarkInfo
  hasCollaborations: Boolean
  isExternallyOwned: Boolean
  allowedInviteeRoles: [CollaborationRole!]
  allowedSharedLinkAccessLevels: [AccessLevel!]
  currentVersion: FileVersion
  versions: [FileVersion!]
  comments: [Comment!]
  tasks: [Task!]
  metadata: [Metadata!]
  collaborations: [Collaboration!]
  classifications: [Classification!]
}

type FileVersion {
  id: ID!
  type: String!
  sha1: String!
  name: String!
  size: Int!
  createdAt: DateTime!
  modifiedAt: DateTime!
  modifiedBy: User
  trashedAt: DateTime
  trashedBy: User
  restoredAt: DateTime
  restoredBy: User
  purgedAt: DateTime
  uploaderDisplayName: String
  versionNumber: String
}

type FileRequest {
  id: ID!
  type: String!
  title: String
  description: String
  status: String!
  isDescriptionRequired: Boolean!
  isEmailRequired: Boolean!
  folder: Folder!
  url: String
  etag: String
  createdBy: User
  createdAt: DateTime!
  updatedAt: DateTime!
  expiresAt: DateTime
}

type FileLock {
  id: ID!
  type: String!
  createdBy: User
  createdAt: DateTime!
  expiredAt: DateTime
  isDownloadPrevented: Boolean!
}

type Folder {
  id: ID!
  type: String!
  name: String!
  description: String
  size: Int!
  createdAt: DateTime!
  modifiedAt: DateTime!
  contentCreatedAt: DateTime
  contentModifiedAt: DateTime
  etag: String
  sequenceId: String
  parent: Folder
  createdBy: User
  modifiedBy: User
  ownedBy: User
  sharedLink: SharedLink
  permissions: Permission
  tags: [String!]
  hasCollaborations: Boolean
  isExternallyOwned: Boolean
  allowedSharedLinkAccessLevels: [AccessLevel!]
  allowedInviteeRoles: [CollaborationRole!]
  syncState: String
  watermarkInfo: WatermarkInfo
  isCollaborationRestrictedToEnterprise: Boolean
  metadata: [Metadata!]
  collaborations: [Collaboration!]
  items: FolderItemsPage
  locks: [FolderLock!]
}

type FolderItemsPage {
  totalCount: Int!
  limit: Int!
  offset: Int!
  order: [SortOrder!]
  entries: [FolderItem!]!
}

union FolderItem = File | Folder | WebLink

type FolderLock {
  id: ID!
  type: String!
  folder: Folder!
  createdBy: User
  createdAt: DateTime!
  lockedOperations: LockedOperations!
  lockType: String!
}

type LockedOperations {
  move: Boolean!
  delete: Boolean!
}

type SortOrder {
  by: String!
  direction: String!
}

type WatermarkInfo {
  isWatermarked: Boolean!
}

type Watermark {
  watermark: WatermarkDetails!
}

type WatermarkDetails {
  createdAt: DateTime!
  modifiedAt: DateTime!
}

type WebLink {
  id: ID!
  type: String!
  name: String!
  description: String
  url: String!
  createdAt: DateTime!
  modifiedAt: DateTime!
  etag: String
  sequenceId: String
  parent: Folder
  createdBy: User
  modifiedBy: User
  ownedBy: User
  sharedLink: SharedLink
  permissions: Permission
  pathCollection: PathCollection
  trashedAt: DateTime
  purgedAt: DateTime
  itemStatus: String
}

type PathCollection {
  totalCount: Int!
  entries: [Folder!]!
}

# ──────────────────────────────────────────────
# Collaboration & Permissions
# ──────────────────────────────────────────────

type Collaboration {
  id: ID!
  type: String!
  item: CollaborationItem
  accessibleBy: CollaborationAccessible
  inviteEmail: String
  role: CollaborationRole!
  expiresAt: DateTime
  status: CollaborationStatus!
  acknowledgedAt: DateTime
  createdBy: User
  createdAt: DateTime!
  modifiedAt: DateTime!
  acceptanceRequirementsStatus: AcceptanceRequirementsStatus
}

union CollaborationItem = File | Folder | WebLink
union CollaborationAccessible = User | Group

type AcceptanceRequirementsStatus {
  termsOfServiceRequired: TermsOfServiceAcceptanceStatus
  strongPasswordRequired: StrongPasswordStatus
  twoFactorAuthRequired: TwoFactorAuthStatus
}

type TermsOfServiceAcceptanceStatus {
  isAccepted: Boolean
}

type StrongPasswordStatus {
  isRequired: Boolean
}

type TwoFactorAuthStatus {
  isRequired: Boolean
}

type CollaborationAllowlistEntry {
  id: ID!
  type: String!
  domain: String!
  direction: String!
  enterprise: Enterprise
  createdAt: DateTime!
  modifiedAt: DateTime!
}

type CollaborationAllowlistExemptTarget {
  id: ID!
  type: String!
  enterprise: Enterprise
  user: User!
  createdAt: DateTime!
  modifiedAt: DateTime!
}

type Permission {
  canDelete: Boolean!
  canDownload: Boolean!
  canInviteCollaborator: Boolean!
  canRename: Boolean!
  canSetShareAccess: Boolean!
  canShare: Boolean!
  canUpload: Boolean
  canAnnotate: Boolean
  canComment: Boolean
  canPreview: Boolean
  canViewAnnotationsAll: Boolean
  canViewAnnotationsResolved: Boolean
}

# ──────────────────────────────────────────────
# Users & Identity
# ──────────────────────────────────────────────

type User {
  id: ID!
  type: String!
  name: String!
  login: String!
  createdAt: DateTime!
  modifiedAt: DateTime!
  role: String
  language: String
  timezone: String
  spaceAmount: Float
  spaceUsed: Float
  maxUploadSize: Float
  status: UserStatus
  jobTitle: String
  phone: String
  address: String
  avatarUrl: String
  isExternalCollabRestricted: Boolean
  isExemptFromDeviceLimits: Boolean
  isExemptFromLoginVerification: Boolean
  isPlatformAccessOnly: Boolean
  isSyncEnabled: Boolean
  enterprise: Enterprise
  myTags: [String!]
  hostname: String
  trackingCodes: [TrackingCode!]
  emailAliases: [EmailAlias!]
  groups: [GroupMembership!]
  avatar: Avatar
  devicePins: [DevicePin!]
}

type UserProfile {
  id: ID!
  name: String!
  login: String!
  avatarUrl: String
  jobTitle: String
  phone: String
  address: String
  spaceUsed: Float
  spaceAmount: Float
  status: UserStatus
}

type TrackingCode {
  type: String!
  name: String!
  value: String!
}

type EmailAlias {
  id: ID!
  type: String!
  email: String!
  isConfirmed: Boolean!
}

type Avatar {
  picUrls: AvatarUrls!
}

type AvatarUrls {
  small: String
  large: String
  preview: String
}

type Enterprise {
  id: ID!
  type: String!
  name: String!
}

type Invite {
  id: ID!
  type: String!
  invitedTo: Enterprise
  actionedByUser: User
  invitedEmail: String!
  createdAt: DateTime!
  modifiedAt: DateTime!
  status: String!
}

# ──────────────────────────────────────────────
# Groups
# ──────────────────────────────────────────────

type Group {
  id: ID!
  type: String!
  name: String!
  groupType: String
  createdAt: DateTime!
  modifiedAt: DateTime!
  description: String
  externalSyncIdentifier: String
  provenance: String
  invitabilityLevel: String
  memberViewabilityLevel: String
  permissions: GroupPermissions
  memberships: [GroupMembership!]
  collaborations: [Collaboration!]
}

type GroupPermissions {
  canInviteAsCollaborator: Boolean!
}

type GroupMembership {
  id: ID!
  type: String!
  user: User!
  group: Group!
  role: GroupRole!
  createdAt: DateTime!
  modifiedAt: DateTime!
}

# ──────────────────────────────────────────────
# Metadata
# ──────────────────────────────────────────────

type Metadata {
  id: ID
  type: String
  scope: String!
  templateKey: String!
  parent: MetadataParent
  fields: JSON
  createdAt: DateTime
  modifiedAt: DateTime
  version: Int
}

type MetadataParent {
  id: ID!
  type: String!
}

type MetadataTemplate {
  id: ID!
  type: String!
  scope: String!
  templateKey: String!
  displayName: String!
  hidden: Boolean!
  copyInstanceOnItemCopy: Boolean!
  fields: [MetadataField!]!
  createdAt: DateTime
  modifiedAt: DateTime
}

type MetadataField {
  id: ID
  type: MetadataFieldType!
  key: String!
  displayName: String!
  hidden: Boolean
  description: String
  options: [MetadataFieldOption!]
}

type MetadataFieldOption {
  key: String!
  id: ID
}

type MetadataQuery {
  from: String!
  query: String
  queryParams: JSON
  ancestorFolderId: String!
  orderBy: [MetadataQueryOrderBy!]
  limit: Int
  marker: String
  fields: [String!]
}

type MetadataQueryOrderBy {
  fieldKey: String!
  direction: String!
}

type MetadataCascadePolicy {
  id: ID!
  type: String!
  ownerEnterprise: Enterprise
  parent: Folder
  scope: String!
  templateKey: String!
  createdAt: DateTime
  modifiedAt: DateTime
}

type FileMetadataUpdate {
  op: String!
  path: String!
  value: JSON
  from: String
}

# ──────────────────────────────────────────────
# Shared Links
# ──────────────────────────────────────────────

type SharedLink {
  url: String!
  downloadUrl: String
  vanityUrl: String
  vanityName: String
  access: AccessLevel!
  effectiveAccess: AccessLevel!
  effectivePermission: String!
  unsharedAt: DateTime
  isPasswordEnabled: Boolean!
  permissions: SharedLinkPermissions!
  downloadCount: Int!
  previewCount: Int!
}

type SharedLinkPermissions {
  canDownload: Boolean!
  canPreview: Boolean!
  canEdit: Boolean!
}

type SharedLinkSettings {
  access: AccessLevel
  password: String
  unsharedAt: DateTime
  vanityName: String
  permissions: SharedLinkPermissionsInput
}

type SharedLinkPermissionsInput {
  canDownload: Boolean
  canPreview: Boolean
  canEdit: Boolean
}

# ──────────────────────────────────────────────
# Comments & Tasks
# ──────────────────────────────────────────────

type Comment {
  id: ID!
  type: String!
  message: String!
  taggedMessage: String
  isReplyComment: Boolean!
  item: CommentItem
  createdBy: User
  createdAt: DateTime!
  modifiedAt: DateTime!
}

union CommentItem = File | Folder

type Task {
  id: ID!
  type: String!
  item: File!
  action: TaskAction!
  message: String
  dueAt: DateTime
  completionRule: String
  createdBy: User
  createdAt: DateTime!
  modifiedAt: DateTime!
  taskAssignmentCollection: TaskAssignmentPage
}

type TaskAssignmentPage {
  totalCount: Int!
  entries: [TaskAssignment!]!
}

type TaskAssignment {
  id: ID!
  type: String!
  item: File!
  assignedTo: User
  message: String
  remindedAt: DateTime
  resolutionState: TaskAssignmentStatus!
  completedAt: DateTime
  assignedAt: DateTime!
  assignedBy: User
}

# ──────────────────────────────────────────────
# Events
# ──────────────────────────────────────────────

type Event {
  eventId: ID!
  type: String!
  eventType: EventType!
  createdBy: User
  createdAt: DateTime!
  sessionId: String
  source: EventSource
  additionalDetails: JSON
}

type EventSource {
  itemType: String!
  itemId: ID!
  itemName: String!
  parent: Folder
  ownedBy: User
}

type EventStream {
  chunkSize: Int!
  nextStreamPosition: String!
  entries: [Event!]!
}

# ──────────────────────────────────────────────
# Collections
# ──────────────────────────────────────────────

type Collection {
  id: ID!
  type: String!
  name: String!
  collectionType: String!
}

type CollectionItem {
  totalCount: Int!
  limit: Int!
  offset: Int!
  entries: [FolderItem!]!
}

# ──────────────────────────────────────────────
# Search
# ──────────────────────────────────────────────

type Search {
  query: String!
  scope: String
  fileExtensions: [String!]
  createdAtRange: DateRange
  updatedAtRange: DateRange
  sizeRange: SizeRange
  ownerUserIds: [ID!]
  recentUpdaterUserIds: [ID!]
  ancestorFolderIds: [ID!]
  contentTypes: [String!]
  type: String
  trashContent: String
  metadataFilters: [MetadataFilter!]
  sort: String
  direction: String
  limit: Int
  offset: Int
  fields: [String!]
}

type SearchResult {
  totalCount: Int!
  limit: Int!
  offset: Int!
  entries: [SearchResultItem!]!
}

union SearchResultItem = File | Folder | WebLink

type DateRange {
  from: DateTime
  to: DateTime
}

type SizeRange {
  lowerBoundBytes: Int
  upperBoundBytes: Int
}

type MetadataFilter {
  scope: String!
  templateKey: String!
  filters: JSON!
}

# ──────────────────────────────────────────────
# Classification
# ──────────────────────────────────────────────

type Classification {
  id: ID!
  type: String!
  name: String!
  color: String
  description: String
  definition: String
}

# ──────────────────────────────────────────────
# Legal Hold
# ──────────────────────────────────────────────

type LegalHoldPolicy {
  id: ID!
  type: String!
  policyName: String!
  description: String
  status: LegalHoldPolicyStatus!
  assignmentCounts: LegalHoldAssignmentCounts!
  createdBy: User
  createdAt: DateTime!
  modifiedAt: DateTime!
  deletedAt: DateTime
  filterStartedAt: DateTime
  filterEndedAt: DateTime
  releaseNotes: String
}

type LegalHoldAssignmentCounts {
  user: Int!
  folder: Int!
  file: Int!
  fileVersion: Int!
}

type LegalHoldAssignment {
  id: ID!
  type: String!
  legalHoldPolicy: LegalHoldPolicy!
  assignedTo: LegalHoldTarget
  assignedBy: User
  assignedAt: DateTime!
  deletedAt: DateTime
}

union LegalHoldTarget = File | Folder | FileVersion | User

type LegalHold {
  id: ID!
  type: String!
  fileVersion: FileVersion!
  file: File!
  legalHoldPolicyAssignments: [LegalHoldAssignment!]!
  deletedAt: DateTime
}

# ──────────────────────────────────────────────
# Retention Policy
# ──────────────────────────────────────────────

type RetentionPolicy {
  id: ID!
  type: String!
  policyName: String!
  policyType: RetentionPolicyType!
  retentionLength: Int
  dispositionAction: RetentionPolicyDispositionAction!
  status: String!
  createdBy: User
  createdAt: DateTime!
  modifiedAt: DateTime!
  canOwnerExtendRetention: Boolean!
  areOwnersNotified: Boolean!
  customNotificationRecipients: [User!]
  assignmentCounts: RetentionAssignmentCounts!
  description: String
}

type RetentionAssignmentCounts {
  enterprise: Int!
  folder: Int!
  metadataTemplate: Int!
}

type RetentionPolicyAssignment {
  id: ID!
  type: String!
  retentionPolicy: RetentionPolicy!
  assignedTo: RetentionTarget
  filterFields: [MetadataFilter!]
  assignedBy: User
  assignedAt: DateTime!
  startDateField: String
}

union RetentionTarget = Folder | Enterprise | MetadataTemplate

type MetadataTemplate {
  id: ID!
  type: String!
  scope: String!
  templateKey: String!
  displayName: String!
}

# ──────────────────────────────────────────────
# Sign Requests
# ──────────────────────────────────────────────

type SignRequest {
  id: ID!
  type: String!
  status: SignRequestStatus!
  signers: [SignRequestSigner!]!
  sourceFiles: [File!]
  signFiles: SignFiles
  parentFolder: Folder
  prepareUrl: String
  signingLog: File
  templateId: String
  redirectUrl: String
  declinedRedirectUrl: String
  isDocumentPreparationNeeded: Boolean!
  emailSubject: String
  emailMessage: String
  reminderInterval: Int
  daysValid: Int
  externalId: String
  isPhoneVerificationRequired: Boolean
  prefillTags: [SignPrefillTag!]
  createdAt: DateTime!
  createdBy: User
}

type SignRequestSigner {
  email: String!
  role: SignRequestSignerRole!
  isInPerson: Boolean
  order: Int
  embedUrlExternalUserId: String
  hasViewedDocument: Boolean
  signerDecision: SignerDecision
  inputs: [SignInput!]
  embedUrl: String
  iframeableEmbedUrl: String
  redirectUrl: String
  declinedRedirectUrl: String
  loginRequired: Boolean
  verificationPhoneNumber: String
  suppressNotifications: Boolean
}

type SignerDecision {
  type: String
  finalizedAt: DateTime
  additionalInfo: String
}

type SignInput {
  type: String!
  checkboxValue: Boolean
  contentType: String
  dateValue: String
  documentTagId: String
  isRequired: Boolean
  pageIndex: Int!
  signerIndex: Int!
  text: String
  textValue: String
}

type SignPrefillTag {
  documentTagId: String!
  checkboxValue: Boolean
  dateValue: String
  textValue: String
}

type SignFiles {
  files: [File!]
  isReadyForDownload: Boolean
}

type SignFile {
  id: ID!
  type: String!
  name: String!
  signRequest: SignRequest
}

type Template {
  id: ID!
  type: String!
  name: String
  email: String
  daysValid: Int
  parentFolder: Folder
  sourceFiles: [File!]
  signers: [TemplateSigner!]
  readySignLink: ReadySignLink
  customBranding: CustomBranding
  additionalInfo: [String!]
  areEmailSettingsLocked: Boolean
  areFilesLocked: Boolean
  areRecipientsLocked: Boolean
}

type TemplateSigner {
  email: String
  label: String
  publicName: String
