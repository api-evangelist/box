}

# ──────────────────────────────────────────────
# SKU / Capabilities
# ──────────────────────────────────────────────

type SKU {
  id: ID!
  name: String!
  description: String
  features: [String!]
  apiCallsPerMonth: Int
  aiUnitsPerMonth: Int
  price: Float
