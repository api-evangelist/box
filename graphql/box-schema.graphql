# ──────────────────────────────────────────────

type StoragePolicy {
  id: ID!
  type: String!
  name: String!
}

type StoragePolicyAssignment {
  id: ID!
  type: String!
  storagePolicy: StoragePolicy!
  assignedTo: StoragePolicyTarget!
}

union StoragePolicyTarget = User | Enterprise

# ──────────────────────────────────────────────
# Webhooks
# ──────────────────────────────────────────────

type Webhook {
  id: ID!
  type: String!
  target: WebhookTarget!
  createdBy: User
  createdAt: DateTime!
  address: String!
