naftiko: 1.0.0-alpha2
info:
  label: Box Platform API — Transfer Folders
  description: 'Box Platform API — Transfer Folders. 1 operations. Lead operation: Box Transfer owned folders. Self-contained
    Naftiko capability covering one Box business surface.'
  tags:
  - Box
  - Transfer Folders
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BOX_API_KEY: BOX_API_KEY
capability:
  consumes:
  - type: http
    namespace: box-transfer-folders
    baseUri: https://api.box.com/2.0
    description: Box Platform API — Transfer Folders business capability. Self-contained, no shared references.
    resources:
    - name: users-user_id-folders-0
      path: /users/{user_id}/folders/0
      operations:
      - name: putusersidfolders0
        method: PUT
        description: Box Transfer owned folders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: user_id
          in: path
          type: string
          description: The ID of the user.
          required: true
        - name: fields
          in: query
          type: array
          description: A comma-separated list of attributes to include in the
        - name: notify
          in: query
          type: boolean
          description: Determines if users should receive email notification
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.BOX_API_KEY}}'
  exposes:
  - type: rest
    namespace: box-transfer-folders-rest
    port: 8080
    description: REST adapter for Box Platform API — Transfer Folders. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/users/{user-id}/folders/0
      name: users-user-id-folders-0
      description: REST surface for users-user_id-folders-0.
      operations:
      - method: PUT
        name: putusersidfolders0
        description: Box Transfer owned folders
        call: box-transfer-folders.putusersidfolders0
        with:
          user_id: rest.user_id
          fields: rest.fields
          notify: rest.notify
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: box-transfer-folders-mcp
    port: 9090
    transport: http
    description: MCP adapter for Box Platform API — Transfer Folders. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: box-transfer-owned-folders
      description: Box Transfer owned folders
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: box-transfer-folders.putusersidfolders0
      with:
        user_id: tools.user_id
        fields: tools.fields
        notify: tools.notify
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
