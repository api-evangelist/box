naftiko: 1.0.0-alpha2
info:
  label: Box Platform API — Invites
  description: 'Box Platform API — Invites. 2 operations. Lead operation: Box Create user invite. Self-contained Naftiko capability
    covering one Box business surface.'
  tags:
  - Box
  - Invites
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BOX_API_KEY: BOX_API_KEY
capability:
  consumes:
  - type: http
    namespace: box-invites
    baseUri: https://api.box.com/2.0
    description: Box Platform API — Invites business capability. Self-contained, no shared references.
    resources:
    - name: invites
      path: /invites
      operations:
      - name: postinvites
        method: POST
        description: Box Create user invite
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fields
          in: query
          type: array
          description: A comma-separated list of attributes to include in the
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: invites-invite_id
      path: /invites/{invite_id}
      operations:
      - name: getinvitesid
        method: GET
        description: Box Get user invite status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: invite_id
          in: path
          type: string
          description: The ID of an invite.
          required: true
        - name: fields
          in: query
          type: array
          description: A comma-separated list of attributes to include in the
    authentication:
      type: bearer
      token: '{{env.BOX_API_KEY}}'
  exposes:
  - type: rest
    namespace: box-invites-rest
    port: 8080
    description: REST adapter for Box Platform API — Invites. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/invites
      name: invites
      description: REST surface for invites.
      operations:
      - method: POST
        name: postinvites
        description: Box Create user invite
        call: box-invites.postinvites
        with:
          fields: rest.fields
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/invites/{invite-id}
      name: invites-invite-id
      description: REST surface for invites-invite_id.
      operations:
      - method: GET
        name: getinvitesid
        description: Box Get user invite status
        call: box-invites.getinvitesid
        with:
          invite_id: rest.invite_id
          fields: rest.fields
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: box-invites-mcp
    port: 9090
    transport: http
    description: MCP adapter for Box Platform API — Invites. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: box-create-user-invite
      description: Box Create user invite
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: box-invites.postinvites
      with:
        fields: tools.fields
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: box-get-user-invite-status
      description: Box Get user invite status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: box-invites.getinvitesid
      with:
        invite_id: tools.invite_id
        fields: tools.fields
      outputParameters:
      - type: object
        mapping: $.
