naftiko: 1.0.0-alpha2
info:
  label: Box Folder Locks API — Folder Locks
  description: 'Box Folder Locks API — Folder Locks. 3 operations. Lead operation: Box List folder locks. Self-contained Naftiko
    capability covering one Box business surface.'
  tags:
  - Box
  - Folder Locks
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BOX_API_KEY: BOX_API_KEY
capability:
  consumes:
  - type: http
    namespace: folder-locks-folder-locks
    baseUri: ''
    description: Box Folder Locks API — Folder Locks business capability. Self-contained, no shared references.
    resources:
    - name: folder_locks
      path: /folder_locks
      operations:
      - name: getfolderlocks
        method: GET
        description: Box List folder locks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: folder_id
          in: query
          type: string
          description: The unique identifier that represent a folder.
          required: true
      - name: postfolderlocks
        method: POST
        description: Box Create folder lock
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: folder_locks-folder_lock_id
      path: /folder_locks/{folder_lock_id}
      operations:
      - name: deletefolderlocksid
        method: DELETE
        description: Box Delete folder lock
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: folder_lock_id
          in: path
          type: string
          description: The ID of the folder lock.
          required: true
  exposes:
  - type: rest
    namespace: folder-locks-folder-locks-rest
    port: 8080
    description: REST adapter for Box Folder Locks API — Folder Locks. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/folder-locks
      name: folder-locks
      description: REST surface for folder_locks.
      operations:
      - method: GET
        name: getfolderlocks
        description: Box List folder locks
        call: folder-locks-folder-locks.getfolderlocks
        with:
          folder_id: rest.folder_id
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: postfolderlocks
        description: Box Create folder lock
        call: folder-locks-folder-locks.postfolderlocks
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/folder-locks/{folder-lock-id}
      name: folder-locks-folder-lock-id
      description: REST surface for folder_locks-folder_lock_id.
      operations:
      - method: DELETE
        name: deletefolderlocksid
        description: Box Delete folder lock
        call: folder-locks-folder-locks.deletefolderlocksid
        with:
          folder_lock_id: rest.folder_lock_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: folder-locks-folder-locks-mcp
    port: 9090
    transport: http
    description: MCP adapter for Box Folder Locks API — Folder Locks. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: box-list-folder-locks
      description: Box List folder locks
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: folder-locks-folder-locks.getfolderlocks
      with:
        folder_id: tools.folder_id
      outputParameters:
      - type: object
        mapping: $.
    - name: box-create-folder-lock
      description: Box Create folder lock
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: folder-locks-folder-locks.postfolderlocks
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: box-delete-folder-lock
      description: Box Delete folder lock
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: folder-locks-folder-locks.deletefolderlocksid
      with:
        folder_lock_id: tools.folder_lock_id
      outputParameters:
      - type: object
        mapping: $.
