naftiko: 1.0.0-alpha2
info:
  label: Box Platform API — Watermarks (Folders)
  description: 'Box Platform API — Watermarks (Folders). 3 operations. Lead operation: Box Get watermark for folder. Self-contained
    Naftiko capability covering one Box business surface.'
  tags:
  - Box
  - Watermarks (Folders)
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BOX_API_KEY: BOX_API_KEY
capability:
  consumes:
  - type: http
    namespace: box-watermarks-folders
    baseUri: https://api.box.com/2.0
    description: Box Platform API — Watermarks (Folders) business capability. Self-contained, no shared references.
    resources:
    - name: folders-folder_id-watermark
      path: /folders/{folder_id}/watermark
      operations:
      - name: getfoldersidwatermark
        method: GET
        description: Box Get watermark for folder
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: folder_id
          in: path
          type: string
          description: The unique identifier that represent a folder.
          required: true
      - name: putfoldersidwatermark
        method: PUT
        description: Box Apply watermark to folder
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: folder_id
          in: path
          type: string
          description: The unique identifier that represent a folder.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
      - name: deletefoldersidwatermark
        method: DELETE
        description: Box Remove watermark from folder
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: folder_id
          in: path
          type: string
          description: The unique identifier that represent a folder.
          required: true
    authentication:
      type: bearer
      token: '{{env.BOX_API_KEY}}'
  exposes:
  - type: rest
    namespace: box-watermarks-folders-rest
    port: 8080
    description: REST adapter for Box Platform API — Watermarks (Folders). One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/folders/{folder-id}/watermark
      name: folders-folder-id-watermark
      description: REST surface for folders-folder_id-watermark.
      operations:
      - method: GET
        name: getfoldersidwatermark
        description: Box Get watermark for folder
        call: box-watermarks-folders.getfoldersidwatermark
        with:
          folder_id: rest.folder_id
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putfoldersidwatermark
        description: Box Apply watermark to folder
        call: box-watermarks-folders.putfoldersidwatermark
        with:
          folder_id: rest.folder_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletefoldersidwatermark
        description: Box Remove watermark from folder
        call: box-watermarks-folders.deletefoldersidwatermark
        with:
          folder_id: rest.folder_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: box-watermarks-folders-mcp
    port: 9090
    transport: http
    description: MCP adapter for Box Platform API — Watermarks (Folders). One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: box-get-watermark-folder
      description: Box Get watermark for folder
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: box-watermarks-folders.getfoldersidwatermark
      with:
        folder_id: tools.folder_id
      outputParameters:
      - type: object
        mapping: $.
    - name: box-apply-watermark-folder
      description: Box Apply watermark to folder
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: box-watermarks-folders.putfoldersidwatermark
      with:
        folder_id: tools.folder_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: box-remove-watermark-folder
      description: Box Remove watermark from folder
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: box-watermarks-folders.deletefoldersidwatermark
      with:
        folder_id: tools.folder_id
      outputParameters:
      - type: object
        mapping: $.
