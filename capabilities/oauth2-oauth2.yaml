naftiko: 1.0.0-alpha2
info:
  label: Box Oauth2 API — Oauth2
  description: 'Box Oauth2 API — Oauth2. 3 operations. Lead operation: Box Revoke access token. Self-contained Naftiko capability
    covering one Box business surface.'
  tags:
  - Box
  - Oauth2
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BOX_API_KEY: BOX_API_KEY
capability:
  consumes:
  - type: http
    namespace: oauth2-oauth2
    baseUri: ''
    description: Box Oauth2 API — Oauth2 business capability. Self-contained, no shared references.
    resources:
    - name: oauth2-revoke
      path: /oauth2/revoke
      operations:
      - name: postoauth2revoke
        method: POST
        description: Box Revoke access token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: oauth2-token
      path: /oauth2/token
      operations:
      - name: postoauth2token
        method: POST
        description: Box Request access token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: oauth2-token#refresh
      path: /oauth2/token#refresh
      operations:
      - name: postoauth2tokenrefresh
        method: POST
        description: Box Refresh access token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: oauth2-oauth2-rest
    port: 8080
    description: REST adapter for Box Oauth2 API — Oauth2. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/oauth2/revoke
      name: oauth2-revoke
      description: REST surface for oauth2-revoke.
      operations:
      - method: POST
        name: postoauth2revoke
        description: Box Revoke access token
        call: oauth2-oauth2.postoauth2revoke
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/oauth2/token
      name: oauth2-token
      description: REST surface for oauth2-token.
      operations:
      - method: POST
        name: postoauth2token
        description: Box Request access token
        call: oauth2-oauth2.postoauth2token
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/oauth2/token-refresh
      name: oauth2-token-refresh
      description: REST surface for oauth2-token#refresh.
      operations:
      - method: POST
        name: postoauth2tokenrefresh
        description: Box Refresh access token
        call: oauth2-oauth2.postoauth2tokenrefresh
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: oauth2-oauth2-mcp
    port: 9090
    transport: http
    description: MCP adapter for Box Oauth2 API — Oauth2. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: box-revoke-access-token
      description: Box Revoke access token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: oauth2-oauth2.postoauth2revoke
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: box-request-access-token
      description: Box Request access token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: oauth2-oauth2.postoauth2token
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: box-refresh-access-token
      description: Box Refresh access token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: oauth2-oauth2.postoauth2tokenrefresh
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
