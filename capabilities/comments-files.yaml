naftiko: 1.0.0-alpha2
info:
  label: Box Comments API — Files
  description: 'Box Comments API — Files. 1 operations. Lead operation: Box List file comments. Self-contained Naftiko capability
    covering one Box business surface.'
  tags:
  - Box
  - Files
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BOX_API_KEY: BOX_API_KEY
capability:
  consumes:
  - type: http
    namespace: comments-files
    baseUri: ''
    description: Box Comments API — Files business capability. Self-contained, no shared references.
    resources:
    - name: files-file_id-comments
      path: /files/{file_id}/comments
      operations:
      - name: getfilesidcomments
        method: GET
        description: Box List file comments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: file_id
          in: path
          type: string
          description: The unique identifier that represents a file.
          required: true
        - name: fields
          in: query
          type: array
          description: A comma-separated list of attributes to include in the
        - name: limit
          in: query
          type: integer
          description: The maximum number of items to return per page.
        - name: offset
          in: query
          type: integer
          description: The offset of the item at which to begin the response.
  exposes:
  - type: rest
    namespace: comments-files-rest
    port: 8080
    description: REST adapter for Box Comments API — Files. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/files/{file-id}/comments
      name: files-file-id-comments
      description: REST surface for files-file_id-comments.
      operations:
      - method: GET
        name: getfilesidcomments
        description: Box List file comments
        call: comments-files.getfilesidcomments
        with:
          file_id: rest.file_id
          fields: rest.fields
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: comments-files-mcp
    port: 9090
    transport: http
    description: MCP adapter for Box Comments API — Files. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: box-list-file-comments
      description: Box List file comments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: comments-files.getfilesidcomments
      with:
        file_id: tools.file_id
        fields: tools.fields
        limit: tools.limit
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
