        idempotent: true
      call: box-comments.getcommentsid
      with:
        comment_id: tools.comment_id
        fields: tools.fields
      outputParameters:
      - type: object
        mapping: $.
    - name: box-update-comment
      description: Box Update comment
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: box-comments.putcommentsid
      with:
        comment_id: tools.comment_id
        fields: tools.fields
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: box-remove-comment
      description: Box Remove comment
      hints:
