naftiko: 1.0.0-alpha2
info:
  label: Box Platform API — Collections
  description: 'Box Platform API — Collections. 2 operations. Lead operation: Box List all collections. Self-contained Naftiko
    capability covering one Box business surface.'
  tags:
  - Box
  - Collections
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BOX_API_KEY: BOX_API_KEY
capability:
  consumes:
  - type: http
    namespace: box-collections
    baseUri: https://api.box.com/2.0
    description: Box Platform API — Collections business capability. Self-contained, no shared references.
    resources:
    - name: collections
      path: /collections
      operations:
      - name: getcollections
        method: GET
        description: Box List all collections
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fields
          in: query
          type: array
          description: A comma-separated list of attributes to include in the
        - name: offset
          in: query
          type: integer
          description: The offset of the item at which to begin the response.
        - name: limit
          in: query
          type: integer
          description: The maximum number of items to return per page.
    - name: collections-collection_id-items
      path: /collections/{collection_id}/items
      operations:
      - name: getcollectionsiditems
        method: GET
        description: Box List collection items
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: collection_id
          in: path
          type: string
          description: The ID of the collection.
          required: true
        - name: fields
          in: query
          type: array
          description: A comma-separated list of attributes to include in the
        - name: offset
          in: query
          type: integer
          description: The offset of the item at which to begin the response.
        - name: limit
          in: query
          type: integer
          description: The maximum number of items to return per page.
    authentication:
      type: bearer
      token: '{{env.BOX_API_KEY}}'
  exposes:
  - type: rest
    namespace: box-collections-rest
    port: 8080
    description: REST adapter for Box Platform API — Collections. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/collections
      name: collections
      description: REST surface for collections.
      operations:
      - method: GET
        name: getcollections
        description: Box List all collections
        call: box-collections.getcollections
        with:
          fields: rest.fields
          offset: rest.offset
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/collections/{collection-id}/items
      name: collections-collection-id-items
      description: REST surface for collections-collection_id-items.
      operations:
      - method: GET
        name: getcollectionsiditems
        description: Box List collection items
        call: box-collections.getcollectionsiditems
        with:
          collection_id: rest.collection_id
          fields: rest.fields
          offset: rest.offset
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: box-collections-mcp
    port: 9090
    transport: http
    description: MCP adapter for Box Platform API — Collections. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: box-list-all-collections
      description: Box List all collections
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: box-collections.getcollections
      with:
        fields: tools.fields
        offset: tools.offset
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: box-list-collection-items
      description: Box List collection items
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: box-collections.getcollectionsiditems
      with:
        collection_id: tools.collection_id
        fields: tools.fields
        offset: tools.offset
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
