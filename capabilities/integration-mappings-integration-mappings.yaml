naftiko: 1.0.0-alpha2
info:
  label: Box Integration Mappings API — Integration Mappings
  description: 'Box Integration Mappings API — Integration Mappings. 4 operations. Lead operation: Box List Slack integration
    mappings. Self-contained Naftiko capability covering one Box business surface.'
  tags:
  - Box
  - Integration Mappings
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BOX_API_KEY: BOX_API_KEY
capability:
  consumes:
  - type: http
    namespace: integration-mappings-integration-mappings
    baseUri: ''
    description: Box Integration Mappings API — Integration Mappings business capability. Self-contained, no shared references.
    resources:
    - name: integration_mappings-slack
      path: /integration_mappings/slack
      operations:
      - name: getintegrationmappingsslack
        method: GET
        description: Box List Slack integration mappings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: marker
          in: query
          type: string
          description: Defines the position marker at which to begin returning results. This is
        - name: limit
          in: query
          type: integer
          description: The maximum number of items to return per page.
        - name: partner_item_type
          in: query
          type: string
          description: Mapped item type, for which the mapping should be returned
        - name: partner_item_id
          in: query
          type: string
          description: ID of the mapped item, for which the mapping should be returned
        - name: box_item_id
          in: query
          type: string
          description: Box item ID, for which the mappings should be returned
        - name: box_item_type
          in: query
          type: string
          description: Box item type, for which the mappings should be returned
        - name: is_manually_created
          in: query
          type: boolean
          description: Whether the mapping has been manually created
      - name: postintegrationmappingsslack
        method: POST
        description: Box Create Slack integration mapping
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: integration_mappings-slack-integration_mapping_id
      path: /integration_mappings/slack/{integration_mapping_id}
      operations:
      - name: putintegrationmappingsslackid
        method: PUT
        description: Box Update Slack integration mapping
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: integration_mapping_id
          in: path
          type: string
          description: An ID of an integration mapping
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
      - name: deleteintegrationmappingsslackid
        method: DELETE
        description: Box Delete Slack integration mapping
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: integration_mapping_id
          in: path
          type: string
          description: An ID of an integration mapping
          required: true
  exposes:
  - type: rest
    namespace: integration-mappings-integration-mappings-rest
    port: 8080
    description: REST adapter for Box Integration Mappings API — Integration Mappings. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/integration-mappings/slack
      name: integration-mappings-slack
      description: REST surface for integration_mappings-slack.
      operations:
      - method: GET
        name: getintegrationmappingsslack
        description: Box List Slack integration mappings
        call: integration-mappings-integration-mappings.getintegrationmappingsslack
        with:
          marker: rest.marker
          limit: rest.limit
          partner_item_type: rest.partner_item_type
          partner_item_id: rest.partner_item_id
          box_item_id: rest.box_item_id
          box_item_type: rest.box_item_type
          is_manually_created: rest.is_manually_created
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: postintegrationmappingsslack
        description: Box Create Slack integration mapping
        call: integration-mappings-integration-mappings.postintegrationmappingsslack
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/integration-mappings/slack/{integration-mapping-id}
      name: integration-mappings-slack-integration-mapping-id
      description: REST surface for integration_mappings-slack-integration_mapping_id.
      operations:
      - method: PUT
        name: putintegrationmappingsslackid
        description: Box Update Slack integration mapping
        call: integration-mappings-integration-mappings.putintegrationmappingsslackid
        with:
          integration_mapping_id: rest.integration_mapping_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteintegrationmappingsslackid
        description: Box Delete Slack integration mapping
        call: integration-mappings-integration-mappings.deleteintegrationmappingsslackid
        with:
          integration_mapping_id: rest.integration_mapping_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: integration-mappings-integration-mappings-mcp
    port: 9090
    transport: http
    description: MCP adapter for Box Integration Mappings API — Integration Mappings. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: box-list-slack-integration-mappings
      description: Box List Slack integration mappings
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: integration-mappings-integration-mappings.getintegrationmappingsslack
      with:
        marker: tools.marker
        limit: tools.limit
        partner_item_type: tools.partner_item_type
        partner_item_id: tools.partner_item_id
        box_item_id: tools.box_item_id
        box_item_type: tools.box_item_type
        is_manually_created: tools.is_manually_created
      outputParameters:
      - type: object
        mapping: $.
    - name: box-create-slack-integration-mapping
      description: Box Create Slack integration mapping
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: integration-mappings-integration-mappings.postintegrationmappingsslack
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: box-update-slack-integration-mapping
      description: Box Update Slack integration mapping
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: integration-mappings-integration-mappings.putintegrationmappingsslackid
      with:
        integration_mapping_id: tools.integration_mapping_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: box-delete-slack-integration-mapping
      description: Box Delete Slack integration mapping
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: integration-mappings-integration-mappings.deleteintegrationmappingsslackid
      with:
        integration_mapping_id: tools.integration_mapping_id
      outputParameters:
      - type: object
        mapping: $.
