naftiko: 1.0.0-alpha2
info:
  label: Box Zip Downloads API — Zip Downloads
  description: 'Box Zip Downloads API — Zip Downloads. 3 operations. Lead operation: Box Create zip download. Self-contained
    Naftiko capability covering one Box business surface.'
  tags:
  - Box
  - Zip Downloads
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BOX_API_KEY: BOX_API_KEY
capability:
  consumes:
  - type: http
    namespace: zip-downloads-zip-downloads
    baseUri: ''
    description: Box Zip Downloads API — Zip Downloads business capability. Self-contained, no shared references.
    resources:
    - name: zip_downloads
      path: /zip_downloads
      operations:
      - name: postzipdownloads
        method: POST
        description: Box Create zip download
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: zip_downloads-zip_download_id-content
      path: /zip_downloads/{zip_download_id}/content
      operations:
      - name: getzipdownloadsidcontent
        method: GET
        description: Box Download zip archive
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: zip_download_id
          in: path
          type: string
          description: The unique identifier that represent this `zip` archive.
          required: true
    - name: zip_downloads-zip_download_id-status
      path: /zip_downloads/{zip_download_id}/status
      operations:
      - name: getzipdownloadsidstatus
        method: GET
        description: Box Get zip download status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: zip_download_id
          in: path
          type: string
          description: The unique identifier that represent this `zip` archive.
          required: true
  exposes:
  - type: rest
    namespace: zip-downloads-zip-downloads-rest
    port: 8080
    description: REST adapter for Box Zip Downloads API — Zip Downloads. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/zip-downloads
      name: zip-downloads
      description: REST surface for zip_downloads.
      operations:
      - method: POST
        name: postzipdownloads
        description: Box Create zip download
        call: zip-downloads-zip-downloads.postzipdownloads
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/zip-downloads/{zip-download-id}/content
      name: zip-downloads-zip-download-id-content
      description: REST surface for zip_downloads-zip_download_id-content.
      operations:
      - method: GET
        name: getzipdownloadsidcontent
        description: Box Download zip archive
        call: zip-downloads-zip-downloads.getzipdownloadsidcontent
        with:
          zip_download_id: rest.zip_download_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/zip-downloads/{zip-download-id}/status
      name: zip-downloads-zip-download-id-status
      description: REST surface for zip_downloads-zip_download_id-status.
      operations:
      - method: GET
        name: getzipdownloadsidstatus
        description: Box Get zip download status
        call: zip-downloads-zip-downloads.getzipdownloadsidstatus
        with:
          zip_download_id: rest.zip_download_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: zip-downloads-zip-downloads-mcp
    port: 9090
    transport: http
    description: MCP adapter for Box Zip Downloads API — Zip Downloads. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: box-create-zip-download
      description: Box Create zip download
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: zip-downloads-zip-downloads.postzipdownloads
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: box-download-zip-archive
      description: Box Download zip archive
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: zip-downloads-zip-downloads.getzipdownloadsidcontent
      with:
        zip_download_id: tools.zip_download_id
      outputParameters:
      - type: object
        mapping: $.
    - name: box-get-zip-download-status
      description: Box Get zip download status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: zip-downloads-zip-downloads.getzipdownloadsidstatus
      with:
        zip_download_id: tools.zip_download_id
      outputParameters:
      - type: object
        mapping: $.
