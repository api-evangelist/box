naftiko: 1.0.0-alpha2
info:
  label: Box Platform API — Events
  description: 'Box Platform API — Events. 2 operations. Lead operation: Box Get events long poll endpoint. Self-contained
    Naftiko capability covering one Box business surface.'
  tags:
  - Box
  - Events
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BOX_API_KEY: BOX_API_KEY
capability:
  consumes:
  - type: http
    namespace: box-events
    baseUri: https://api.box.com/2.0
    description: Box Platform API — Events business capability. Self-contained, no shared references.
    resources:
    - name: events
      path: /events
      operations:
      - name: optionsevents
        method: OPTIONS
        description: Box Get events long poll endpoint
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getevents
        method: GET
        description: Box List user and enterprise events
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: stream_type
          in: query
          type: string
          description: Defines the type of events that are returned
        - name: stream_position
          in: query
          type: string
          description: The location in the event stream to start receiving events from.
        - name: limit
          in: query
          type: integer
          description: Limits the number of events returned
        - name: event_type
          in: query
          type: array
          description: A comma-separated list of events to filter by. This can only be used when
        - name: created_after
          in: query
          type: string
          description: The lower bound date and time to return events for. This can only be used
        - name: created_before
          in: query
          type: string
          description: The upper bound date and time to return events for. This can only be used
    authentication:
      type: bearer
      token: '{{env.BOX_API_KEY}}'
  exposes:
  - type: rest
    namespace: box-events-rest
    port: 8080
    description: REST adapter for Box Platform API — Events. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/events
      name: events
      description: REST surface for events.
      operations:
      - method: OPTIONS
        name: optionsevents
        description: Box Get events long poll endpoint
        call: box-events.optionsevents
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: getevents
        description: Box List user and enterprise events
        call: box-events.getevents
        with:
          stream_type: rest.stream_type
          stream_position: rest.stream_position
          limit: rest.limit
          event_type: rest.event_type
          created_after: rest.created_after
          created_before: rest.created_before
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: box-events-mcp
    port: 9090
    transport: http
    description: MCP adapter for Box Platform API — Events. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: box-get-events-long-poll
      description: Box Get events long poll endpoint
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: box-events.optionsevents
      outputParameters:
      - type: object
        mapping: $.
    - name: box-list-user-and-enterprise
      description: Box List user and enterprise events
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: box-events.getevents
      with:
        stream_type: tools.stream_type
        stream_position: tools.stream_position
        limit: tools.limit
        event_type: tools.event_type
        created_after: tools.created_after
        created_before: tools.created_before
      outputParameters:
      - type: object
        mapping: $.
