name: Box Domain Vocabulary
provider: Box
providerId: box
description: Tag-derived vocabulary for the Box API surface; sourced from openapi/ tags.
terms:
- term: Authorization
  description: 'A set of endpoints used to

    manage user authorization process.'
- term: Classifications
  description: 'Classification labels are

    used for content that is

    sensitive or under security

    restrictions.'
- term: Classifications on Files
  description: 'Classification labels are

    used for files that are

    sensitive or under security

    restrictions.'
- term: Classifications on Folders
  description: 'Classification labels are

    used for folders that are

    sensitive or under security

    restrictions.'
- term: Collaborations
  description: 'Collaborations define access permissions

    for users and groups to files and folders,

    similar to access control lists.'
- term: Collaborations (List)
  description: 'A set of endpoints used to

    retrieve file, folder,

    pending, and group collaborations.'
- term: Collections
  description: 'Collections are a way to group files,

    folders, and web links without putting them

    all into a folder.'
- term: Comments
  description: 'Comments are messages generated users on files,

    allowing users to collaborate on a file,

    discussing any feedback they might

    have on the content.'
- term: Device Pinners
  description: 'Device pinners allow enterprises to

    control what devices can use

    native Box applications.'
- term: Domain Restrictions (User Exemptions)
  description: 'A set of endpoints that allow exempting users

    from restrictions imposed by the list of

    allowed collaboration domains for a specific enterprise.'
- term: Domain Restrictions for Collaborations
  description: 'A set of endpoints that manage domains for which users

    can collaborate with files and folders in an enterprise.'
- term: Downloads
  description: 'Downloads allow saving files to the application''s server,

    or directly by the end user in a browser.'
- term: Email Aliases
  description: 'Email aliases provide a list of emails additional

    to the user''s primary login email.'
- term: Events
  description: 'Events provide a way for an

    application to subscribe to

    any actions performed by

    any user, users, or service in an enterprise.'
- term: File Requests
  description: 'File Requests provide a fast and

    secure way to request files and associated metadata

    from anyone.

    Users can create new file requests

    based on an existing file request,

    update file request settings, activate, deactivate, and delete

    file requests programmatically.'
- term: File Version Legal Holds
  description: 'A legal hold is a process that an enterprise

    can use to preserve all forms of potentially relevant

    information when

    litigation is pending or reasonably anticipated.

    A File Version Legal Hold represents all the policies that

    are assigned to a specific file version.'
- term: File Version Retentions
  description: 'A retention policy blocks permanent

    deletion of content for a specified amount of time.

    A file version retention is a record for a retained file.'
- term: File Versions
  description: 'A set of endpoints used to manage specific

    versions of a file.'
- term: Files
  description: 'Files, together with Folders,

    are at the core of the Box API.

    Files can be uploaded and downloaded,

    as well as hold important metadata

    information about the content.'
- term: Folder Locks
  description: 'Folder locks define access restrictions

    placed by folder owners to prevent

    specific folders from being moved or deleted.'
- term: Folders
  description: 'Folders, together with Files,

    are at the core of the Box API.

    Folders can be uploaded and downloaded,

    as well as hold important metadata

    information about the content.'
- term: Group Memberships
  description: 'Group memberships signify that

    a user is a part of the group.'
- term: Groups
  description: Groups created in an enterprise.
- term: Integration Mappings
  description: 'Integration Mappings allow the users

    to manage where content from partner apps is stored in Box.'
- term: Invites
  description: 'Invites are used to invite the user to

    an enterprise.'
- term: Legal Hold Policies
  description: 'A legal hold is a process that an enterprise

    can use to preserve all forms of potentially

    relevant information when litigation is pending or

    reasonably anticipated.'
- term: Legal Hold Policy Assignments
  description: 'A Legal Hold Policy Assignment

    is a relation between a policy and custodian.

    In this case, as custodian can be a user, folder,

    file, or file version.'
- term: Metadata Cascade Policies
  description: 'A metadata cascade policy describes how metadata

    instances applied to a folder should be applied

    to any item within that folder.'
- term: Metadata Instances (Files)
  description: 'A metadata instance describes

    the relation between a template and a file,

    including the values that are assigned for every field.'
- term: Metadata Instances (Folders)
  description: 'A metadata instance describes the relation between a template and a folder,

    including the values that are assigned for every field.'
- term: Metadata Templates
  description: 'A metadata template describes a reusable set

    of key/value pairs that can be assigned to a file.'
- term: Recent Items
  description: 'Recent items represent items such

    as files or folders that

    the user accessed recently.'
- term: Retention Policies
  description: 'A retention policy blocks permanent deletion of content

    for a specified amount of time. Admins can create

    retention policies and then assign them to

    specific folders or their entire enterprise.'
- term: Retention Policy Assignments
  description: 'A Retention Policy Assignment is a relation

    between a policy and folder or enterprise.

    Creating an assignment puts a retention on

    all the file versions that belong to that folder or enterprise.'
- term: Search
  description: 'The Box API provides a way to find content in Box

    using full-text search queries.'
- term: Session Termination
  description: 'Session termination API is used to

    validate the roles and permissions of the group,

    and creates asynchronous jobs to terminate the group''s sessions.'
- term: Shared Links (Files)
  description: 'Files shared links are URLs that are generated for files stored in Box,

    which provide direct, read-only access to the resource.'
- term: Shared Links (Folders)
  description: 'Folders shared links are URLs that are generated for folders stored in Box,

    which provide direct, read-only access to the resource.'
- term: Shared Links (Web Links)
  description: 'Web links for files are URLs that are generated

    for web links in Box,

    which provide direct, read-only access to the resource.'
- term: Shield Information Barrier Reports
  description: 'Shield information barrier reports

    contain information on what existing collaborations

    will be removed permanently when the information barrier is enabled.'
- term: Shield Information Barrier Segment Members
  description: 'Shield information barrier segment member

    represents a user that is assigned to a

    specific segment.'
- term: Shield Information Barrier Segment Restrictions
  description: 'Shield information barrier segment restriction is

    an access restriction based on the content (file or folder) owner.'
- term: Shield Information Barrier Segments
  description: 'Shield information barrier segment represents

    a defined group of users. A user can be a member

    of only one segment, which makes segments

    different from groups.'
- term: Shield Information Barriers
  description: 'Shield information barrier in Box defines an ethical wall.

    An ethical wall is a mechanism that prevents exchanges or communication that

    could lead to conflicts of interest and therefore result in

    business activities ethically or legally questionable.'
- term: Sign Requests
  description: 'Sign requests are used

    to submit a file for

    signature.'
- term: Sign Templates
  description: 'Sign templates allow you to use a predefined Box Sign

    template when creating a sign request.

    The template includes placeholders that

    are automatically populated with data when creating the request.'
- term: Skills
  description: 'Box Skills are designed to allow custom processing

    of files uploaded to Box, with the

    intent of enhancing the underlying metadata of the file.'
- term: Standard and Zones Storage Policies
  description: 'Storage policy assignment represents the

    storage zone for items in a given enterprise.'
- term: Standard and Zones Storage Policy Assignments
  description: 'Storage policy assignment represents the

    relation between storage zone and the

    assigned item (for example a file stored

    in a specific zone).'
- term: Task Assignments
  description: 'A task assignment defines which

    task is assigned to which user to complete.'
- term: Tasks
  description: 'Tasks allow users to request collaborators on a file

    to review a file or complete a piece of work.

    Tasks can be used by developers to create file-centric workflows.'
- term: Terms of Service
  description: 'A set of endpoints used to

    manage terms of service agreements.'
- term: Terms of Service User Statuses
  description: 'A set of endpoints used to

    manage the status of terms of service

    for a particular user.'
- term: Transfer Folders
  description: 'API designed to move all of the items

    (files, folders and workflows)

    owned by a user into another user''s account.'
- term: Trashed Files
  description: 'Files that were deleted and

    are in trash.'
- term: Trashed Folders
  description: 'Folders that were deleted and

    are in trash.'
- term: Trashed Items
  description: 'Items that were deleted and

    are in trash.'
- term: Trashed Web Links
  description: 'Web links that were deleted and

    are in trash.'
- term: Uploads
  description: 'The direct file upload API supports files

    up to 50MB in size and sends all

    the binary data to the Box API in 1 API request.'
- term: Uploads (Chunked)
  description: 'The chunked upload endpoints support files from

    20MB in size and allow an application

    to upload the file in parts,

    allowing for more control to catch any errors

    and retry parts individually.'
- term: User Avatars
  description: 'User avatars are JPG or PNG files

    uploaded to Box to represent the

    user image. They are then displayed

    in the user account.'
- term: Users
  description: 'Box API supports a variety of users,

    ranging from real employees

    logging in with their Managed User account,

    to applications using App Users to drive powerful

    automation workflows.'
- term: Watermarks (Files)
  description: 'A watermark is a semi-transparent

    overlay on an embedded file

    preview that displays a viewer''s email address

    or user ID and the time of access over

    the file.'
- term: Watermarks (Folders)
  description: 'A watermark is a semi-transparent overlay on an embedded folder

    preview that displays a viewer''s email address or user ID

    and the time of access over

    the folder content.'
- term: Web Links
  description: 'Web links are objects that point to URLs.

    These objects are also known as bookmarks

    within the Box web application.'
- term: Webhooks
  description: 'Webhooks allow you to monitor Box content for events,

    and receive notifications to a URL of your choice when they occur.

    For example, a workflow may include waiting

    for a file to be downloaded to delete a shared link.'
- term: Workflows
  description: 'Box Relay Workflows are objects that represent

    a named collection of flows.'
- term: Zip Downloads
  description: 'Zip downloads represent a successful request

    to create a ZIP archive with files and folders.'
